<script>
  // 把产物里那段模块脚本原样留下，但先不让它执行：换成 text/plain，
  // 等上面那段把 z 挂好之后再手动放行。
  (function () {
    var 脚本表 = document.querySelectorAll('script[type="module"]');
    脚本表.forEach(function (节点) {
      if (节点.textContent.indexOf('__WEBPACK') >= 0 || 节点.textContent.indexOf('createApp') >= 0) {
        节点.setAttribute('type', 'text/预览待放行');
        节点.id = '预览主脚本';
      }
    });
  })();
</script><div id="app"></div>
<div id="预览报错" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;padding:10px 12px;background:#3a2b2b;color:#ffd9d9;font:12px/1.5 monospace;white-space:pre-wrap;z-index:9999;pointer-events:none"></div>
<script>
  // 页面空着就说明入口没跑完，把抓到的报错摊开，别让人对着白屏猜。
  window.setTimeout(() => {
    const 挂上没 = document.querySelector('#app')?.children.length > 0;
    const 内容 = document.querySelector('#app')?.innerHTML.length ?? 0;
    __记报错('两秒半后检查：#app 子节点 ' + (挂上没 ? '有' : '无') + '，字节 ' + 内容);
  }, 2500);
</script>
<script>
  window.setTimeout(function () {
    var 主 = document.getElementById('预览主脚本');
    if (!主) { __记报错('没找到产物的模块脚本，预览页的放行逻辑要跟着产物结构改。'); return; }
    // 产物是 ES module，正文里带 import 语句，不能靠 textContent 塞回页面（内联模块不允许 import）。
    // 所以把它做成 blob 再按 module 加载；外链依赖是绝对 CDN 地址，不受 blob 的基地址影响。
    var 源 = 主.textContent;
    var 址 = URL.createObjectURL(new Blob([源], { type: 'text/javascript' }));
    var 新 = document.createElement('script');
    新.type = 'module';
    新.src = 址;
    新.onerror = function () { __记报错('主脚本加载失败。'); };
    document.body.appendChild(新);
  }, 60);
</script></body>
