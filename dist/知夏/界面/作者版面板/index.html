<!DOCTYPE html>
<!--
  知夏 · 电子宠物面板（作者版 · 已接酒馆变量）
  放进公开仓库由 jsDelivr 提供，角色卡的正则把 [养成面板] 换成加载这个页面的语句。

  数据来源：本面板不再自己存档。所有数字都读写角色卡的变量（MVU 的 stat_data），
  和挂机结算脚本、正文里的变量更新规则共用同一份。所以在这个面板上喂她一口饭，
  正文下一轮就会知道；正文说她饿了，这个面板也会跟着变。

  改动记录（相对作者初版）：
  - 去掉 localStorage 存档，改成读写 stat_data
  - 六个 emoji 图标换成汉字，四列布局补成七格
  - 状态条沿用原配色，数值取自变量
  - 出工不再自己发钱：玩小游戏在另一块面板的「挣」页，这里是今日出工状态
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>知夏 · 电子宠物养成面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    body {
      background: #1c1917;
      color: #f5f5f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      padding: 10px;
    }
    .panel-container {
      width: 100%;
      max-width: 480px;
      background: #292524;
      border: 3px solid #78350f;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(180,83,9,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-bar {
      background: linear-gradient(180deg, #1c1917 0%, #292524 100%);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #44403c;
      gap: 8px;
    }
    .date-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1c1917;
      border: 1px solid #78350f;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #fef3c7;
      white-space: nowrap;
    }
    .date-badge .seal {
      font-size: 10px;
      color: #b45309;
      letter-spacing: 0.1em;
    }
    .clock-badge {
      font-size: 11px;
      color: #a8a29e;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .money-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #451a03;
      border: 1px solid #b45309;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #fde68a;
      font-family: monospace;
    }
    .notice {
      display: none;
      padding: 7px 14px;
      background: #0c0a09;
      border-bottom: 1px solid #44403c;
      font-size: 11.5px;
      line-height: 1.5;
      color: #fcd34d;
    }
    .notice.show { display: block; }
    .pet-screen {
      position: relative;
      flex: 1 1 auto;
      min-height: 240px;
      background: #0c0a09;
      overflow: hidden;
    }
    .screen-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
      transition: filter 0.5s;
    }
    .room-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(251,191,36,0.18) 0%, rgba(12,10,9,0.6) 80%);
      pointer-events: none;
    }
    .bulb-fixture {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 3;
    }
    .bulb-cord { width: 2px; height: 30px; background: #57534e; }
    .bulb-glass {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fef08a;
      box-shadow: 0 0 25px 12px rgba(253, 224, 71, 0.6);
      transition: all 0.3s;
    }
    .bulb-glass.off { background: #78716c; box-shadow: none; }
    .screen-corner {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 11px;
      color: #d6d3d1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      z-index: 3;
    }
    .zhixia-char-wrap {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 2;
    }
    .speech-bubble {
      background: rgba(255, 251, 235, 0.95);
      color: #292524;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 260px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      position: relative;
      border: 1.5px solid #b45309;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: #fffbeb;
      border-right: 1.5px solid #b45309;
      border-bottom: 1.5px solid #b45309;
    }
    .char-sprite-box {
      width: 140px;
      height: 190px;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid #b45309;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      position: relative;
      background: #1c1917;
      transition: transform 0.2s;
    }
    .char-sprite-box:active { transform: scale(0.96); }
    .char-sprite-box img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .char-sprite-box .no-art {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #78716c;
      text-align: center;
      line-height: 1.6;
      padding: 10px;
    }
    .sickness-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      animation: pulse 1.5s infinite;
      z-index: 4;
    }
    .link-error {
      display: none;
      margin: 10px 14px 0;
      padding: 9px 11px;
      border-left: 3px solid #dc2626;
      background: #1c1917;
      font-size: 11.5px;
      line-height: 1.6;
      color: #fca5a5;
    }
    .link-error.show { display: block; }
    .vitals-bar {
      display: flex;
      justify-content: space-around;
      background: #1c1917;
      padding: 8px 10px;
      border-top: 1px solid #44403c;
      border-bottom: 1px solid #44403c;
    }
    .vital-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .vital-label { font-size: 11px; color: #a8a29e; }
    .vital-label b { color: #f5f5f4; font-variant-numeric: tabular-nums; }
    .progress-track {
      width: 65px;
      height: 8px;
      background: #292524;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #57534e;
    }
    .progress-fill { height: 100%; transition: width 0.4s ease; }
    .fill-hunger { background: #f59e0b; }
    .fill-mood { background: #eab308; }
    .fill-health { background: #10b981; }
    .fill-energy { background: #3b82f6; }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      background: #1c1917;
    }
    .act-btn {
      background: #292524;
      border: 1.5px solid #57534e;
      color: #e7e5e4;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .act-btn:active { transform: translateY(2px); background: #44403c; }
    .act-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .act-btn span.icon {
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      border-radius: 8px;
      background: #1c1917;
      font-size: 13px;
      color: #fbbf24;
    }
    .act-btn.primary { background: #78350f; border-color: #d97706; color: #fef3c7; }
    .act-btn.primary span.icon { background: #4a1d06; color: #fde68a; }
    .act-btn.green { background: #064e3b; border-color: #059669; color: #d1fae5; }
    .act-btn.green span.icon { background: #032b21; color: #6ee7b7; }
    .act-btn.blue { background: #1e3a8a; border-color: #3b82f6; color: #dbeafe; }
    .act-btn.blue span.icon { background: #14275c; color: #93c5fd; }
    .sub-dialog {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(12,10,9,0.94);
      backdrop-filter: blur(4px);
      z-index: 50;
      flex-direction: column;
      padding: 16px;
    }
    .sub-dialog.active { display: flex; }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #44403c;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .dialog-title { font-size: 15px; font-weight: bold; color: #fef3c7; }
    .close-btn {
      background: #44403c;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .dialog-body { flex: 1; overflow-y: auto; }
    .item-card {
      background: #292524;
      border: 1px solid #57534e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .item-info h4 { font-size: 13px; color: #f5f5f4; margin-bottom: 3px; }
    .item-info p { font-size: 11px; color: #a8a29e; }
    .item-act-btn {
      background: #d97706;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .item-act-btn:disabled { background: #57534e; color: #a8a29e; cursor: not-allowed; }
    .dialog-note {
      font-size: 11px;
      color: #a8a29e;
      line-height: 1.6;
      padding: 4px 2px 10px;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<div class="panel-container">
  <div class="top-bar">
    <div class="date-badge">
      <span class="seal">剧本</span>
      <span id="txt-date">1年 9月1日 · 傍晚</span>
    </div>
    <span class="clock-badge" id="txt-clock"></span>
    <div class="money-badge">
      <span>￥</span>
      <span id="txt-money">320</span>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="pet-screen">
    <!-- 背景图：由角色卡里的「面板补图」脚本换成仓库地址；也可在这里直接填一个网络地址 -->
    <img src="zhixia_rental_room.jpg" class="screen-bg" id="room-bg" alt="老屋">
    <div class="room-tint" id="room-tint"></div>

    <div class="bulb-fixture" onclick="toggleLight()" title="拉一下灯绳">
      <div class="bulb-cord"></div>
      <div class="bulb-glass" id="bulb-lamp"></div>
    </div>

    <div class="screen-corner" id="txt-scene">她在家等你</div>

    <div class="zhixia-char-wrap" onclick="petZhixia()">
      <div class="speech-bubble" id="speech-bubble">“哥哥！你回来啦……”</div>
      <div class="char-sprite-box">
        <img src="zhixia_character_art.jpg" alt="知夏" id="char-art">
        <div class="no-art" id="no-art" style="display:none">立绘还没放进来。<br>把图放进仓库的这个目录即可。</div>
        <div class="sickness-tag" id="sickness-tag" style="display:none;">发烧中</div>
      </div>
    </div>
  </div>

  <div class="link-error" id="link-error"></div>

  <div class="vitals-bar">
    <div class="vital-item">
      <span class="vital-label">知夏饱食 <b id="val-hunger">70</b></span>
      <div class="progress-track"><div class="progress-fill fill-hunger" id="bar-hunger" style="width: 70%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">知夏心情 <b id="val-mood">60</b></span>
      <div class="progress-track"><div class="progress-fill fill-mood" id="bar-mood" style="width: 60%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">知夏健康 <b id="val-health">90</b></span>
      <div class="progress-track"><div class="progress-fill fill-health" id="bar-health" style="width: 90%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">哥哥体力 <b id="val-energy">80</b></span>
      <div class="progress-track"><div class="progress-fill fill-energy" id="bar-energy" style="width: 80%;"></div></div>
    </div>
  </div>

  <div class="action-grid">
    <button class="act-btn primary" onclick="openDialog('feed')">
      <span class="icon">碗</span>
      <span>喂食</span>
    </button>
    <button class="act-btn primary" onclick="openDialog('care')">
      <span class="icon">药</span>
      <span>照料</span>
    </button>
    <button class="act-btn" onclick="openDialog('work')">
      <span class="icon">工</span>
      <span>出工</span>
    </button>
    <button class="act-btn" onclick="openDialog('shop')">
      <span class="icon">市</span>
      <span>买点东西</span>
    </button>
    <button class="act-btn blue" onclick="openDialog('pet')">
      <span class="icon">坐</span>
      <span>陪她</span>
    </button>
    <button class="act-btn blue" onclick="openDialog('sync')">
      <span class="icon">阅</span>
      <span>数据</span>
    </button>
    <button class="act-btn green" onclick="说一句('我往厨房走了一趟，看看锅里还有什么。')">
      <span class="icon">看</span>
      <span>转转</span>
    </button>
  </div>

  <!-- 喂食弹窗 -->
  <div class="sub-dialog" id="dlg-feed">
    <div class="dialog-header">
      <span class="dialog-title">老屋开饭 · 喂食知夏</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="feed-list"></div>
  </div>

  <!-- 照料弹窗 -->
  <div class="sub-dialog" id="dlg-care">
    <div class="dialog-header">
      <span class="dialog-title">照料医治 · 温水与药</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="care-list"></div>
  </div>

  <!-- 出工弹窗 -->
  <div class="sub-dialog" id="dlg-work">
    <div class="dialog-header">
      <span class="dialog-title">外出打工 · 今日的活</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="work-list"></div>
  </div>

  <!-- 买东西弹窗 -->
  <div class="sub-dialog" id="dlg-shop">
    <div class="dialog-header">
      <span class="dialog-title">王婶小卖部与菜市</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="shop-list"></div>
  </div>

  <!-- 陪她弹窗 -->
  <div class="sub-dialog" id="dlg-pet">
    <div class="dialog-header">
      <span class="dialog-title">坐下来陪她说说话</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="pet-list"></div>
  </div>

  <!-- 数据查看 -->
  <div class="sub-dialog" id="dlg-sync">
    <div class="dialog-header">
      <span class="dialog-title">角色卡里的变量</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" style="font-family:monospace; font-size:11px; color:#d6d3d1; white-space:pre-wrap; word-break:break-all;" id="sync-content"></div>
  </div>
</div>

<script>
  /* ── 数据层：全部读写角色卡的变量 ─────────────────────────
   *
   * 面板在酒馆的楼层 iframe 里跑，可以直接调酒馆助手的变量接口。
   * 变量住在楼层变量的 stat_data 里（MVU 的用法），和挂机结算脚本、正文的更新规则共用同一份。
   *
   * 读：getVariables({type:'message', message_id: getCurrentMessageId()})
   * 写：updateVariablesWith(表 => { 表.stat_data = 数据; return 表 }, 同一选项)
   */

  const 变量选项 = { type: 'message', message_id: (typeof getCurrentMessageId === 'function' ? getCurrentMessageId() : -1) };

  /** 和脚本、Schema 保持一致的常量。改这里就要改 schema.ts。 */
  const 起始年龄 = 8;
  const 一年天数 = 365;
  const 时段表 = ['清晨', '上午', '下午', '傍晚', '夜里', '深夜'];
  const 一天能陪几次 = 1;

  /** 商品表。和 面板数据.ts 里的那几张表是同一批货，价钱与效果照抄。 */
  const 食物 = [
    { 名: '热汤挂面', 价: 3, 饥饿: 25, 心情: 6 },
    { 名: '剩菜热饭', 价: 0, 饥饿: 20, 心情: 4 },
    { 名: '大白兔奶糖', 价: 1, 饥饿: 5, 心情: 12 },
  ];
  const 药品 = [
    { 名: '温开水', 价: 0, 健康: 5, 心情: 3 },
    { 名: '湿毛巾', 价: 0, 健康: 8, 治: '发烧' },
    { 名: '退烧片', 价: 4, 健康: 30, 治: '发烧' },
  ];
  const 市集 = [
    { 名: '热汤挂面', 价: 3 },
    { 名: '大白兔奶糖', 价: 1 },
    { 名: '退烧片', 价: 4 },
  ];

  /** 家里有的、这两张表里也认得的货。 */
  function 家里的(表) {
    const 数据 = 存档();
    return 表.filter(货 => Number(数据.物品?.[货.名]?.数量 ?? 0) > 0);
  }

  let 面板数据 = null;

  function 存档() {
    return 面板数据 ?? { 时间: {}, 钱: 0, 哥哥: {}, 妹妹: {}, 今日: {}, 物品: {}, 衣柜: {} };
  }

  function 读变量() {
    try {
      const 表 = getVariables(变量选项);
      const 数据 = 表?.stat_data;
      if (数据 && typeof 数据 === 'object') {
        面板数据 = 数据;
        藏起报错();
        return 数据;
      }
      显示报错('读到的变量是空的。这个面板要放在角色卡的楼层里，由酒馆提供变量接口才能用。');
    } catch (错误) {
      显示报错('读不到酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
    return 存档();
  }

  function 写变量() {
    if (!面板数据) return;
    try {
      updateVariablesWith(表 => {
        表.stat_data = 面板数据;
        return 表;
      }, 变量选项);
    } catch (错误) {
      显示报错('写不回酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
  }

  function 显示报错(话) {
    const 框 = document.getElementById('link-error');
    框.textContent = 话;
    框.classList.add('show');
  }

  function 藏起报错() {
    document.getElementById('link-error').classList.remove('show');
  }

  function 提示(话, 毫秒) {
    const 框 = document.getElementById('notice');
    框.textContent = 话;
    框.classList.add('show');
    window.clearTimeout(提示.计时);
    提示.计时 = window.setTimeout(() => 框.classList.remove('show'), 毫秒 || 4200);
  }

  /* ── 把面板上的动作送进正文 ─────────────────────────
   *
   * 这是「代入感」的关键一步：面板上做的事不能只改数字，还要变成正文里的一句话，
   * 让 AI 接着写下去。所以每个动作都：先改变量，再往聊天里写一句第一人称的话，然后触发生成。
   *
   * 时间不受影响：这里从不改日历。日子只由真实时间推。
   */
  let 正在发言 = false;

  async function 做一件(叙述, 紧凑话) {
    if (正在发言) {
      提示('上一件还在写，等它写完。', 2200);
      return;
    }
    if (typeof createChatMessages !== 'function' || typeof triggerSlash !== 'function') {
      提示(紧凑话 + '（这条面板单独打开时不能往正文里写，进酒馆就好。）', 6000);
      return;
    }
    正在发言 = true;
    try {
      await createChatMessages([{ role: 'user', message: 叙述 }]);
      await triggerSlash('/trigger');
      提示(紧凑话);
    } catch (错误) {
      提示('没能写进正文：' + (错误 && 错误.message ? 错误.message : 错误), 6000);
    } finally {
      正在发言 = false;
    }
  }

  /** 给「转转」这类不带状态变化的按钮用。 */
  function 说一句(叙述) {
    做一件(叙述, '把这一步交给正文了。');
  }

  /* ── 工具 ───────────────────────────────── */

  function 钳(值) {
    return Math.max(0, Math.min(100, Math.round(Number(值) || 0)));
  }

  function 今天记号() {
    const 时 = 存档().时间 ?? {};
    return (时.年 ?? 1) + '-' + (时.月 ?? 1) + '-' + (时.日 ?? 1);
  }

  /** 今天还能陪几次。跟出工抢的是同一份时间。 */
  function 今日额度() {
    const 数据 = 存档();
    const 今 = 数据.今日 ?? {};
    if (String(今.日期 ?? '') !== 今天记号()) return { 陪: 一天能陪几次, 出工: 1 };
    return {
      陪: Math.max(0, 一天能陪几次 - Number(今.陪过 ?? 0)),
      出工: Math.max(0, 1 - Number(今.出过工 ?? 0)),
    };
  }

  function 记今天的账(项) {
    const 数据 = 存档();
    if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
    if (String(数据.今日.日期 ?? '') !== 今天记号()) {
      数据.今日.日期 = 今天记号();
      数据.今日.陪过 = 0;
      数据.今日.哄睡过 = 0;
      数据.今日.出过工 = 0;
    }
    数据.今日[项] = Number(数据.今日[项] ?? 0) + 1;
  }

  function 扣一个(名) {
    const 数据 = 存档();
    const 条 = 数据.物品?.[名];
    if (!条) return;
    条.数量 = Number(条.数量) - 1;
    if (条.数量 <= 0) delete 数据.物品[名];
  }

  /* 面板不碰日历。年、月、日、季节、总天数、她的年龄都只由脚本按真实时间推。 */

  /* ── 渲染 ───────────────────────────────── */

  let 灯亮着 = true;

  function updateUI() {
    const 数据 = 读变量();
    const 时 = 数据.时间 ?? {};
    const 妹 = 数据.妹妹 ?? {};
    const 哥 = 数据.哥哥 ?? {};

    document.getElementById('txt-date').innerText =
      (时.年 ?? 1) + '年 ' + (时.月 ?? 1) + '月' + (时.日 ?? 1) + '日 · ' + (时.时段 ?? '傍晚') + ' · ' + (时.季节 ?? '秋');
    document.getElementById('txt-money').innerText = 数据.钱 ?? 0;
    document.getElementById('val-hunger').innerText = 妹.饥饿 ?? 0;
    document.getElementById('bar-hunger').style.width = (妹.饥饿 ?? 0) + '%';
    document.getElementById('val-mood').innerText = 妹.心情 ?? 0;
    document.getElementById('bar-mood').style.width = (妹.心情 ?? 0) + '%';
    document.getElementById('val-health').innerText = 妹.健康 ?? 0;
    document.getElementById('bar-health').style.width = (妹.健康 ?? 0) + '%';
    document.getElementById('val-energy').innerText = 哥.体力 ?? 0;
    document.getElementById('bar-energy').style.width = (哥.体力 ?? 0) + '%';

    const 病 = String(妹.病症 ?? '无');
    const 标签 = document.getElementById('sickness-tag');
    标签.style.display = 病 !== '无' ? 'block' : 'none';
    标签.innerText = 病 + '中';

    document.getElementById('txt-scene').innerText =
      哥.今日已打工 === 1 ? '他今天已经出过一次工了' : '她在家等你';

    const 面 = document.getElementById('char-art');
    if (面 && 面.complete && 面.naturalWidth === 0) {
      document.getElementById('no-art').style.display = 'flex';
    }
  }

  function 现实时钟() {
    const 现在 = new Date();
    const 时 = String(现在.getHours()).padStart(2, '0');
    const 分 = String(现在.getMinutes()).padStart(2, '0');
    document.getElementById('txt-clock').innerText = 时 + ':' + 分;
  }

  function toggleLight() {
    灯亮着 = !灯亮着;
    const 泡 = document.getElementById('bulb-lamp');
    const 罩 = document.getElementById('room-tint');
    if (灯亮着) {
      泡.classList.remove('off');
      罩.style.background = 'radial-gradient(circle at 50% 20%, rgba(251,191,36,0.18) 0%, rgba(12,10,9,0.6) 80%)';
    } else {
      泡.classList.add('off');
      罩.style.background = 'rgba(0,0,0,0.65)';
    }
  }

  const 闲话 = [
    '“哥哥！你手真暖和，今天在外头吹冷风冻着没？”',
    '“知夏有乖乖听话，碗都擦得干干净净了。”',
    '“作业我写完了，等你回来才吃饭的。”',
    '“哥哥，楼下王婶问我你最近忙啥呢。”',
  ];

  function petZhixia() {
    const 数据 = 读变量();
    数据.妹妹.心情 = 钳((数据.妹妹.心情 ?? 60) + 2);
    写变量();
    document.getElementById('speech-bubble').innerText = 闲话[Math.floor(Math.random() * 闲话.length)];
    updateUI();
  }

  function openDialog(type) {
    closeDialog();
    const 框 = document.getElementById('dlg-' + type);
    if (!框) return;
    if (type === 'feed') renderFeed();
    if (type === 'care') renderCare();
    if (type === 'work') renderWork();
    if (type === 'shop') renderShop();
    if (type === 'pet') renderPet();
    if (type === 'sync') renderSync();
    框.classList.add('active');
  }

  function closeDialog() {
    document.querySelectorAll('.sub-dialog').forEach(框 => 框.classList.remove('active'));
  }

  function 空列表(容器, 话) {
    容器.innerHTML = '<p class="dialog-note">' + 话 + '</p>';
  }

  function renderFeed() {
    const 容器 = document.getElementById('feed-list');
    const 有 = 家里的(食物);
    if (!有.length) {
      空列表(容器, '家里没有现成能吃的东西。去「买点东西」买一份，或者自己下厨做一顿。');
      return;
    }
    容器.innerHTML = '';
    有.forEach(货 => {
      const 数 = Number(存档().物品[货.名].数量);
      const 行 = document.createElement('div');
      行.className = 'item-card';
      行.innerHTML =
        '<div class="item-info"><h4>' + 货.名 + '（剩 ' + 数 + ' 份）</h4>' +
        '<p>饱食 +' + 货.饥饿 + '，心情 +' + 货.心情 + '</p></div>' +
        '<button class="item-act-btn" onclick="feed(\'' + 货.名 + '\')">喂她吃</button>';
      容器.appendChild(行);
    });
  }

  function feed(名) {
    const 数据 = 读变量();
    if (Number(数据.物品?.[名]?.数量 ?? 0) <= 0) return;
    const 货 = 食物.find(x => x.名 === 名);
    if (!货) return;
    扣一个(名);
    数据.妹妹.饥饿 = 钳((数据.妹妹.饥饿 ?? 70) + 货.饥饿);
    数据.妹妹.心情 = 钳((数据.妹妹.心情 ?? 60) + 货.心情);
    写变量();
    document.getElementById('speech-bubble').innerText = '知夏小口吃完了「' + 名 + '」：“哥哥，真好吃，你也吃一点！”';
    提示('喂了她' + 名 + '，饱食 +' + 货.饥饿 + '。');
    updateUI();
    renderFeed();
    closeDialog();
    做一件('我把' + 名 + '端到她面前，看她吃完。', '这一步已经交给正文了。');
  }

  function renderCare() {
    const 容器 = document.getElementById('care-list');
    const 有 = 家里的(药品);
    if (!有.length) {
      空列表(容器, '家里没有能用的药。她要是病了，去「买点东西」里看看。');
      return;
    }
    const 病 = String(存档().妹妹?.病症 ?? '无');
    容器.innerHTML = '';
    有.forEach(货 => {
      const 数 = Number(存档().物品[货.名].数量);
      const 对症 = !货.治 || 货.治 === 病;
      const 行 = document.createElement('div');
      行.className = 'item-card';
      行.innerHTML =
        '<div class="item-info"><h4>' + 货.名 + '（剩 ' + 数 + ' 份）</h4>' +
        '<p>健康 +' + 货.健康 + (货.治 ? '，针对' + 货.治 + (对症 ? '' : '（现在不对症）') : '') + '</p></div>' +
        '<button class="item-act-btn" onclick="care(\'' + 货.名 + '\')">用上</button>';
      容器.appendChild(行);
    });
  }

  function care(名) {
    const 数据 = 读变量();
    if (Number(数据.物品?.[名]?.数量 ?? 0) <= 0) return;
    const 货 = 药品.find(x => x.名 === 名);
    if (!货) return;
    扣一个(名);
    数据.妹妹.健康 = 钳((数据.妹妹.健康 ?? 90) + 货.健康);
    if (货.治 && String(数据.妹妹.病症 ?? '无') === 货.治 && 数据.妹妹.健康 >= 85) {
      数据.妹妹.病症 = '无';
    }
    写变量();
    document.getElementById('speech-bubble').innerText =
      '知夏用了「' + 名 + '」，小声说：“哥哥不用替我花钱买药，知夏已经好受很多啦。”';
    提示('用了' + 名 + '，健康 +' + 货.健康 + '。');
    updateUI();
    renderCare();
    closeDialog();
    做一件('我给知夏用了' + 名 + '。', '这一步已经交给正文了。');
  }

  function renderWork() {
    const 容器 = document.getElementById('work-list');
    const 数据 = 存档();
    const 额度 = 今日额度();
    const 体力 = Number(数据.哥哥?.体力 ?? 0);
    const 熟练 = 数据.进度?.熟练 ?? {};
    const 活 = [
      { 名: '城东工地 · 搬料配重', 地: '工地', 体内: 22, 薪: 90 },
      { 名: '巷口饭店 · 后厨备菜', 地: '后厨', 体内: 15, 薪: 110 },
      { 名: '南门仓库 · 分拣', 地: '仓库', 体内: 18, 薪: 100 },
      { 名: '夜市窄巷 · 送货', 地: '夜市', 体内: 25, 薪: 140 },
    ];
    容器.innerHTML = '';
    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    说明.innerHTML =
      '今天还能出工：' + 额度.出工 + ' 次　现在体力 ' + 体力 + '<br>' +
      '出工要玩一局手上的活，那一局在另一块面板的「挣」页里。这里只报今天的状态，不重复发钱。';
    容器.appendChild(说明);
    活.forEach(j => {
      const 行 = document.createElement('div');
      行.className = 'item-card';
      const 够 = 体力 >= j.体内;
      行.innerHTML =
        '<div class="item-info"><h4>' + j.名 + '</h4>' +
        '<p>时薪 ' + j.薪 + '，体力 -' + j.体内 + '，熟练 ' + (熟练[j.地] ?? 0) +
        (额度.出工 <= 0 ? '（今天已经出过了）' : 够 ? '' : '（体力不够）') + '</p></div>' +
        '<button class="item-act-btn" disabled>' + (额度.出工 <= 0 ? '今天做过了' : 够 ? '在「挣」页开工' : '体力不够') + '</button>';
      容器.appendChild(行);
    });
  }

  function renderShop() {
    const 容器 = document.getElementById('shop-list');
    const 钱 = Number(存档().钱 ?? 0);
    容器.innerHTML = '';
    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    说明.innerHTML = '手上的钱 ￥' + 钱 + '。买回来的东西会进家里的柜子，去「喂食」或「照料」里用。';
    容器.appendChild(说明);
    市集.forEach(w => {
      const 够 = 钱 >= w.价;
      const 行 = document.createElement('div');
      行.className = 'item-card';
      行.innerHTML =
        '<div class="item-info"><h4>' + w.名 + '</h4><p>单价 ￥' + w.价 + '</p></div>' +
        '<button class="item-act-btn" ' + (够 ? '' : 'disabled') + ' onclick="buy(\'' + w.名 + '\', ' + w.价 + ')">买一份</button>';
      容器.appendChild(行);
    });
  }

  function buy(名, 价) {
    const 数据 = 读变量();
    if (Number(数据.钱 ?? 0) < 价) return;
    数据.钱 = Number(数据.钱) - 价;
    if (!数据.物品[名]) 数据.物品[名] = { 数量: 0, 类别: '食物' };
    数据.物品[名].数量 = Number(数据.物品[名].数量) + 1;
    写变量();
    提示('买了' + 名 + '，花了 ' + 价 + ' 元。');
    updateUI();
    renderShop();
    closeDialog();
    做一件('我下楼去王婶那儿买了' + 名 + '，花' + 价 + '块。', '这一步已经交给正文了。');
  }

  function renderPet() {
    const 容器 = document.getElementById('pet-list');
    const 额度 = 今日额度();
    容器.innerHTML = '';
    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    说明.innerHTML =
      '今天还能陪她：' + 额度.陪 + ' 次。<br>他一天只有这么多时间，陪她就没空出工，出工就不能陪。跨过一天刷新。';
    容器.appendChild(说明);
    const 事 = [
      { 名: '坐在她旁边，听她讲今天的事', 心情: 12, 依赖: 3 },
      { 名: '陪她把作业写完', 心情: 10, 依赖: 4 },
      { 名: '一块儿去楼下走走', 心情: 14, 依赖: 2 },
    ];
    事.forEach(x => {
      const 行 = document.createElement('div');
      行.className = 'item-card';
      行.innerHTML =
        '<div class="item-info"><h4>' + x.名 + '</h4><p>心情 +' + x.心情 + '，依赖 +' + x.依赖 + '</p></div>' +
        '<button class="item-act-btn" ' + (额度.陪 <= 0 ? 'disabled' : '') +
        ' onclick="陪她(\'' + x.名 + '\', ' + x.心情 + ', ' + x.依赖 + ')">' +
        (额度.陪 <= 0 ? '今天陪过了' : '就这样') + '</button>';
      容器.appendChild(行);
    });
  }

  function 陪她(名, 心情, 依赖) {
    if (今日额度().陪 <= 0) {
      提示('今天已经陪过她了。想再多陪，得等正文里过一天。');
      return;
    }
    const 数据 = 读变量();
    数据.妹妹.心情 = 钳((数据.妹妹.心情 ?? 60) + 心情);
    数据.妹妹.依赖 = 钳((数据.妹妹.依赖 ?? 40) + 依赖);
    记今天的账('陪过');
    写变量();
    document.getElementById('speech-bubble').innerText = '你' + 名 + '。她话多了起来，说到一半自己先笑了。';
    提示('你' + 名 + '。今天的时间用掉了一次。');
    updateUI();
    closeDialog();
    做一件('我' + 名 + '。', '这一步已经交给正文了。');
  }

  function renderSync() {
    const 数据 = 读变量();
    document.getElementById('sync-content').innerText = JSON.stringify(数据, null, 2);
  }

  /* ── 起手 ───────────────────────────────── */

  function 起手() {
    updateUI();
    现实时钟();
    window.setInterval(现实时钟, 20000);
    window.setInterval(updateUI, 3000);
    const 面 = document.getElementById('char-art');
    if (面) 面.addEventListener('error', () => {
      document.getElementById('no-art').style.display = 'flex';
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', 起手);
  else 起手();
</script>
</body>
</html>
