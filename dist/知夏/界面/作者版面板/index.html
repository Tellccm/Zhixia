<!DOCTYPE html>
<!--
  知夏 · 电子宠物面板（作者版 · 已接酒馆变量）
  放进公开仓库由 jsDelivr 提供，角色卡的正则把 [养成面板] 换成加载这个页面的语句。

  数据来源：本面板不再自己存档。所有数字都读写角色卡的变量（MVU 的 stat_data），
  和挂机结算脚本、正文里的变量更新规则共用同一份。所以在这个面板上喂她一口饭，
  正文下一轮就会知道；正文说她饿了，这个面板也会跟着变。

  改动记录（相对作者初版）：
  - 去掉 localStorage 存档，改成读写 stat_data
  - 六个 emoji 图标换成汉字，四列布局补成七格
  - 状态条沿用原配色，数值取自变量
  - 出工不再自己发钱：玩小游戏在另一块面板的「挣」页，这里是今日出工状态
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>知夏 · 电子宠物养成面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    /* html 给高度，body 的百分比才有着落；但面板本身是固定尺寸，不跟着视口长。 */
    html {
      height: 100%;
    }
    body {
      background: #1c1917;
      color: #f5f5f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      padding: 10px;
    }
    .panel-container {
      width: 100%;
      max-width: 480px;
      background: #292524;
      border: 3px solid #78350f;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(180,83,9,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-bar {
      background: linear-gradient(180deg, #1c1917 0%, #292524 100%);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #44403c;
      gap: 8px;
    }
    .date-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1c1917;
      border: 1px solid #78350f;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #fef3c7;
      white-space: nowrap;
    }
    /* 现实时钟是这块面板上最该看清的一个数：她在卡里过日子，你在现实里过。 */
    .clock-badge {
      font-size: 19px;
      font-weight: bold;
      color: #fde68a;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }
    .money-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #451a03;
      border: 1px solid #b45309;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #fde68a;
      font-family: monospace;
    }
    /* 提示条不再硬生生蹦出来：高度、透明度、位移一起过渡，从上往下滑进来，到点再收回去。
       不用 display 切换，因为 display 没法过渡。
       高度由脚本按实际文字量测出来写成 max-height，这样过渡的快慢跟内容长短无关。 */
    .notice {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      padding: 0 14px;
      background: #0c0a09;
      border-bottom: 1px solid transparent;
      font-size: 11.5px;
      line-height: 1.5;
      color: #fcd34d;
      transform: translateY(-7px);
      transition:
        max-height 0.34s cubic-bezier(0.22, 0.61, 0.36, 1),
        opacity 0.26s ease,
        transform 0.34s cubic-bezier(0.22, 0.61, 0.36, 1),
        padding 0.34s cubic-bezier(0.22, 0.61, 0.36, 1),
        border-color 0.34s ease;
    }
    .notice.show {
      opacity: 1;
      transform: translateY(0);
      padding: 7px 14px;
      border-bottom-color: #44403c;
    }
    /* 已经露着的时候又来一条：不收起再展开，只轻轻冒一下，换了字也不突兀。 */
    .notice.冒 { animation: 冒一下 0.32s ease-out; }
    @keyframes 冒一下 {
      0% { opacity: 0.5; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    /* 宠物屏是一块固定尺寸的屏幕，不是能无限拉长的容器。
       之前试过按视口算高度（calc(100vh - 250px)），在长窗口里被拉得极长，所以退回固定值。
       屏幕 400 ＋ 顶栏与状态条 90 ＋ 按钮区 140，整体约 640，正好放进楼层。 */
    .pet-screen {
      position: relative;
      height: 400px;
      flex: 0 0 auto;
      background: linear-gradient(180deg, #1b1613 0%, #100d0b 55%, #17120f 100%);
      overflow: hidden;
      cursor: pointer;
    }
    /* 她站的位置随心情挪：心情好往前站，不好就往墙边缩。位置规则也写在下面的 .zhixia-char-wrap 里。 */
    .pet-heart {
      position: absolute;
      top: -18px;
      left: 50%;
      font-size: 16px;
      color: #f472b6;
      opacity: 0;
      pointer-events: none;
    }
    .pet-heart.跳 { animation: 浮起 1.1s ease-out; }
    @keyframes 浮起 {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.7); }
      30% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -26px) scale(0.9); }
    }
    .screen-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
      transition: filter 0.5s;
    }
    .room-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(251,191,36,0.18) 0%, rgba(12,10,9,0.6) 80%);
      pointer-events: none;
    }
    /* 灯是布景，压到人物与气泡下面。她放大之后，灯绳原来会横穿气泡，把字切开。 */
    .bulb-fixture {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 1;
    }
    .bulb-cord { width: 2px; height: 20px; background: #57534e; }
    .bulb-glass {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fef08a;
      box-shadow: 0 0 25px 12px rgba(253, 224, 71, 0.6);
      transition: all 0.3s;
    }
    .bulb-glass.off { background: #78716c; box-shadow: none; }
    .screen-corner {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 11px;
      cursor: pointer;
      transition: color 0.18s ease;
      color: #d6d3d1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      z-index: 3;
    }
    .zhixia-char-wrap {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 2;
      transition: bottom 0.6s ease;
    }
    .zhixia-char-wrap.低落 { bottom: 30px; }
    .zhixia-char-wrap.低落 .char-sprite-box { filter: brightness(0.78) saturate(0.8); }
    .zhixia-char-wrap.高兴 { bottom: 6px; }
    /* 气泡淡入，停几秒自己淡出。始终占着位置（用 visibility 而不是 display），
       所以一句话来了又走，她不会跟着上下跳。 */
    .speech-bubble {
      background: rgba(255, 251, 235, 0.95);
      color: #292524;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 260px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      position: relative;
      border: 1.5px solid #b45309;
      opacity: 0;
      visibility: hidden;
      transform: translateY(6px) scale(0.96);
      transition:
        opacity 0.3s ease,
        transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1),
        visibility 0.3s;
    }
    .speech-bubble.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: #fffbeb;
      border-right: 1.5px solid #b45309;
      border-bottom: 1.5px solid #b45309;
    }
    /* 立绘框只负责占位与点击，不出画框：图是透明背景的立绘，直接贴在屋子的背景上。
       不再有边框、圆角、底色和投影，否则会像贴了一张相片。 */
    .char-sprite-box {
      width: 210px;
      height: 300px;
      position: relative;
      background: none;
      border: none;
      transition: transform 0.2s;
    }
    .char-sprite-box:active { transform: scale(0.97); }
    .char-sprite-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }
    /* 立绘还没放进来时给一块淡虚线的位置提示，图一到位就没了。 */
    .char-sprite-box .no-art {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #57534e;
      text-align: center;
      line-height: 1.6;
      padding: 10px;
      border: 1px dashed #44403c;
      border-radius: 10px;
    }
    .sickness-tag {
      position: absolute;
      top: 34px;
      right: 10px;
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      animation: pulse 1.5s infinite;
      opacity: 0;
      visibility: hidden;
      transform: scale(0.9);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
      z-index: 4;
    }
    .sickness-tag.show { opacity: 1; visibility: visible; transform: scale(1); }
    .link-error {
      display: none;
      margin: 10px 14px 0;
      padding: 9px 11px;
      border-left: 3px solid #dc2626;
      background: #1c1917;
      font-size: 11.5px;
      line-height: 1.6;
      color: #fca5a5;
    }
    .link-error.show { display: block; }
    .vitals-bar {
      display: flex;
      justify-content: space-around;
      background: #1c1917;
      padding: 8px 10px;
      border-top: 1px solid #44403c;
      border-bottom: 1px solid #44403c;
    }
    .vital-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .vital-label { font-size: 11px; color: #a8a29e; }
    .vital-label b { color: #f5f5f4; font-variant-numeric: tabular-nums; }
    .progress-track {
      width: 65px;
      height: 8px;
      background: #292524;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #57534e;
    }
    .progress-fill { height: 100%; transition: width 0.4s ease; }
    .fill-hunger { background: #f59e0b; }
    .fill-mood { background: #eab308; }
    .fill-health { background: #10b981; }
    .fill-energy { background: #3b82f6; }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      background: #1c1917;
      /* 五个按钮摆在四列里，第二行只剩一格时让它自己不撑宽 */
      align-content: start;
    }
    .act-btn {
      background: #292524;
      border: 1.5px solid #57534e;
      color: #e7e5e4;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease, filter 0.18s ease;
      font-family: inherit;
    }
    .act-btn:hover { filter: brightness(1.15); border-color: #78716c; }
    .act-btn:active { transform: scale(0.97); }
    .act-btn:active { transform: translateY(2px); background: #44403c; }
    .act-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .act-btn span.icon {
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      border-radius: 8px;
      background: #1c1917;
      font-size: 13px;
      color: #fbbf24;
    }
    .act-btn.primary { background: #78350f; border-color: #d97706; color: #fef3c7; }
    .act-btn.primary span.icon { background: #4a1d06; color: #fde68a; }
    .act-btn.green { background: #064e3b; border-color: #059669; color: #d1fae5; }
    .act-btn.green span.icon { background: #032b21; color: #6ee7b7; }
    .act-btn.blue { background: #1e3a8a; border-color: #3b82f6; color: #dbeafe; }
    .act-btn.blue span.icon { background: #14275c; color: #93c5fd; }
    /* 弹窗不再硬切：淡入并轻轻上浮一点。收起走同一套过渡，所以关掉也是滑走的。
       隐藏时 pointer-events 关掉，免得看不见的弹窗挡住底下的点击。 */
    .sub-dialog {
      display: flex;
      position: absolute;
      inset: 0;
      background: rgba(12,10,9,0.94);
      backdrop-filter: blur(4px);
      z-index: 50;
      flex-direction: column;
      padding: 16px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(10px) scale(0.985);
      transition:
        opacity 0.22s ease,
        transform 0.22s cubic-bezier(0.22, 0.61, 0.36, 1),
        visibility 0.22s;
    }
    .sub-dialog.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #44403c;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .dialog-title { font-size: 15px; font-weight: bold; color: #fef3c7; }
    .close-btn {
      background: #44403c;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .dialog-body { flex: 1; overflow-y: auto; }
    .item-card {
      background: #292524;
      border: 1px solid #57534e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      transition: border-color 0.22s ease, background 0.22s ease, opacity 0.22s ease;
    }
    .item-info h4 { font-size: 13px; color: #f5f5f4; margin-bottom: 3px; }
    .item-info p { font-size: 11px; color: #a8a29e; }
    .item-act-btn {
      background: #d97706;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
    }
    .item-act-btn:hover:not(:disabled) { background: #f59e0b; }
    .item-act-btn:active:not(:disabled) { transform: scale(0.96); }
    .item-act-btn:disabled { background: #57534e; color: #a8a29e; cursor: not-allowed; }
    .dialog-note {
      font-size: 11px;
      color: #a8a29e;
      line-height: 1.6;
      padding: 4px 2px 10px;
    }
    /* ── 反馈层 ───────────────────────────────
       提示条按类型变色，数值改动在状态条旁边飘一下，条本身亮一下。
       点一下做完一件事，玩家要能立刻看出「哪儿变了、变了多少」。 */
    .notice.好 { color: #6ee7b7; border-bottom-color: #065f46; background: #052e21; }
    .notice.差 { color: #fca5a5; border-bottom-color: #7f1d1d; background: #2a0f0f; }
    .vitals-bar { position: relative; }
    .floater {
      position: absolute;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
      white-space: nowrap;
      animation: 飘字 1.2s ease-out forwards;
    }
    .floater.加 { color: #6ee7b7; }
    .floater.减 { color: #fca5a5; }
    @keyframes 飘字 {
      0% { opacity: 0; transform: translateY(5px); }
      20% { opacity: 1; transform: translateY(-2px); }
      100% { opacity: 0; transform: translateY(-24px); }
    }
    .progress-fill.变 { animation: 亮一下 0.75s ease-out; }
    @keyframes 亮一下 { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
    .rest-hint { font-size: 11px; color: #a8a29e; text-align: right; padding: 3px 2px 0; min-height: 15px; }
    /* 购物车：贴在买东西弹窗底部，一直看得见。 */
    .cart-strip {
      flex: 0 0 auto;
      border-top: 1.5px solid #44403c;
      margin-top: 10px;
      padding-top: 10px;
    }
    .cart-line { font-size: 11.5px; color: #e7e5e4; line-height: 1.75; min-height: 20px; }
    .cart-line .空 { color: #78716c; }
    .cart-total { font-size: 12.5px; color: #fcd34d; font-weight: bold; margin: 5px 0 8px; }
    .cart-total .差 { color: #fca5a5; font-weight: normal; }
    .cart-btns { display: flex; gap: 8px; }
    .cart-btns button { flex: 1; }
    .cart-btn {
      background: #d97706;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease, opacity 0.18s ease;
    }
    .cart-btn.plain { background: #44403c; color: #e7e5e4; font-weight: normal; }
    .cart-btn:hover:not(:disabled) { background: #f59e0b; }
    .cart-btn.plain:hover:not(:disabled) { background: #57534e; }
    .cart-btn:active:not(:disabled) { transform: scale(0.97); }
    .cart-btn:disabled { background: #57534e; color: #a8a29e; cursor: not-allowed; }
    /* 车里进出东西时，底部那条轻轻动一下，眼睛才知道是它变了。 */
    .cart-strip.动 { animation: 车动 0.36s ease-out; }
    @keyframes 车动 {
      0% { transform: translateY(3px); border-top-color: #d97706; }
      60% { transform: translateY(0); border-top-color: #fcd34d; }
      100% { border-top-color: #44403c; }
    }
    .缺 { color: #fca5a5; }
    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid #57534e;
      background: #292524;
      color: #f5f5f4;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.12s ease;
    }
    .qty-btn:hover:not(:disabled) { background: #3f3a37; border-color: #a8a29e; }
    .qty-btn:active:not(:disabled) { transform: scale(0.92); }
    .qty-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .qty-num { min-width: 20px; text-align: center; font-size: 13px; color: #fcd34d; font-weight: bold; }
    .小计 { font-size: 11px; color: #fcd34d; }
    .receipt { font-size: 11px; color: #a8a29e; line-height: 1.7; padding: 6px 2px 0; border-top: 1px dashed #44403c; margin-top: 8px; }
    .receipt b { color: #fcd34d; }
    /* ── 任务清单 ─────────────────────────────
       上面是每天固定的那几件，下面是她自己的事。她的每件事底下挂一句心里话。 */
    .task-sec { margin-bottom: 14px; }
    .task-title {
      font-size: 12px;
      color: #fcd34d;
      font-weight: bold;
      padding: 4px 2px 8px;
      border-bottom: 1px solid #44403c;
      margin-bottom: 8px;
    }
    .task-title .计数 { color: #a8a29e; font-weight: normal; }
    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 7px 9px;
      border-radius: 9px;
      margin-bottom: 6px;
      background: #221f1e;
      border: 1px solid #3a3634;
      transition: border-color 0.22s ease, background 0.22s ease, opacity 0.22s ease;
    }
    .task-row.完 { opacity: 0.6; }
    .task-row.完 .task-事 { text-decoration: line-through; }
    .task-勾 {
      width: 20px;
      height: 20px;

  /** 做饭的手艺分档。改门槛就改了档位名与能不能编书。 */
  const 手艺档表 = [
    { 名: '没下过厨', 门槛: 20 },
    { 名: '会做几样', 门槛: 45 },
    { 名: '做得像样', 门槛: 75 },
    { 名: '一手好菜', 门槛: 100 },
  ];
  /** 手艺到这条线就能把做过的菜写成一本厨艺书。 */
  const 编书门槛 = 60;

  function 取手艺档(值) {
    const 钳 = Math.max(0, Math.min(100, Number(值) || 0));
    return 手艺档表.find(档 => 钳 < 档.门槛) ?? 手艺档表[手艺档表.length - 1];
  }

  /** 现实里的季节。货架按它上架，不看正文推到哪一天：今天几月就摆什么季的衣服。 */
  const 月转季 = ['冬', '冬', '春', '春', '春', '夏', '夏', '夏', '秋', '秋', '秋', '冬'];

  function 现实季节(现在) {
    const 月 = new Date(Number(现在) || Date.now()).getMonth();
    return 月转季[月] ?? '秋';
  }

  /**
   * 节日。分两种：
   *
   * 1) 农历节日（春节、元宵、端午、中秋）。这几个没有简单算式：农历按朔望月定月，
   *    还得隔两三年插一个闰月（十九年七闰），所以春节在 1 月 21 日到 2 月 21 日之间飘，
   *    中秋在 9 月 7 日到 10 月 8 日之间飘。底下这张表是照真日期核出来的，一年四行：
   *    2026 春节 2/17、端午 6/19、中秋 9/25；2027 春节 2/6、端午 6/9、中秋 9/15；
   *    2028 春节 1/26、端午 5/28、中秋 10/3；2029 春节 2/13、端午 6/16、中秋 9/22。
   *    元宵按正月十五，是春节往后数十四天。窗口比当天宽几天，让人能提前备。
   *    再往后要加年份，照格式补四行即可。
   *
   * 2) 节气（清明、冬至）。这两个有公式，见 节气几号()，所以哪一年都对，不用进表。
   */
  const 节日表 = [
    { 节: '春节', 起: '2026-02-13', 止: '2026-02-22', 说: '除夕到初五' },
    { 节: '元宵', 起: '2026-03-01', 止: '2026-03-03', 说: '正月十五' },
    { 节: '端午', 起: '2026-06-16', 止: '2026-06-19', 说: '五月初五' },
    { 节: '中秋', 起: '2026-09-20', 止: '2026-09-25', 说: '八月十五' },
    { 节: '春节', 起: '2027-02-02', 止: '2027-02-11', 说: '除夕到初五' },
    { 节: '元宵', 起: '2027-02-18', 止: '2027-02-20', 说: '正月十五' },
    { 节: '端午', 起: '2027-06-06', 止: '2027-06-09', 说: '五月初五' },
    { 节: '中秋', 起: '2027-09-10', 止: '2027-09-15', 说: '八月十五' },
    { 节: '春节', 起: '2028-01-22', 止: '2028-01-30', 说: '除夕到初五' },
    { 节: '元宵', 起: '2028-02-07', 止: '2028-02-09', 说: '正月十五' },
    { 节: '端午', 起: '2028-05-25', 止: '2028-05-28', 说: '五月初五' },
    { 节: '中秋', 起: '2028-09-28', 止: '2028-10-03', 说: '八月十五' },
    { 节: '春节', 起: '2029-02-09', 止: '2029-02-17', 说: '除夕到初五' },
    { 节: '元宵', 起: '2029-02-25', 止: '2029-02-27', 说: '正月十五' },
    { 节: '端午', 起: '2029-06-13', 止: '2029-06-16', 说: '五月初五' },
    { 节: '中秋', 起: '2029-09-17', 止: '2029-09-22', 说: '八月十五' },
  ];

  /**
   * 节气落在几号。清明与冬至都是太阳走到某个位置的那一天，用通用的寿星公式就能算，
   * 所以这两个节日不必写进表，哪一年都对。常数按世纪取，这里只有 21 世纪的。
   *   清明：C = 4.81，在四月；冬至：C = 21.94，在十二月。
   */
  function 节气几号(年, 常数) {
    const 两位 = Number(年) % 100;
    return Math.floor(两位 * 0.2422 + 常数) - Math.floor(两位 / 4);
  }

  function 补零(数) {
    return String(数).padStart(2, '0');
  }

  function 某天字串(日) {
    return 日.getFullYear() + '-' + 补零(日.getMonth() + 1) + '-' + 补零(日.getDate());
  }

  /** 今天在过哪个节。先看表里的农历节日，再算清明与冬至。
   *  纯算数：只吃一个毫秒数，验收脚本喂日期进来核。 */
  function 今天的节(现在) {
    const 日 = new Date(Number(现在) || Date.now());
    const 今 = 某天字串(日);
    const 表里 = 节日表.find(段 => 今 >= 段.起 && 今 <= 段.止);
    if (表里) return 表里;

    // 节气各留前后一天，免得只撞当天。
    const 零点 = new Date(日.getFullYear(), 日.getMonth(), 日.getDate()).getTime();
    const 一天 = 24 * 60 * 60 * 1000;
    const 节气们 = [
      { 名: '清明', 常数: 4.81, 月: 4 },
      { 名: '冬至', 常数: 21.94, 月: 12 },
    ];
    for (const 节 of 节气们) {
      const 哪天 = 节气几号(日.getFullYear(), 节.常数);
      const 那日 = new Date(日.getFullYear(), 节.月 - 1, 哪天);
      if (Math.abs(零点 - 那日.getTime()) <= 一天) {
        return { 节: 节.名, 起: 某天字串(那日), 止: 某天字串(那日), 说: 某天字串(那日).slice(5) + ' 节气' };
      }
    }
    return null;
  }

  /** 这件货是不是正在过节才有的。`节` 可以是一个名字，也可以是几个（汤圆元宵与冬至都吃）。 */
  function 这件货过节吗(货, 节) {
    if (!货.节 || !节) return false;
    const 节们 = Array.isArray(货.节) ? 货.节 : [货.节];
    return 节们.includes(节.节);
  }

  /**
   * 现在货架上摆得出来的：
   * - 花钱的；
   * - 当季的（`季` 里有这一季），或者标了 `常显` 的，或者正在过那个节的（`节`）。
   * 标了 `常显` 的那几样（丝袜、小裙子、连衣裙、吊带睡裙、比基尼）四季都摆着，不做季节门槛：
   * 她不出门，好看的东西什么时候买都说得通，玩家也不必等三个月才买得到。
   */
  function 上架货() {
    const 季 = 现实季节();
    const 节 = 今天的节();
    return 货架.filter(货 => {
      if (Number(货.价) <= 0) return false;
      if (货.节) return 这件货过节吗(货, 节);
      if (货.常显) return true;
      return !货.季 || 货.季.includes(季);
    });
  }

  /** 家里有的、这两张表里也认得的货。 */
  function 家里的(表) {
    const 数据 = 存档();
    return 表.filter(货 => Number(数据.物品?.[货.名]?.数量 ?? 0) > 0);
  }

  let 面板数据 = null;

  function 存档() {
    return 面板数据 ?? { 时间: {}, 钱: 0, 哥哥: {}, 妹妹: {}, 今日: {}, 物品: {}, 衣柜: {} };
  }

  function 读变量() {
    try {
      const 表 = getVariables(变量选项);
      const 数据 = 表?.stat_data;
      if (数据 && typeof 数据 === 'object') {
        面板数据 = 数据;
        藏起报错();
        return 数据;
      }
      显示报错('读到的变量是空的。这个面板要放在角色卡的楼层里，由酒馆提供变量接口才能用。');
    } catch (错误) {
      显示报错('读不到酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
    return 存档();
  }

  function 写变量() {
    if (!面板数据) return;
    try {
      updateVariablesWith(表 => {
        表.stat_data = 面板数据;
        return 表;
      }, 变量选项);
    } catch (错误) {
      显示报错('写不回酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
  }

  function 显示报错(话) {
    const 框 = document.getElementById('link-error');
    框.textContent = 话;
    框.classList.add('show');
  }

  function 藏起报错() {
    document.getElementById('link-error').classList.remove('show');
  }

  /* 提示分三种调子：好（做成了）、差（做不成，附原因）、常（中性回执）。
   * 显示交给 CSS 过渡：从上往下滑进来，到点再收回去。
   * 高度按实际文字量量一遍写成 max-height，所以一句话和四句话的滑入速度一致。
   * 已经露着的时候又来一条，就不重新展开，只换个字并轻轻冒一下。 */
  function 提示(话, 毫秒, 调) {
    const 框 = document.getElementById('notice');
    const 调类 = 调 === '好' ? ' 好' : 调 === '差' ? ' 差' : '';
    const 开着 = 框.classList.contains('show');

    if (开着) {
      框.className = 'notice' + 调类 + ' show';
      框.textContent = 话;
      框.style.maxHeight = 框.scrollHeight + 2 + 'px';
      框.classList.remove('冒');
      void 框.offsetWidth;
      框.classList.add('冒');
    } else {
      框.className = 'notice' + 调类;
      框.textContent = 话;
      框.style.maxHeight = '0px';
      void 框.offsetWidth;
      框.style.maxHeight = 框.scrollHeight + 2 + 'px';
      框.classList.add('show');
    }

    window.clearTimeout(提示.计时);
    提示.计时 = window.setTimeout(() => {
      框.classList.remove('show');
      框.classList.remove('冒');
      框.style.maxHeight = '0px';
    }, 毫秒 || 4200);
  }

  /** 她开口说话：气泡淡入，停一会儿自己淡出。
   *  气泡始终占着位置（CSS 用 visibility），所以她不会因为一句话来了又走而上下跳。
   *  默认停 7 秒；攒着的话是她憋了很久才说出口的，留久一点。
   */
  let 说话计时 = 0;
  function 她说话(话, 毫秒) {
    const 泡 = document.getElementById('speech-bubble');
    if (!泡 || !话) return;
    泡.textContent = 话;
    泡.classList.remove('show');
    void 泡.offsetWidth;
    泡.classList.add('show');
    window.clearTimeout(说话计时);
    说话计时 = window.setTimeout(() => {
      泡.classList.remove('show');
    }, 毫秒 || 7000);
  }

  /* ── 反馈的小零件 ─────────────────────────
   *
   * 每次改动都要落成看得见的东西：数字飘一下、条亮一下、提示条报出「从多少到多少」。
   * 面板上的动作不发消息，玩家就靠这些判断自己刚才做了什么。
   */

  /** 在某个数字旁边飘一个 +N / -N。 */
  function 飘字(锚点id, 文本, 正负) {
    const 锚 = document.getElementById(锚点id);
    if (!锚 || !锚.parentElement) return;
    const 层 = 锚.parentElement;
    if (window.getComputedStyle(层).position === 'static') 层.style.position = 'relative';
    const 泡 = document.createElement('span');
    泡.className = 'floater ' + (正负 === '减' ? '减' : '加');
    泡.textContent = 文本;
    泡.style.left = 锚.offsetLeft + 锚.offsetWidth + 4 + 'px';
    泡.style.top = 锚.offsetTop - 2 + 'px';
    层.appendChild(泡);
    window.setTimeout(() => 泡.remove(), 1300);
  }

  /** 状态条亮一下，让眼睛知道是这一条动了。 */
  function 亮条(id) {
    const 条 = document.getElementById(id);
    if (!条) return;
    条.classList.remove('变');
    void 条.offsetWidth;
    条.classList.add('变');
    window.setTimeout(() => 条.classList.remove('变'), 800);
  }

  /** 把一次改动说成人话：饱食 +18（70→88）。没变就只报当前值。 */
  function 变化段(标签, 前, 后) {
    const 差 = Math.round(Number(后) - Number(前));
    if (!差) return 标签 + ' ' + 后 + '（没变）';
    return 标签 + ' ' + (差 > 0 ? '+' : '') + 差 + '（' + 前 + '→' + 后 + '）';
  }

  /** 一次动作的完整回执：改了哪几项、还剩什么额度。 */
  function 回执(段们, 尾巴) {
    const 有值的 = 段们.filter(Boolean);
    return 有值的.join('，') + (尾巴 ? '。' + 尾巴 : '');
  }

  /* ── 面板上的动作 ─────────────────────────
   *
   * 桌面养成游戏的做法：点一下，她当场有反应，事情就算做完了。
   * 这里不往聊天里写消息，也不触发生成。正文仍旧由玩家自己说话推进。
   *
   * 限制靠三样，不靠「发不发消息」：
   * 1. 东西：喂她要有饭，用药要有药，买要花钱。柜子空了就得先出工。
   * 2. 次数：一天能喂几回、能用几回药、能去几趟小卖部，用完就得等真实时间过一天。
   * 3. 冷却：摸头两分钟一次。
   */

  /* ── 工具 ───────────────────────────────── */

  function 钳(值) {
    return Math.max(0, Math.min(100, Math.round(Number(值) || 0)));
  }

  function 今天记号() {
    const 时 = 存档().时间 ?? {};
    return (时.年 ?? 1) + '-' + (时.月 ?? 3) + '-' + (时.日 ?? 1);
  }

  /** 今天各自的余量。额度只在真实时间跨过一天之后回满。 */
  function 今日额度() {
    const 今 = 存档().今日 ?? {};
    const 换天 = String(今.日期 ?? '') !== 今天记号();
    const 用过 = 项 => (换天 ? 0 : Number(今[项] ?? 0));
    return {
      喂: Math.max(0, 上限.喂 - 用过('喂过')),
      药: Math.max(0, 上限.药 - 用过('药过')),
      买: Math.max(0, 上限.买 - 用过('买过')),
      出工: Math.max(0, 1 - 用过('出过工')),
      饭: Math.max(0, 上限.饭 - 用过('做过饭')),
    };
  }

  function 记今天的账(项) {
    const 数据 = 存档();
    if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
    if (String(数据.今日.日期 ?? '') !== 今天记号()) {
      数据.今日.日期 = 今天记号();
      数据.今日.喂过 = 0;
      数据.今日.药过 = 0;
      数据.今日.买过 = 0;
      数据.今日.出过工 = 0;
      数据.今日.摸头加过 = 0;
      数据.今日.饭点 = {};
      数据.今日.做过饭 = 0;
    }
    数据.今日[项] = Number(数据.今日[项] ?? 0) + 1;
  }

  /* ── 任务清单 ─────────────────────────────
   *
   * 两块：
   * 1. 每天固定的那几件（三顿饭、照料、出工、跑腿、摸头）由今日的计数推出来，不用存。
   * 2. 她自己的事存在变量 `妹妹.任务` 里：事、想（她的心里话）、完。
   *    她自己想的用数字键，玩家交代的用「哥」开头的键，面板照这个分别标注。
   */

  /** 一天里三顿饭的时段，按真实时钟分。写在这里，任务清单与记账都读它。 */
  const 饭点表 = [
    { 餐: '早', 起: 5, 止: 11, 说: '05:00–11:00' },
    { 餐: '午', 起: 11, 止: 17, 说: '11:00–17:00' },
    { 餐: '晚', 起: 17, 止: 29, 说: '17:00–次日 05:00' },
  ];

  /** 每天固定的那几件。纯算数：吃一份「今日」和一个时刻，好单测。
   *  每件带一个状态：完（已经做过）／现在（这个钟点就能做）／过了（今天错过了）／没到（还没到时候）。
   *  三顿饭过了点就标「过了」，不再挂在清单上装成还能做。
   *  照料、出工、跑腿的次数角落那行已经在报了，这里不再重复列一遍。 */
  function 每日任务(今, 现在) {
    const 今儿 = 今 && typeof 今 === 'object' ? 今 : {};
    const 饭点 = 今儿.饭点 && typeof 今儿.饭点 === 'object' ? 今儿.饭点 : {};
    const 小时 = new Date(Number(现在) || Date.now()).getHours();
    const 钟点 = 小时 < 5 ? 小时 + 24 : 小时;

    const 段状态 = 段 => {
      if (Number(饭点[段.餐] ?? 0) > 0) return '完';
      if (钟点 >= 段.起 && 钟点 < 段.止) return '现在';
      return 钟点 >= 段.止 ? '过了' : '没到';
    };

    const 饭们 = 饭点表.map(段状态);
    const 摸过头 = Number(今儿.摸头加过 ?? 0) >= 1;

    return [
      { 名: '早饭喂她吃', 状态: 饭们[0], 成: 饭们[0] === '完', 细: 饭点表[0].说 + '，这个钟点里喂一次就算' },
      { 名: '午饭喂她吃', 状态: 饭们[1], 成: 饭们[1] === '完', 细: 饭点表[1].说 + '，这个钟点里喂一次就算' },
      { 名: '晚饭喂她吃', 状态: 饭们[2], 成: 饭们[2] === '完', 细: 饭点表[2].说 + '，这个钟点里喂一次就算' },
      { 名: '摸摸她的头', 状态: 摸过头 ? '完' : '现在', 成: 摸过头, 细: '一天最多靠摸头加 12 点心情' },
    ];
  }

  /** 清单顶上的三个数：已做几件、现在还能做几件、今天错过几件。 */
  function 任务小结(每天) {
    return {
      已做: 每天.filter(项 => 项.状态 === '完').length,
      还能: 每天.filter(项 => 项.状态 === '现在').length,
      错过: 每天.filter(项 => 项.状态 === '过了').length,
    };
  }

  /** 现在这顿算哪一餐。按真实时钟分，和进货一样不看正文里推到哪一天。 */
  function 这顿是哪餐(现在) {
    const 时 = new Date(Number(现在) || Date.now()).getHours();
    const 钟点 = 时 < 5 ? 时 + 24 : 时;
    return (饭点表.find(段 => 钟点 >= 段.起 && 钟点 < 段.止) ?? 饭点表[2]).餐;
  }

  /** 喂她的时候顺手记一笔饭点。同一天里同一顿喂两回也只算吃过。 */
  function 记饭点() {
    const 数据 = 读变量();
    const 餐 = 这顿是哪餐();
    if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
    if (!数据.今日.饭点 || typeof 数据.今日.饭点 !== 'object') 数据.今日.饭点 = {};
    数据.今日.饭点[餐] = Number(数据.今日.饭点[餐] ?? 0) + 1;
    写变量();
    return 餐;
  }

  /** 今天三顿饭的样子，给回执用。 */
  function 饭点话() {
    const 饭点 = 存档().今日?.饭点 ?? {};
    const 现在几点 = new Date().toTimeString().slice(0, 5);
    const 段 = ['早', '午', '晚'].map(名 => 名 + (Number(饭点[名] ?? 0) > 0 ? '✓' : '✗')).join(' ');
    return 段 + '（现在 ' + 现在几点 + '，算' + 这顿是哪餐() + '饭）';
  }

  /* ── 做饭 ─────────────────────────────────
   *
   * 买回来的食材在这里下锅。做一顿：扣材料、涨饱食与心情、涨手艺，记一次下厨。
   * 手艺是自己练出来的，锅越做越顺；到 60 可以编一本厨艺书留给她，
   * 她照着学会自己做饭，那以后挂机时她饿得慢一半（规则在 `脚本/离线结算.ts`）。
   */

  /** 家里这样东西有几份。 */
  function 家里几份(名) {
    return Number(存档().物品?.[名]?.数量 ?? 0);
  }

  /** 这道菜现在能不能做。返回 { 能, 理由 }。 */
  function 能不能做(谱) {
    if (今日额度().饭 <= 0) return { 能: false, 理由: '今天已经下了 ' + 上限.饭 + ' 趟厨' };
    if (谱.季 && !谱.季.includes(现实季节())) return { 能: false, 理由: '这个季节没有' + 谱.名 + '的材料' };
    if (Number(谱.需手艺 ?? 0) > Number(存档().进度?.手艺 ?? 0)) {
      return { 能: false, 理由: '手艺还不够（要 ' + 谱.需手艺 + '）' };
    }
    const 缺 = Object.entries(谱.需要).filter(([名, 份]) => 家里几份(名) < Number(份));
    if (缺.length) return { 能: false, 理由: '缺 ' + 缺.map(([名, 份]) => 名 + '×' + 份).join('、') };
    return { 能: true, 理由: '' };
  }

  function renderCook() {

      (说明书
        ? '她已经照着你写的厨艺书学会自己做饭了，你不在家的时候她饿得慢一半。'
        : '手艺到 <b>' + 编书门槛 + '</b> 就能把做过的菜写成一本厨艺书，她照着学，以后一个人也能弄口热的。');
    容器.appendChild(说明);

    if (!说明书 && 手艺 >= 编书门槛) {

      头.appendChild(造('span', '货价', '饱食 +' + 谱.饥饿));
      格.appendChild(头);

      格.appendChild(造('div', '货效', '心情 +' + 谱.心情 + (谱.健康 ? ' · 健康 +' + 谱.健康 : '') + ' · 手艺 +' + 谱.手艺));
      const 料 = Object.entries(谱.需要)
        .map(([名, 份]) => 名 + ' ' + 家里几份(名) + '/' + 份)
        .join('　');

      if (谱.季) 格.appendChild(造('div', '货款', '时令 · ' + 谱.季.join('／') + '天'));
      if (!判.能) 格.appendChild(造('div', '货效 缺', 判.理由));

      const 脚 = 造('div', '货脚');
      const 钮 = 造('button', 'item-act-btn', 判.能 ? '下锅' : '做不了');
      钮.disabled = !判.能;
      if (判.能) 钮.addEventListener('click', () => 做这道菜(谱));
      脚.appendChild(钮);
      格.appendChild(脚);
      网.appendChild(格);
    });
    容器.appendChild(网);
  }

  function 做这道菜(谱) {
    const 判 = 能不能做(谱);
    if (!判.能) {
      提示(判.理由 + '。', 3600, '差');
      return;
    }
    const 数据 = 读变量();
    const 前饥 = Number(数据.妹妹?.饥饿 ?? 70);
    const 前心 = Number(数据.妹妹?.心情 ?? 60);
    const 前康 = Number(数据.妹妹?.健康 ?? 90);
    const 前艺 = Number(数据.进度?.手艺 ?? 0);

    Object.entries(谱.需要).forEach(([名, 份]) => {
      for (let i = 0; i < Number(份); i++) 扣一个(名);
    });
    数据.妹妹.饥饿 = 钳(前饥 + 谱.饥饿);
    数据.妹妹.心情 = 钳(前心 + 谱.心情);
    if (谱.健康) 数据.妹妹.健康 = 钳(前康 + 谱.健康);
    const 涨 = Math.max(1, Math.min(8, Math.round(谱.手艺 / 2)));
    数据.进度.手艺 = Math.max(0, Math.min(100, 前艺 + 涨));
    if (!数据.进度 || typeof 数据.进度 !== 'object') 数据.进度 = {};
    const 餐 = 记饭点();
    记今天的账('做过饭');
    写变量();

    她说话(抽(['“好香呀。哥哥你先尝一口。”', '“这个比小卖部的强。”', '“我闻见味儿了，从楼道就闻见了。”']));
    提示(
      回执(
        [
          变化段('饱食', 前饥, 数据.妹妹.饥饿),
          变化段('心情', 前心, 数据.妹妹.心情),
          谱.健康 ? 变化段('健康', 前康, 数据.妹妹.健康) : '',
        ],
        '这顿算' + 餐 + '饭。手艺 ' + 前艺 + ' → ' + 数据.进度.手艺 + '（+' + 涨 + '，' + 取手艺档(数据.进度.手艺).名 +
          '）。今天还能下厨 ' + 今日额度().饭 + ' 趟',
      ),
      7600,
      '好',
    );
    飘字('val-hunger', 有号(数据.妹妹.饥饿 - 前饥), '加');
    飘字('val-mood', 有号(数据.妹妹.心情 - 前心), '加');
    亮条('bar-hunger');
    亮条('bar-mood');
    updateUI();
    renderCook();
  }

  function 编厨艺书() {
    const 数据 = 读变量();
    const 手艺 = Number(数据.进度?.手艺 ?? 0);
    if (Number(数据.进度?.厨艺书 ?? 0) >= 1) {
      提示('厨艺书早就编好了，她照着做呢。', 3200, '常');
      return;
    }
    if (手艺 < 编书门槛) {
      提示('手艺还不到 ' + 编书门槛 + '（现在 ' + 手艺 + '），再多做几顿。', 3800, '差');
      return;
    }
    数据.进度.厨艺书 = 1;
    写变量();
    她说话('“这是给我的？那我自己试试……做糊了你不许笑。”');
    提示(
      '你把这段时间做过的菜写成一本厨艺书，留给她。她照着学，以后一个人在家也能自己弄口热的：挂机时她饿得慢一半。',
      9000,
      '好',
    );
    updateUI();
    renderCook();
  }

  function 扣一个(名) {
    const 数据 = 存档();
    const 条 = 数据.物品?.[名];
    if (!条) return;
    条.数量 = Number(条.数量) - 1;
    if (条.数量 <= 0) delete 数据.物品[名];
  }

  /* ── 购物车 ───────────────────────────────
   *
   * 买东西不再是一键立刻成交：先加进车，看着合计与还差多少，再一起结账。
   * 车放在 localStorage 里。面板挂在楼层 iframe 上，每层楼重开一次，
   * 车里还没结的货不能因为翻页就丢。
   */

  const 车键 = 'zhixia:购物车';

  /** 纯算账：不碰界面，也不碰存档。验收脚本单独跑这个函数核数。 */
  function 算购物车(车, 钱) {
    const 列 = Array.isArray(车) ? 车 : [];
    const 合计 = 列.reduce((和, 项) => 和 + Number(项.价) * Number(项.数), 0);
    const 件数 = 列.reduce((和, 项) => 和 + Number(项.数), 0);
    const 资金 = Number(钱) || 0;
    return {
      合计: 合计,
      件数: 件数,
      付得起: 资金 >= 合计,
      还差: Math.max(0, 合计 - 资金),
      结余: 资金 - 合计,
    };
  }

  function 读车() {
    try {
      const 存 = JSON.parse(localStorage.getItem(车键) || '[]');
      return Array.isArray(存) ? 存.filter(项 => 项 && 项.名) : [];
    } catch {
      return [];
    }
  }

  function 存车(车) {
    购物车 = Array.isArray(车) ? 车 : [];
    try {
      localStorage.setItem(车键, JSON.stringify(购物车));
    } catch {
      /* 存不进去也不影响这一次结账 */
    }
  }

  let 购物车 = 读车();
  let 最近一次结账 = '';

  /* ── 存货与进货 ───────────────────────────
   *
   * 王婶的店不是无底洞：每样货一轮只进那么多，卖完就挂「卖完了」。
   * 存货存在角色卡的变量里（`_进货`），跟钱、物品一起走存档：
   * 换设备、清浏览器缓存都不会让货架凭空回满。
   *
   * 进货按真实时钟算，不看面板开没开着：
   * 每天 0 点起数，每六小时一段（0/6/12/18 点）。时段一变，货架补满。
   * 所以这里存的是「第几个时段」，不是时间戳，也就不会因为忘开面板而错位。
   */

  const 进货间隔 = 6 * 60 * 60 * 1000;

  /** 今天 0 点的毫秒数。进货时段从这一天算起。 */
  function 今天零点(现在) {
    const 日 = new Date(Number(现在) || Date.now());
    日.setHours(0, 0, 0, 0);
    return 日.getTime();
  }

  /** 纯算数：现在是第几个进货时段、下一次进货在什么时候。 */
  function 算进货时段(现在, 零点, 间隔) {
    const 时 = Number(现在) || 0;
    const 起 = Number(零点) || 0;
    const 隔 = Number(间隔) || 1;
    const 槽 = Math.max(0, Math.floor((时 - 起) / 隔));
    const 下次 = 起 + (槽 + 1) * 隔;
    return { 槽: 槽, 下次: 下次, 还有: Math.max(0, 下次 - 时) };
  }

  /** 纯算数：这一轮最多还能往车里放几件。不碰界面也不碰存档。 */
  function 算限购(上限, 库存剩, 车里已有) {
    const 顶 = Math.max(0, Math.round(Number(上限) || 0));
    const 剩 = Math.max(0, Math.min(顶, Math.round(Number(库存剩) || 0)));
    const 车 = Math.max(0, Math.round(Number(车里已有) || 0));
    return { 上限: 顶, 剩: 剩, 车里: 车, 可加: Math.max(0, 剩 - 车), 卖完: 剩 <= 0 };
  }

  /** 这一轮该有的满架。价钱为 0 的家常东西不进这个表，它们不限购。 */
  function 满架() {
    const 表 = {};
    上架的.forEach(货 => {
      表[货.名] = Number(货.存 ?? 0);
    });
    return 表;
  }

  /** 读变量里的货架。变量还没读到就先按满架算，等读到了会自己校正。 */
  function 读库存() {
    const 数据 = 读变量();
    const 存 = 数据?._进货;
    const 现在 = Date.now();
    const 此刻 = 算进货时段(现在, 今天零点(现在), 进货间隔);
    if (!存 || typeof 存 !== 'object' || !存.数 || typeof 存.数 !== 'object') {
      return { 槽: 此刻.槽, 数: 满架(), 空: true };
    }
    return { 槽: Number(存.槽 ?? -1), 数: 存.数, 空: false };
  }

  function 写库存(表) {
    const 数据 = 读变量();
    if (!数据) return;
    数据._进货 = { 槽: Number(表.槽) || 0, 数: 表.数 && typeof 表.数 === 'object' ? 表.数 : {} };
    写变量();
  }

  /** 到点了就补货。返回补过的货名清单，好让面板报一句「王婶上货了」。 */
  function 进货检查() {
    const 数据 = 读变量();
    if (!数据) return [];
    const 现在 = Date.now();
    const 此刻 = 算进货时段(现在, 今天零点(现在), 进货间隔);
    const 存 = 读库存();

    // 第一次用（或者存档里还没这个字段）：给一满架，记下是哪个时段。
    if (存.空) {
      写库存({ 槽: 此刻.槽, 数: 满架() });
      return [];
    }
    // 已经跨到下一个时段了：补满。补几样就报几样。
    if (存.槽 === 此刻.槽) return [];

    const 满 = 满架();
    const 补过 = [];
    上架的.forEach(货 => {
      if (Number(存.数[货.名] ?? 0) < Number(货.存 ?? 0)) 补过.push(货.名 + ' ' + Number(货.存 ?? 0));
    });
    写库存({ 槽: 此刻.槽, 数: 满 });
    return 补过;
  }

  /** 这样货这一轮还剩几件。不限购的给 Infinity。 */
  function 剩几件(名) {
    const 货 = 货架.find(x => x.名 === 名);
    if (!货 || Number(货.价) <= 0) return Infinity;
    const 存 = 读库存();
    return Number(存.数[名] ?? 0);
  }

  function 扣库存(名, 数) {
    const 货 = 货架.find(x => x.名 === 名);
    if (!货 || Number(货.价) <= 0) return;
    const 存 = 读库存();
    存.数[名] = Math.max(0, Number(存.数[名] ?? 0) - Number(数 || 1));
    写库存({ 槽: 存.槽, 数: 存.数 });
  }

  /** 距离下一次进货还有多久，以及那是几点。 */
  function 距离进货(现在) {
    const 时 = Number(现在) || Date.now();
    return 算进货时段(时, 今天零点(时), 进货间隔);
  }

  /** 把「下次进货」说清楚：18:00（还有 2 小时 8 分钟）。 */
  function 下次进货话(现在) {
    const 算 = 距离进货(现在);
    const 点 = new Date(算.下次);
    const 时 = String(点.getHours()).padStart(2, '0');
    const 分 = String(点.getMinutes()).padStart(2, '0');
    return 时 + ':' + 分 + '（还有 ' + 说多久(算.还有) + '）';
  }

  /** 把毫秒说成人话：5 小时 12 分钟。 */
  function 说多久(毫秒) {
    const 分 = Math.ceil(Math.max(0, 毫秒) / 60000);
    if (分 <= 0) return '不到 1 分钟';
    const 时 = Math.floor(分 / 60);
    const 余 = 分 % 60;
    return 时 ? 时 + ' 小时' + (余 ? ' ' + 余 + ' 分钟' : '') : 余 + ' 分钟';
  }

  /** 车里这个货有几件。 */
  function 车里几件(名) {
    const 有 = 读车().find(项 => 项.名 === 名);
    return 有 ? Number(有.数) : 0;
  }

  function 晃一下(id) {
    const 块 = document.getElementById(id);
    if (!块) return;
    块.classList.remove('动');
    void 块.offsetWidth;
    块.classList.add('动');
  }

  function 加车(名) {
    const 货 = 货架.find(x => x.名 === 名);
    if (!货) return;
    const 件 = 算限购(货.存 ?? 0, 剩几件(名), 车里几件(名));
    if (件.可加 <= 0) {
      if (件.卖完) {
        提示(
          '这一轮的' + 名 + '卖完了。下次进货 ' + 下次进货话() + '，先买别的。',
          5000,
          '差',
        );
      } else {
        提示('这一轮进的' + 名 + '一共就 ' + 件.上限 + ' 件，车里已经占满，先结账再来。', 4600, '差');
      }
      return;
    }

    const 车 = 读车();
    const 有 = 车.find(x => x.名 === 名);
    if (有) 有.数 = Number(有.数) + 1;
    else 车.push({ 名: 货.名, 价: 货.价, 数: 1 });
    存车(车);

    const 账 = 算购物车(车, 读变量().钱);
    const 剩 = 件.剩 - (车里几件(名));
    if (!账.付得起) {
      提示('加进车里：' + 名 + '。合计 ￥' + 账.合计 + '，手上的钱还差 ￥' + 账.还差 + '，去掉几件再结账。', 4600, '差');
    } else {
      提示(
        '加进车里：' + 名 + '。车里 ' + 账.件数 + ' 件，合计 ￥' + 账.合计 + '。' +
          '这一轮还剩 ' + Math.max(0, 剩) + ' 件。',
        3600,
        '好',
      );
    }
    晃一下('cart-strip');
    renderShop();
  }

  function 减车(名) {
    const 车 = 读车();
    const 有 = 车.find(项 => 项.名 === 名);
    if (!有) return;
    if (Number(有.数) <= 1) 车.splice(车.indexOf(有), 1);
    else 有.数 = Number(有.数) - 1;
    存车(车);
    const 账 = 算购物车(车, 存档().钱);
    提示(
      账.件数 ? '从车里拿出：' + 名 + '。还剩 ' + 账.件数 + ' 件，合计 ￥' + 账.合计 + '。' : '车空了。',
      2800,
      '常',
    );
    晃一下('cart-strip');
    renderShop();
  }

  function 清空车() {
    if (!读车().length) {
      提示('车本来就是空的。', 2200, '常');
      return;
    }
    存车([]);
    提示('车清空了，钱没动。', 2600, '常');
    晃一下('cart-strip');
    renderShop();
  }

  /** 结账：一次扣钱、一次入库、记一趟出门。 */
  function 结算() {
    const 车 = 读车();
    if (!车.length) {
      提示('车里还是空的。先挑几件放进来。', 2800, '差');
      return;
    }
    if (今日额度().买 <= 0) {
      提示('今天已经去过 ' + 上限.买 + ' 趟小卖部了，王婶也要关门。明天再说。', 4200, '差');
      return;
    }
    const 数据 = 读变量();
    const 账 = 算购物车(车, 数据.钱);
    if (!账.付得起) {
      提示('钱不够：合计 ￥' + 账.合计 + '，还差 ￥' + 账.还差 + '。去掉几件，或者先去出工。', 4600, '差');
      return;
    }

    const 前钱 = Number(数据.钱 ?? 0);
    const 前心 = Number(数据.妹妹?.心情 ?? 60);
    数据.钱 = 前钱 - 账.合计;
    if (!数据.物品 || typeof 数据.物品 !== 'object') 数据.物品 = {};
    if (!数据.衣柜 || typeof 数据.衣柜 !== 'object') 数据.衣柜 = {};
    if (!数据.衣柜.已购 || typeof 数据.衣柜.已购 !== 'object') 数据.衣柜.已购 = {};
    const 单子 = [];
    const 剩余 = [];
    const 衣服 = [];
    let 心情加成 = 0;
    车.forEach(项 => {
      const 货 = 货架.find(x => x.名 === 项.名);
      const 数 = Number(项.数);
      // 衣服进衣柜，别的进家里的柜子。衣服不看件数，有一件就是有了。
      if (货 && 货.保暖 !== undefined) {
        数据.衣柜.已购[项.名] = 1;
        心情加成 += Number(货.心情加成 ?? 0);
        衣服.push(项.名);
      } else {
        if (!数据.物品[项.名]) 数据.物品[项.名] = { 数量: 0, 类别: (货 && 货.类) || '食物' };
        数据.物品[项.名].数量 = Number(数据.物品[项.名].数量) + 数;
      }
      扣库存(项.名, 数);
      单子.push(项.名 + '×' + 数);
      if (货) 剩余.push(货.名 + ' 剩 ' + 剩几件(货.名) + '/' + (货.存 ?? 0));
    });
    if (心情加成 > 0) 数据.妹妹.心情 = 钳(前心 + 心情加成);
    记今天的账('买过');
    写变量();

    最近一次结账 = 单子.join('、') + '，一共 ￥' + 账.合计;
    存车([]);
    // 货架余量最多列三样，多了就说「等几样」，不然一条提示能铺满半屏。
    const 余量话 = 剩余.length > 3 ? 剩余.slice(0, 3).join('　') + '　等 ' + 剩余.length + ' 样' : 剩余.join('　');
    提示(
      '结账：' + 单子.join('、') + '。' +
        变化段('钱', 前钱, 数据.钱) +
        (心情加成 > 0 ? '，' + 变化段('心情', 前心, 数据.妹妹.心情) : '') +
        '。' +
        (衣服.length ? '衣服挂进衣柜了：' + 衣服.join('、') + '。' : '') +
        '货架：' + 余量话 +
        '。下次进货 ' + 下次进货话() + '。',
      7200,
      '好',
    );
    飘字('txt-money', '−￥' + 账.合计, '减');
    if (心情加成 > 0) {
      飘字('val-mood', '+' + (数据.妹妹.心情 - 前心), '加');
      亮条('bar-mood');
      她说话(抽(['“给我的呀……我先去试试，你别看。”', '“这个我收着，等过年穿。”', '“哥哥你挑的呀。那我不换了。”']));
    }
    晃一下('cart-strip');
    updateUI();
    renderShop();
  }

  function 抽(表) {
    return 表[Math.floor(Math.random() * 表.length)];
  }

  /** 摸头说哪一句：先抽变量里 AI 补的那几句（贴当下），抽空了才用面板自带的通用池。
   *  顺序反过来的话，AI 写的那些永远轮不上。 */
  function 抽一句摸头话() {
    const 数据 = 读变量();
    const 存着 = 数据.妹妹?.摸头话;
    if (存着 && typeof 存着 === 'object') {
      const 键们 = Object.keys(存着).filter(键 => String(存着[键] ?? '').trim());
      if (键们.length) {
        const 键 = 抽(键们);
        const 话 = String(存着[键]).trim();
        delete 存着[键];
        写变量();
        return 话;
      }
    }
    return 抽(摸头的话);
  }

  /** 她攒下的话。挑走一句就删掉，所以她攒过的话一辈子只说一次。 */
  function 挑一句待说话() {
    const 数据 = 读变量();
    const 存着 = 数据.妹妹?.待说话;
    if (!存着 || typeof 存着 !== 'object') return null;
    const 键们 = Object.keys(存着).filter(键 => String(存着[键] ?? '').trim());
    if (!键们.length) return null;

    const 键 = 抽(键们);
    const 话 = String(存着[键]).trim();
    delete 存着[键];
    写变量();
    return 话;
  }

  /** 把攒着的话说出来。她讲完就把这一句从变量里删掉。 */
  function 讲攒下的话() {
    const 话 = 挑一句待说话();
    if (!话) return false;
    她说话(话, 10000);
    return true;
  }

  /** 按她的状态挑一句。病着她会瞒，饿着她会让你先吃，这是这个人的做法。 */
  function 此刻的话() {
    const 妹 = 存档().妹妹 ?? {};
    const 饿 = Number(妹.饥饿 ?? 70);
    const 心情 = Number(妹.心情 ?? 60);
    const 病 = String(妹.病症 ?? '无');
    if (病 !== '无') return 抽(状态的话.病);
    if (饿 < 25) return 抽(状态的话.饿);
    if (心情 < 35) return 抽(状态的话.低落);
    if (心情 >= 75) return 抽(状态的话.高兴);
    return 抽(状态的话.平常);
  }

  /** 摸头没有冷却，随便摸。
   *  限制加在「心情」上：摸她一天最多把心情顶上去 12 点，摸够了照样有反应，只是不再涨。 */
  const 摸头日上限 = 12;
  const 摸头每次 = 2;

  function 今天摸头加了() {
    const 今 = 存档().今日 ?? {};
    if (String(今.日期 ?? '') !== 今天记号()) return 0;
    return Number(今.摸头加过 ?? 0);
  }

  function petZhixia() {
    const 数据 = 读变量();
    const 剩下 = Math.max(0, 摸头日上限 - 今天摸头加了());
    const 加 = Math.min(摸头每次, 剩下);
    const 前心 = Number(数据.妹妹.心情 ?? 60);

    if (加 > 0) {
      数据.妹妹.心情 = 钳(前心 + 加);
      if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
      if (String(数据.今日.日期 ?? '') !== 今天记号()) 数据.今日.日期 = 今天记号();
      数据.今日.摸头加过 = 今天摸头加了() + 加;
      写变量();
    }

    const 心 = document.getElementById('pet-heart');
    心.classList.remove('跳');
    void 心.offsetWidth;
    心.classList.add('跳');

    // 摸够了也照样有反应，只是话不一样。
    // 气泡里只放她的话，前面不写旁白（例如「她有点不好意思了：」这种一律不加）。
    她说话(加 > 0 ? 抽一句摸头话() : 抽(摸够了的话));

    if (加 > 0) {
      const 之后 = Math.max(0, 摸头日上限 - 今天摸头加了());
      提示(
        回执([变化段('心情', 前心, 数据.妹妹.心情)], '今天摸头还能加 ' + 之后 + ' 点心情'),
        4200,
        '好',
      );
      飘字('val-mood', '+' + 加, '加');
      亮条('bar-mood');
    } else {
      提示('今天摸够了（已经加了 ' + 摸头日上限 + ' 点心情），她还在陪你说话，但心情不再涨。明天再来。', 4600, '差');
    }
    updateUI();
  }

  /** 歇口气：回一点体力。半小时一次，不能一直歇。 */
  const 歇的间隔 = 30 * 60 * 1000;
  let 上次歇 = 0;

  /** 冷却还剩多少毫秒。面板重开也要接着算，所以上次歇的时刻存在 localStorage 里。 */
  function 距离能歇() {
    let 记着 = 0;
    try {
      const 存 = Number(localStorage.getItem('zhixia:上次歇') || 0);
      记着 = Number.isFinite(存) ? 存 : 0;
    } catch {
      记着 = 0;
    }
    const 上次 = Math.max(上次歇, 记着);
    return Math.max(0, 歇的间隔 - (Date.now() - 上次));
  }

  function 画歇的提示() {
    const 位 = document.getElementById('rest-hint');
    if (!位) return;
    const 余 = 距离能歇();
    if (余 <= 0) {
      位.innerHTML = '可以歇口气了（体力 +12）';
      return;
    }
    const 分 = Math.ceil(余 / 60000);
    位.innerHTML = '刚歇过，' + 分 + ' 分钟后能再歇';
  }

  function 歇一会儿() {
    const 余 = 距离能歇();
    if (余 > 0) {
      提示('刚歇过。' + Math.ceil(余 / 60000) + ' 分钟后能再歇。', 3200, '差');
      画歇的提示();
      return;
    }
    上次歇 = Date.now();
    try {
      localStorage.setItem('zhixia:上次歇', String(上次歇));
    } catch {
      /* 存不进去只影响跨楼层续算 */
    }
    const 数据 = 读变量();
    const 前 = Number(数据.哥哥.体力 ?? 0);
    数据.哥哥.体力 = 钳(前 + 12);
    写变量();
    她说话(此刻的话());
    提示(
      回执([变化段('体力', 前, 数据.哥哥.体力)], '下次能歇：' + Math.round(歇的间隔 / 60000) + ' 分钟后'),
      4600,
      '好',
    );
    飘字('val-energy', 有号(数据.哥哥.体力 - 前), '加');
    亮条('bar-energy');
    updateUI();
    画歇的提示();
  }

  /* ── 出工：四款小游戏 ─────────────────────
   *
   * 工地搬料配重、后厨出餐顺序、仓库分拣、夜市送货路线。一局按题数出题，
   * 每题点一下，点对算对，不比手速，手机上也能玩。得分 = 答对题数 / 总题数 × 100。
   *
   * 收入 = 时薪 × 表现倍率(得分) × 熟练倍率 × 疲劳折扣，和 `面板数据` 里那套一致。
   * 一天只能出一趟工，跨天回满。
   */

  const 场地表 = [
    { 地: '工地', 名: '城东工地 · 搬料配重', 解锁: 0, 时薪: 90, 体力: 22, 玩法: '搬料配重', 题数: 6, 说明: '把料按重量配平，码到车上' },
    { 地: '后厨', 名: '巷口饭店 · 后厨备菜', 解锁: 0, 时薪: 110, 体力: 15, 玩法: '出餐顺序', 题数: 6, 说明: '按单子的先后出餐，别让菜凉在窗口' },
    { 地: '仓库', 名: '南门仓库 · 分拣', 解锁: 5, 时薪: 100, 体力: 18, 玩法: '分拣', 题数: 8, 说明: '照面单上的片区把包裹丢进对应的筐' },
    { 地: '夜市', 名: '夜市窄巷 · 送货', 解锁: 12, 时薪: 140, 体力: 25, 玩法: '送货路线', 题数: 3, 说明: '一晚上跑三个地址，路别绕远' },
  ];

  /** 熟练四档。改门槛就同时改了档位名与收入倍率。 */
  const 熟练档表 = [
    { 名: '生手', 门槛: 20, 倍率: 1 },
    { 名: '上手', 门槛: 45, 倍率: 1.15 },
    { 名: '熟手', 门槛: 75, 倍率: 1.3 },
    { 名: '老手', 门槛: 100, 倍率: 1.5 },
  ];
  const 疲劳线 = 30;

  /** 纯算数：熟练落在哪一档。 */
  function 取熟练档(值) {
    const 数 = Number(值);
    const 钳 = Number.isFinite(数) ? Math.max(0, Math.min(100, 数)) : 0;
    return 熟练档表.find(档 => 钳 < 档.门槛) ?? 熟练档表[熟练档表.length - 1];
  }

  /** 纯算数：表现分（0~100）换成收入倍率（0.6~1.6）。 */
  function 表现倍率(分) {
    const 钳 = Math.max(0, Math.min(100, Number(分) || 0));
    return Number((0.6 + (钳 / 100) * 1.0).toFixed(2));
  }

  /** 纯算数：一局打工的结算。验收脚本单独跑这个函数核数。
   *  参数缺了也按 0 算，宁可少给钱，也不要把 NaN 写进变量。 */
  function 结算打工(参数) {
    const 时薪 = Number(参数.时薪) || 0;
    const 力气 = Number(参数.力气) || 0;
    const 表现 = 表现倍率(参数.得分);
    const 熟练 = 取熟练档(参数.熟练);
    const 折扣 = 力气 < 疲劳线 ? 0.75 : 1;
    const 收入 = Math.max(0, Math.round(时薪 * 表现 * 熟练.倍率 * 折扣));
    const 得分 = Math.max(0, Math.min(100, Number(参数.得分) || 0));
    const 熟练变化 = Math.max(1, Math.round((得分 / 100) * 8));
    return { 收入, 表现倍率: 表现, 熟练倍率: 熟练.倍率, 疲劳折扣: 折扣, 体力消耗: Number(参数.体力消耗) || 0, 熟练变化 };
  }

  /** 到今天为止一共出过几次工。仓库与夜市按这个解锁。 */
  function 做过几次() {
    const 次数 = 存档().进度?.次数 ?? {};
    return Object.values(次数).reduce((和, 次) => 和 + (Number(次) || 0), 0);
  }

  /* ── 题面 ───────────────────────────────── */

  const 出餐菜单 = [
    { 名: '红烧肉', 类: '热菜' }, { 名: '番茄炒蛋', 类: '热菜' }, { 名: '酸辣汤', 类: '热菜' },
    { 名: '小炒肉', 类: '热菜' }, { 名: '干煸豆角', 类: '热菜' }, { 名: '青椒肉丝', 类: '热菜' },
    { 名: '拍黄瓜', 类: '凉菜' }, { 名: '拌木耳', 类: '凉菜' }, { 名: '口水鸡', 类: '凉菜' },
    { 名: '皮蛋豆腐', 类: '凉菜' }, { 名: '凉拌三丝', 类: '凉菜' }, { 名: '蘸水白肉', 类: '凉菜' },

    { 名: '北巷文具', 区: '北区' }, { 名: '针织二厂', 区: '北区' }, { 名: '河沿粮油', 区: '西区' },
    { 名: '铁西修车', 区: '东区' },

  const 路况 = [

    { 说: '巷子里在修路，只留一条道', 取: '近' },

    { 说: '下过雨，小路全是水坑', 取: '近' },
    { 说: '老小区那段没路灯，夜里不好走', 取: '远' },
    { 说: '夜市刚开摊，这条街上挤满人', 取: '远' },
  ];

  const 区们 = ['东区', '西区', '南区', '北区'];

  /** 出一道题。四款共用这一套形状：问、选项、正解下标、错了怎么说。 */
  function 造题(玩法) {
    if (玩法 === '出餐顺序') {
      const 菜 = 抽(出餐菜单);
      const 正解 = 菜.类 === '热菜' ? 0 : 1;
      return {
        问: '窗口的单子出来了：' + 菜.名,
        类: '该先出还是押后',
        正解,
        选项: ['先出', '押后'],
        错说: 菜.名 + '是' + 菜.类 + '，得' + (正解 === 0 ? '先出' : '押后') + '。',
      };
    }
    if (玩法 === '搬料配重') {
      const 已装 = 10 + Math.floor(Math.random() * 8) * 10;
      const 正解值 = 100 - 已装;
      let 错值 = 正解值 + (Math.random() < 0.5 ? -10 : 10);
      if (错值 === 正解值 || 错值 <= 0) 错值 = 正解值 + 20;
      const 正解在下标几 = Math.random() < 0.5 ? 0 : 1;
      return {
        问: '车上已经装了 ' + 已装 + '，还差多少够 100',
        类: '加多少',
        正解: 正解在下标几,
        选项: 正解在下标几 === 0 ? ['加 ' + 正解值, '加 ' + 错值] : ['加 ' + 错值, '加 ' + 正解值],
        错说: '这一趟只能装到 100，差 ' + 正解值 + '。',
      };
    }
    if (玩法 === '分拣') {
      const 单 = 抽(分拣单);
      return {
        问: '面单上写着：' + 单.名,
        类: '丢哪个筐',
        正解: 区们.indexOf(单.区),
        选项: 区们.slice(),
        错说: 单.名 + '是' + 单.区 + '的件。',
      };
    }
    const 情况 = 抽(路况);
    return {
      问: '站在路口，' + 情况.说,
      类: '走近路还是走大路',
      正解: 情况.取 === '近' ? 0 : 1,
      选项: ['穿巷子走近路', '绕主路走大路'],
      错说: '这一趟绕远了，下一单就赶不上点了。',
    };
  }

  /* ── 一局的状态机 ───────────────────────── */

  let 这一局 = null;

  function 开局(场) {
    const 额度 = 今日额度();
    if (额度.出工 <= 0) {
      提示('今天的活已经干完了。她在家等着，去正文里陪她说两句话。', 4200, '差');
      return;
    }
    const 数据 = 读变量();
    const 体力 = Number(数据.哥哥?.体力 ?? 0);
    if (体力 < 场.体力) {
      提示('体力不够：这趟要 ' + 场.体力 + ' 点，你现在 ' + 体力 + ' 点。先歇口气。', 4600, '差');
      return;
    }
    这一局 = {
      场,
      题号: 1,
      答过: 0,
      对: 0,
      提示: '',
      结束: false,
      剩余: Math.max(45, Math.min(120, Math.round(场.题数 * 11))),
      题: 造题(场.玩法),
    };
    这一局.秒表 = window.setInterval(() => {
      if (!这一局 || 这一局.结束) return;
      这一局.剩余 -= 1;
      if (这一局.剩余 <= 0) {
        收一局(true);
        return;
      }
      const 钟 = document.getElementById('game-钟');
      if (钟) 钟.textContent = '剩 ' + 这一局.剩余 + ' 秒';
    }, 1000);
    画一局(true);
  }

  function 画一局(重建) {
    const 容器 = document.getElementById('work-list');
    if (!容器 || !这一局) return;
    const 局 = 这一局;
    容器.innerHTML = '';

    const 头 = 造('div', 'game-head');
    头.appendChild(造('span', 'game-名', 局.场.名));
    头.appendChild(造('span', 'game-数', '第 ' + 局.题号 + '/' + 局.场.题数 + ' 题　对 ' + 局.对));
    const 钟 = 造('span', 'game-钟', '剩 ' + 局.剩余 + ' 秒');
    钟.id = 'game-钟';
    头.appendChild(钟);
    容器.appendChild(头);

    const 条 = 造('div', 'game-bar');
    for (let i = 1; i <= 局.场.题数; i++) {
      条.appendChild(造('span', 'game-格' + (i < 局.题号 ? ' 过' : i === 局.题号 ? ' 现在' : '')));
    }
    容器.appendChild(条);

    const 题 = 局.题;
    容器.appendChild(造('div', 'game-问', 题.问));
    if (题.类) 容器.appendChild(造('div', 'game-类', 题.类));

    const 选项 = 造('div', 'game-opts');
    题.选项.forEach((名, 下标) => {
      const 钮 = 造('button', 'game-opt', 名);
      钮.addEventListener('click', () => 答题(下标));
      选项.appendChild(钮);
    });
    容器.appendChild(选项);

    if (局.提示) 容器.appendChild(造('div', 'game-tip', 局.提示));

    const 退 = 造('button', 'cart-btn plain', '收工（按已答的算）');
    退.addEventListener('click', () => 收一局(true));
    容器.appendChild(退);
    void 重建;
  }

  function 答题(下标) {
    const 局 = 这一局;
    if (!局 || 局.结束) return;
    const 对 = 下标 === 局.题.正解;
    if (对) 局.对 += 1;
    局.答过 += 1;
    局.提示 = 对 ? '对了。' : '错了。' + (局.题.错说 || '');
    画一局(false);

    if (局.题号 >= 局.场.题数) {
      window.setTimeout(() => 收一局(false), 750);
      return;
    }
    window.setTimeout(() => {
      if (!这一局 || 这一局.结束) return;
      这一局.题号 += 1;
      这一局.题 = 造题(这一局.场.玩法);
      这一局.提示 = '';
      画一局(false);
    }, 750);
  }

  /** 收一局。`提前` 为真表示没做完就退，按已经答过的算。 */
  function 收一局(提前) {
    const 局 = 这一局;
    if (!局 || 局.结束) return;
    局.结束 = true;
    window.clearInterval(局.秒表);
    const 答过 = Math.max(1, 局.答过);
    const 得分 = 提前 ? Math.round((局.对 / 答过) * 100) : Math.round((局.对 / 局.场.题数) * 100);
    这一局 = null;
    交这一局(局, 得分, 提前);
  }

  /** 结算：扣体力、进钱、涨熟练、记今天出过工，然后把账目说清楚。 */
  function 交这一局(局, 得分, 提前) {
    const 数据 = 读变量();
    const 前钱 = Number(数据.钱 ?? 0);
    const 前力 = Number(数据.哥哥?.体力 ?? 0);
    const 熟练前 = Number(数据.进度?.熟练?.[局.场.地] ?? 0);
    const 结 = 结算打工({ 时薪: 局.场.时薪, 题数: 局.场.题数, 得分, 力气: 前力, 熟练: 熟练前, 体力消耗: 局.场.体力 });

    if (!数据.进度 || typeof 数据.进度 !== 'object') 数据.进度 = {};
    if (!数据.进度.熟练 || typeof 数据.进度.熟练 !== 'object') 数据.进度.熟练 = {};
    if (!数据.进度.次数 || typeof 数据.进度.次数 !== 'object') 数据.进度.次数 = {};
    if (!数据.哥哥 || typeof 数据.哥哥 !== 'object') 数据.哥哥 = {};
    数据.进度.熟练[局.场.地] = Math.max(0, Math.min(100, 熟练前 + 结.熟练变化));
    数据.进度.次数[局.场.地] = Number(数据.进度.次数[局.场.地] ?? 0) + 1;
    数据.进度.上次 = 局.场.名 + '　答对 ' + 局.对 + '/' + 局.场.题数;
    数据.哥哥.体力 = 钳(前力 - 局.场.体力);
    数据.钱 = Math.max(0, 前钱 + 结.收入);
    记今天的账('出过工');
    写变量();

    const 熟练后 = 数据.进度.熟练[局.场.地];
    提示(
      (提前 ? '提前收工。' : '出工回来。') + 局.场.名 + '：答对 ' + 局.对 + '/' + 局.场.题数 +
        '（表现 ' + 得分 + ' 分 × 熟练 ' + 结.熟练倍率 + (结.疲劳折扣 < 1 ? ' × 力气见底 ' + 结.疲劳折扣 : '') + '）。' +
        变化段('钱', 前钱, 数据.钱) + '，' + 变化段('体力', 前力, 数据.哥哥.体力) + '。' +
        '熟练 ' + 熟练前 + ' → ' + 熟练后 + '（' + 取熟练档(熟练后).名 + '）。今天的活已经干完了。',
      7600,
      '好',
    );
    飘字('txt-money', '+￥' + 结.收入, '加');
    飘字('val-energy', 有号(数据.哥哥.体力 - 前力), '减');
    亮条('bar-energy');
    她说话(抽(['“哥哥回来啦。”', '“今天累不累？”', '“我把饭扣在锅里了，还温着。”']));
    updateUI();
    renderWork();
  }

  function renderWork() {
    const 容器 = document.getElementById('work-list');
    const 数据 = 存档();
    const 额度 = 今日额度();
    const 体力 = Number(数据.哥哥?.体力 ?? 0);
    const 熟练 = 数据.进度?.熟练 ?? {};
    const 次数 = 数据.进度?.次数 ?? {};
    const 总共做过 = 做过几次();
    容器.innerHTML = '';

    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    说明.innerHTML =
      '今天还能出工：<b>' + 额度.出工 + '</b> 次　现在体力 <b>' + 体力 + '</b>　一共做过 <b>' + 总共做过 + '</b> 次<br>' +
      '做够 5 次开南门的仓库，做够 12 次开夜市的送货。<br>' +
      '收入按表现算：答对得多就拿得多，熟练越高倍率越高，力气低于 ' + 疲劳线 + ' 会打折。';
    容器.appendChild(说明);

    if (额度.出工 <= 0) {
      const 完 = document.createElement('p');
      完.className = 'dialog-note';
      完.innerHTML = '今天的活已经干完了。她在家等着，去正文里陪她说两句话。';
      容器.appendChild(完);
    }

    场地表.forEach(场 => {
      const 行 = document.createElement('div');
      行.className = 'item-card';
      const 够 = 体力 >= 场.体力;
      const 解锁 = 总共做过 >= 场.解锁;
      const 熟 = Number(熟练[场.地] ?? 0);
      const 档 = 取熟练档(熟);
      const 做过 = Number(次数[场.地] ?? 0);
      const 理由 = !解锁 ? '做过 ' + 场.解锁 + ' 次才接得到这份活'
        : 额度.出工 <= 0 ? '今天已经出过工了'
        : 够 ? '' : '体力不够（要 ' + 场.体力 + '）';

      const 文 = document.createElement('div');
      文.className = 'item-info';
      const 头 = document.createElement('h4');
      头.textContent = 场.名;
      文.appendChild(头);
      文.appendChild(造('p', '', 场.说明));
      文.appendChild(造('p', '', '答对 ' + 场.题数 + ' 题，一题一分　时薪 ￥' + 场.时薪));
      const 二 = 造('p');
      二.innerHTML =
        '体力 ' + 体力 + ' → <span class="小计">' + 钳(体力 - 场.体力) + '</span>（-' + 场.体力 + '）　' +
        '熟练 ' + 熟 + '（' + 档.名 + ' ×' + 档.倍率 + '）　做过 ' + 做过 + ' 次' +
        (理由 ? '　<span class="缺">' + 理由 + '</span>' : '');
      文.appendChild(二);
      行.appendChild(文);

      const 钮 = 造('button', 'item-act-btn', !解锁 ? '还没轮到' : 额度.出工 <= 0 ? '今天做过了' : 够 ? '开工' : '体力不够');
      钮.disabled = !解锁 || 额度.出工 <= 0 || !够;
      if (!钮.disabled) 钮.addEventListener('click', () => 开局(场));
      行.appendChild(钮);
      容器.appendChild(行);
    });
  }

  /* ── 任务弹窗 ─────────────────────────────
   *
   * 上半是每天固定的那几件，只读，由今日计数推出来。
   * 下半是她自己的事，每条底下挂一句她的心里话（变量里的 `想`）。
   * 玩家交代的事也写进同一个变量，键以「哥」开头，AI 之后会给它补心里话。
   */

  /** 造一个元素，顺带把类名和文字塞好。用 DOM 而不是拼 HTML，免得她把话里带进尖括号。 */
  function 造(标签, 类, 文字) {
    const 节点 = document.createElement(标签);
    if (类) 节点.className = 类;
    if (文字 !== undefined && 文字 !== null) 节点.textContent = String(文字);
    return 节点;
  }

  function renderTask() {
    const 容器 = document.getElementById('task-list');
    if (!容器) return;
    const 数据 = 存档();
    const 今 = 数据.今日 ?? {};
    const 妹 = 数据.妹妹 ?? {};
    容器.innerHTML = '';

    /* 一、每天固定的那几件 */
    const 每天 = 每日任务(今);
    const 小结 = 任务小结(每天);
    const 段一 = 造('div', 'task-sec');
    const 头一 = 造('div', 'task-title', '每天要做的事　');
    头一.appendChild(
      造('span', '计数', '已做 ' + 小结.已做 + ' · 还能做 ' + 小结.还能 + (小结.错过 ? ' · 错过 ' + 小结.错过 : '')),
    );
    段一.appendChild(头一);
    每天.forEach(项 => {
      const 行 = 造('div', 'task-row' + (项.状态 === '完' ? ' 完' : 项.状态 === '过了' || 项.状态 === '没到' ? ' 够不着' : ''));
      行.appendChild(造('span', 'task-勾 只读', 项.状态 === '完' ? '✓' : 项.状态 === '现在' ? '○' : '—'));
      const 文 = 造('div', 'task-正文');
      文.appendChild(造('div', 'task-事', 项.名));
      文.appendChild(造('div', 'task-来头', 项.细));
      const 状态话 =
        项.状态 === '完' ? '做完了' : 项.状态 === '现在' ? '这个钟点就能做' : 项.状态 === '过了' ? '时间过了，明天再说' : '还没到时候';
      文.appendChild(造('div', 'task-状态 ' + (项.状态 === '现在' ? '现在' : 项.状态 === '过了' ? '过了' : '别的'), 状态话));
      行.appendChild(文);
      段一.appendChild(行);
    });
    容器.appendChild(段一);

    /* 二、她自己的事 */
    const 她的事 = Object.entries(妹.任务 ?? {}).filter(([, 条]) => String(条?.事 ?? '').trim());
    她的事.sort((甲, 乙) => Number(甲[1].完 ?? 0) - Number(乙[1].完 ?? 0));
    const 没做 = 她的事.filter(([, 条]) => Number(条.完 ?? 0) === 0).length;

    const 段二 = 造('div', 'task-sec');
    const 头二 = 造('div', 'task-title', '她自己的事　');
    头二.appendChild(造('span', '计数', 她的事.length ? 没做 + ' 件没做' : '还空着'));
    段二.appendChild(头二);

    if (!她的事.length) {
      段二.appendChild(造('p', 'task-空', '她还没惦记什么。你可以在下面交代一件，或者等正文里她自己想起来。'));
    }

    她的事.forEach(([键, 条]) => {
      const 完 = Number(条.完 ?? 0) === 1;
      const 行 = 造('div', 'task-row' + (完 ? ' 完' : ''));

      const 勾 = 造('button', 'task-勾', 完 ? '✓' : '');
      勾.title = 完 ? '标成还没做' : '标成做完了';
      勾.addEventListener('click', () => 翻任务(键));
      行.appendChild(勾);

      const 文 = 造('div', 'task-正文');
      文.appendChild(造('div', 'task-事', String(条.事 ?? '') + (完 ? '（做完了）' : '')));
      const 想 = String(条.想 ?? '').trim();
      if (想) 文.appendChild(造('div', 'task-想', 想));
      else 文.appendChild(造('div', 'task-来头', '她还没说过这件事，等正文里她开口'));
      文.appendChild(造('div', 'task-来头', String(键).startsWith('哥') ? '你交代的' : '她自己想的'));
      行.appendChild(文);

      const 删 = 造('button', 'task-del', '✕');
      删.title = '删掉这一条';
      删.addEventListener('click', () => 删任务(键));
      行.appendChild(删);

      段二.appendChild(行);
    });

    const 加 = 造('div', 'task-add');
    const 输入 = 造('input');
    输入.id = 'task-input';
    输入.type = 'text';
    输入.maxLength = 40;
    输入.placeholder = '交代她一件事，例如：把窗花剪完';
    输入.addEventListener('keydown', 事 => {
      if (事.key === 'Enter') 加任务();
    });
    const 钮 = 造('button', 'cart-btn', '交代给她');
    钮.addEventListener('click', () => 加任务());
    加.appendChild(输入);
    加.appendChild(钮);
    段二.appendChild(加);

    容器.appendChild(段二);
  }

  /** 玩家交代一件事：写进变量，键用「哥1、哥2」，AI 之后会给它补她的心里话。 */
  function 加任务() {
    const 框 = document.getElementById('task-input');
    if (!框) return;
    const 话 = String(框.value ?? '').trim();
    if (!话) {
      提示('先写一件要她做的事。', 2600, '差');
      return;
    }
    const 数据 = 读变量();
    if (!数据.妹妹 || typeof 数据.妹妹 !== 'object') return;
    if (!数据.妹妹.任务 || typeof 数据.妹妹.任务 !== 'object') 数据.妹妹.任务 = {};

    const 她的事 = 数据.妹妹.任务;
    let 号 = 1;
    while (她的事['哥' + 号]) 号++;
    if (号 > 4) {
      提示('你交代的事已经攒了四件，先让她做掉一些再添。', 3800, '差');
      return;
    }
    她的事['哥' + 号] = { 事: 话, 想: '', 完: 0 };
    写变量();
    框.value = '';
    提示('交代给她了：' + 话 + '。等她在正文里做，或者你替她打勾；她的心里话之后会补上来。', 6000, '好');
    renderTask();
  }

  function 翻任务(键) {
    const 数据 = 读变量();
    const 条 = 数据.妹妹?.任务?.[键];
    if (!条) return;
    const 完 = Number(条.完 ?? 0) === 1 ? 0 : 1;
    条.完 = 完;
    写变量();
    提示('「' + String(条.事 ?? '') + '」标成' + (完 ? '做完了。' : '还没做。'), 3200, 完 ? '好' : '常');
    renderTask();
  }

  function 删任务(键) {
    const 数据 = 读变量();
    const 条 = 数据.妹妹?.任务?.[键];
    if (!条) return;
    const 事 = String(条.事 ?? '');
    delete 数据.妹妹.任务[键];
    写变量();
    提示('删掉了：' + 事, 3000, '常');
    renderTask();
  }

  /** 现在开着哪一类的页签。切页签不重算车，只是换个视角看货架。 */
  let 商店页签 = '食物';

  function renderShop() {
    const 容器 = document.getElementById('shop-list');
    const 滚动位置 = 容器.scrollTop;
    const 钱 = Number(存档().钱 ?? 0);
    const 车 = 读车();
    const 账 = 算购物车(车, 钱);
    const 当季 = 现实季节();
    const 上架 = 上架货();
    容器.innerHTML = '';

    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    const 节 = 今天的节();
    说明.innerHTML =
      '手上的钱 <b>￥' + 钱 + '</b>　今天还能出门 <b>' + 今日额度().买 + '</b> 趟　下次进货 <b>' + 下次进货话() + '</b><br>' +
      (节 ? '这几天在过<b>' + 节.节 + '</b>（' + 节.说 + '），货架上有过节的吃食。<br>' : '') +
      '现在是现实里的<b>' + 当季 + '</b>天：只摆当季的，标了「不限季」的四季都摆着。<br>' +
      '家里的热饭、热水、毛巾不用买，去「喂食」「照料」里用。';
    容器.appendChild(说明);

    // 分类页签：一次只看一类，省得拉成一长条。
    const 签条 = 造('div', 'shop-tabs');
    类别顺序.forEach(类 => {
      const 数 = 上架.filter(货 => 货.类 === 类).length;
      const 钮 = 造('button', 'shop-tab' + (商店页签 === 类 ? ' 现在' : ''), 类 + ' ' + 数);
      钮.title = '看' + 类 + '（' + 数 + ' 样）';
      钮.addEventListener('click', () => {
        商店页签 = 类;
        renderShop();
      });
      签条.appendChild(钮);
    });
    容器.appendChild(签条);

    const 这类的货 = 上架.filter(货 => 货.类 === 商店页签);
    const 画一组 = (标题, 货们) => {
      if (!货们.length) return;
      容器.appendChild(造('div', 'shop-group', 标题));
      const 网 = 造('div', 'shop-grid');
      货们.forEach(货 => 网.appendChild(造货格(货)));
      容器.appendChild(网);
    };

    if (!这类的货.length) {
      容器.appendChild(造('p', 'task-空', '这一类现在没有货。'));
    } else if (商店页签 === '食物') {
      // 食物分四段：过节的、现成能喂的、要下锅的、这一季才有的。
      const 节 = 今天的节();
      if (节) 画一组('节日 · ' + 节.节 + '（' + 节.说 + '）', 这类的货.filter(货 => 这件货过节吗(货, 节)));
      画一组('现成能喂 · 买了就能喂她', 这类的货.filter(货 => !货.节 && 货.食 !== '食材' && (!货.季 || 货.季.includes(当季))));
      画一组('买回去下锅 · 食材', 这类的货.filter(货 => !货.节 && 货.食 === '食材' && !货.季));
      画一组('时令 · ' + 当季 + '天才有的', 这类的货.filter(货 => !货.节 && 货.季 && 货.季.includes(当季)));
    } else if (商店页签 === '衣物') {
      // 衣物再分两组：当季的，和常年都摆的（含标了不限季的那几样）。
      画一组('当季 · ' + 当季 + '天穿', 这类的货.filter(货 => !货.常显 && 货.季 && 货.季.includes(当季)));
      画一组('常年都摆 · 不受季节影响', 这类的货.filter(货 => 货.常显 || !货.季));
    } else {
      画一组(商店页签, 这类的货);
    }

    if (最近一次结账) {
      const 单 = document.createElement('p');
      单.className = 'receipt';
      单.innerHTML = '最近一次结账：<b>' + 最近一次结账 + '</b>';
      容器.appendChild(单);
    }

    刷新车条(账, 车);
    // 每次都重建列表，得把滚动位置放回去，不然加减一件就从顶上重新看起。
    容器.scrollTop = 滚动位置;
  }

  /** 货架上的一格：名称、价钱、效果、剩余，加车或加减。
   *  整格都能点：点一下加一件，手机上也省得瞄准小按钮。已经在车里就交给加减号。 */
  function 造货格(货) {
    const 车里 = 车里几件(货.名);
    const 件 = 算限购(货.存 ?? 0, 剩几件(货.名), 车里);
    const 格 = 造('div', '货格' + (车里 ? ' 在车里' : '') + (件.卖完 ? ' 缺货' : ''));
    格.title = 货.名 + '：' + (货.说明 || '') + '（' + 效果话(货) + '）';
    if (!件.卖完 && 件.可加 > 0 && 车里 === 0) {
      格.addEventListener('click', () => 加车(货.名));
    }

    const 头 = 造('div', '货头');
    头.appendChild(造('span', '货名', 货.名));
    头.appendChild(造('span', '货价', '￥' + 货.价));
    格.appendChild(头);

    const 存话 = 件.卖完 ? '卖完了，' + 下次进货话() + ' 上货' : '剩 ' + 件.剩 + '/' + 件.上限;
    格.appendChild(造('div', '货效' + (件.卖完 ? ' 缺' : ''), 短效果(货) + '　' + 存话));
    // 颜色与款式直接印在格子上。手机上没有悬停，tooltip 看不见，所以不能只靠 tooltip。
    if (货.款) 格.appendChild(造('div', '货款', 货.款));

    const 脚 = 造('div', '货脚');
    if (件.卖完) {
      const 等 = 造('span', '小计', '等下一轮进货');
      脚.appendChild(等);
    } else if (车里) {
      const 减 = 造('button', 'qty-btn', '−');
      减.title = '从车里拿掉一件';
      减.addEventListener('click', () => 减车(货.名));
      const 加 = 造('button', 'qty-btn', '+');
      加.disabled = 件.可加 <= 0;
      加.title = 件.可加 > 0 ? '再加一件' : '这一轮就这么多了';
      加.addEventListener('click', () => 加车(货.名));
      脚.appendChild(减);
      脚.appendChild(造('span', 'qty-num', 车里));
      脚.appendChild(加);
    } else {
      const 加 = 造('button', 'item-act-btn', '放进车里');
      加.addEventListener('click', () => 加车(货.名));
      脚.appendChild(加);
    }
    格.appendChild(脚);
    return 格;
  }

  /** 一格里只报关键的两三项，细节交给 tooltip。 */
  function 短效果(货) {
    if (货.保暖 !== undefined) {
      const 季话 = 货.常显 ? '不限季' : 货.季 ? 货.季.join('／') + '天' : '四季';
      return '保暖 ' + 货.保暖 + ' · 心情 +' + (货.心情加成 ?? 0) + ' · ' + 季话;
    }
    const 段 = [];
    if (货.饥饿) 段.push('饱食 +' + 货.饥饿);
    if (货.健康) 段.push('健康 +' + 货.健康);
    if (货.心情) 段.push('心情 +' + 货.心情);
    if (货.治) 段.push('治' + 货.治);
    return 段.join(' · ') || '家里缺的小东西';
  }

  /** 一行说清这件货是干什么用的。衣物报保暖与穿上当天的心情。 */
  function 效果话(货) {
    if (货.保暖 !== undefined) {
      return '保暖 ' + 货.保暖 + '，她穿上当天心情 +' + (货.心情加成 ?? 0) + '。' + (货.说明 || '');
    }
    const 段 = [];
    if (货.饥饿) 段.push('饱食 +' + 货.饥饿);
    if (货.健康) 段.push('健康 +' + 货.健康);
    if (货.心情) 段.push('心情 +' + 货.心情);
    if (货.治) 段.push('治' + 货.治);
    if (!段.length) 段.push('家里缺的小东西');
    return 段.join('，') + '。' + (货.说明 || '');
  }

  /** 底部那条购物车：清单、合计、还差多少、能不能结账。 */
  function 刷新车条(账, 车) {
    const 行 = document.getElementById('cart-line');
    const 总 = document.getElementById('cart-total');
    const 键 = document.getElementById('cart-pay');
    if (!行 || !总 || !键) return;

    if (!车.length) {
      行.innerHTML = '<span class="空">车里还是空的。挑一件放进来。</span>';
      总.innerHTML = '合计 <b>￥0</b>';
      键.disabled = true;
      键.textContent = '结账';
      return;
    }

    行.innerHTML = 车.map(项 => 项.名 + '×' + 项.数 + ' <span class="空">￥' + Number(项.价) * Number(项.数) + '</span>').join('　');
    总.innerHTML =
      '合计 <b>￥' + 账.合计 + '</b>（' + 账.件数 + ' 件）' +
      (账.付得起 ? '　结完还剩 ￥' + 账.结余 : '　<span class="差">还差 ￥' + 账.还差 + '</span>');

    const 没额度 = 今日额度().买 <= 0;
    键.disabled = !账.付得起 || 没额度;
    键.textContent = 没额度 ? '今天去过了' : 账.付得起 ? '结账 ￥' + 账.合计 : '钱还差 ￥' + 账.还差;
  }

  /* 陪她这件事没有按钮。想陪她就自己在正文里说话、做事。
     面板只做喂她、给她用药、买东西、出工这几件「动手」的事。 */

  /* ── 起手 ───────────────────────────────── */

  function 起手() {
    // 到点了先把货补齐，再画界面，免得先画出上一轮的旧存货。
    看进货(true);
    updateUI();
    现实时钟();
    画歇的提示();
    window.setInterval(() => {
      现实时钟();
      画歇的提示();
      看进货(true);
    }, 20000);
    // 变量可能被正文那头的 AI 改，也可能被挂机脚本改，所以定期重读一次
    window.setInterval(updateUI, 3000);
    const 面 = document.getElementById('char-art');
    if (面) 面.addEventListener('error', () => {
      document.getElementById('no-art').style.display = 'flex';
    });

    // 挂机结算的回执。她一个人过了多久、掉了什么，脚本已经写在 $记账.上次结算 里，
    // 面板负责把它端到眼前，并且同一条只报一次。
    const 回执话 = String(存档().$记账?.上次结算 ?? '');
    if (回执话) {
      try {
        const 上次报过 = localStorage.getItem('zhixia:上次回执') || '';
        if (上次报过 !== 回执话) {
          提示('你不在的这段时间：' + 回执话, 7000, '常');
          localStorage.setItem('zhixia:上次回执', 回执话);
        }
      } catch {
        /* 存不进去就每次都报一遍，不影响功能 */
      }
    }

    // 一打开就先让她把攒着的话讲出来。这句是正文那头 AI 在她独处时记下的，
    // 挑走一句就删掉，所以攒过的话只会说一次。
    // 没有攒着的话，就按当前状态说一句，免得开场是空着的。
    let 正在讲攒的话 = 讲攒下的话();
    if (!正在讲攒的话) 她说话(此刻的话());

    // 面板不再自己定时让她说话。以前每 25 秒冒一句，玩家没摸她也在讲，
    // 而且一句接一句换、看着像永远不消失。现在只有动手（摸头、喂她、照料、歇口气）
    // 或攒着的话才开口，讲完就淡出。
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', 起手);
  else 起手();
</script>
