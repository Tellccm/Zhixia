<!DOCTYPE html>
<!--
  知夏 · 电子宠物面板（作者版 · 已接酒馆变量）
  放进公开仓库由 jsDelivr 提供，角色卡的正则把 [养成面板] 换成加载这个页面的语句。

  数据来源：本面板不再自己存档。所有数字都读写角色卡的变量（MVU 的 stat_data），
  和挂机结算脚本、正文里的变量更新规则共用同一份。所以在这个面板上喂她一口饭，
  正文下一轮就会知道；正文说她饿了，这个面板也会跟着变。

  改动记录（相对作者初版）：
  - 去掉 localStorage 存档，改成读写 stat_data
  - 六个 emoji 图标换成汉字，四列布局补成七格
  - 状态条沿用原配色，数值取自变量
  - 出工不再自己发钱：玩小游戏在另一块面板的「挣」页，这里是今日出工状态
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>知夏 · 电子宠物养成面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    /* html 给高度，body 的百分比才有着落；但面板本身是固定尺寸，不跟着视口长。 */
    html {
      height: 100%;
    }
    body {
      background: #1c1917;
      color: #f5f5f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      padding: 10px;
    }
    .panel-container {
      width: 100%;
      max-width: 480px;
      background: #292524;
      border: 3px solid #78350f;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(180,83,9,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-bar {
      background: linear-gradient(180deg, #1c1917 0%, #292524 100%);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #44403c;
      gap: 8px;
    }
    .date-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1c1917;
      border: 1px solid #78350f;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #fef3c7;
      white-space: nowrap;
    }
    .date-badge .seal {
      font-size: 10px;
      color: #b45309;
      letter-spacing: 0.1em;
    }
    .clock-badge {
      font-size: 11px;
      color: #a8a29e;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .money-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #451a03;
      border: 1px solid #b45309;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #fde68a;
      font-family: monospace;
    }
    .notice {
      display: none;
      padding: 7px 14px;
      background: #0c0a09;
      border-bottom: 1px solid #44403c;
      font-size: 11.5px;
      line-height: 1.5;
      color: #fcd34d;
    }
    .notice.show { display: block; }
    /* 宠物屏是一块固定尺寸的屏幕，不是能无限拉长的容器。
       之前试过按视口算高度（calc(100vh - 250px)），在长窗口里被拉得极长，所以退回固定值。
       屏幕 400 ＋ 顶栏与状态条 90 ＋ 按钮区 140，整体约 640，正好放进楼层。 */
    .pet-screen {
      position: relative;
      height: 400px;
      flex: 0 0 auto;
      background: #0c0a09;
      overflow: hidden;
      cursor: pointer;
    }
    /* 她站的位置随心情挪：心情好往前站，不好就往墙边缩。位置规则也写在下面的 .zhixia-char-wrap 里。 */
    .pet-heart {
      position: absolute;
      top: -18px;
      left: 50%;
      font-size: 16px;
      color: #f472b6;
      opacity: 0;
      pointer-events: none;
    }
    .pet-heart.跳 { animation: 浮起 1.1s ease-out; }
    @keyframes 浮起 {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.7); }
      30% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -26px) scale(0.9); }
    }
    .screen-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
      transition: filter 0.5s;
    }
    .room-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(251,191,36,0.18) 0%, rgba(12,10,9,0.6) 80%);
      pointer-events: none;
    }
    .bulb-fixture {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 3;
    }
    .bulb-cord { width: 2px; height: 30px; background: #57534e; }
    .bulb-glass {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fef08a;
      box-shadow: 0 0 25px 12px rgba(253, 224, 71, 0.6);
      transition: all 0.3s;
    }
    .bulb-glass.off { background: #78716c; box-shadow: none; }
    .screen-corner {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 11px;
      color: #d6d3d1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      z-index: 3;
    }
    .zhixia-char-wrap {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 2;
      transition: bottom 0.6s ease;
    }
    .zhixia-char-wrap.低落 { bottom: 30px; }
    .zhixia-char-wrap.低落 .char-sprite-box { filter: brightness(0.78) saturate(0.8); }
    .zhixia-char-wrap.高兴 { bottom: 6px; }
    .speech-bubble {
      background: rgba(255, 251, 235, 0.95);
      color: #292524;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 260px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      position: relative;
      border: 1.5px solid #b45309;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: #fffbeb;
      border-right: 1.5px solid #b45309;
      border-bottom: 1.5px solid #b45309;
    }
    .char-sprite-box {
      width: 140px;
      height: 190px;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid #b45309;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      position: relative;
      background: #1c1917;
      transition: transform 0.2s;
    }
    .char-sprite-box:active { transform: scale(0.96); }
    .char-sprite-box img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .char-sprite-box .no-art {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #78716c;
      text-align: center;
      line-height: 1.6;
      padding: 10px;
    }
    .sickness-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      animation: pulse 1.5s infinite;
      z-index: 4;
    }
    .link-error {
      display: none;
      margin: 10px 14px 0;
      padding: 9px 11px;
      border-left: 3px solid #dc2626;
      background: #1c1917;
      font-size: 11.5px;
      line-height: 1.6;
      color: #fca5a5;
    }
    .link-error.show { display: block; }
    .vitals-bar {
      display: flex;
      justify-content: space-around;
      background: #1c1917;
      padding: 8px 10px;
      border-top: 1px solid #44403c;
      border-bottom: 1px solid #44403c;
    }
    .vital-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .vital-label { font-size: 11px; color: #a8a29e; }
    .vital-label b { color: #f5f5f4; font-variant-numeric: tabular-nums; }
    .progress-track {
      width: 65px;
      height: 8px;
      background: #292524;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #57534e;
    }
    .progress-fill { height: 100%; transition: width 0.4s ease; }
    .fill-hunger { background: #f59e0b; }
    .fill-mood { background: #eab308; }
    .fill-health { background: #10b981; }
    .fill-energy { background: #3b82f6; }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      background: #1c1917;
      /* 五个按钮摆在四列里，第二行只剩一格时让它自己不撑宽 */
      align-content: start;
    }
    .act-btn {
      background: #292524;
      border: 1.5px solid #57534e;
      color: #e7e5e4;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .act-btn:active { transform: translateY(2px); background: #44403c; }
    .act-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .act-btn span.icon {
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      border-radius: 8px;
      background: #1c1917;
      font-size: 13px;
      color: #fbbf24;
    }
    .act-btn.primary { background: #78350f; border-color: #d97706; color: #fef3c7; }
    .act-btn.primary span.icon { background: #4a1d06; color: #fde68a; }
    .act-btn.green { background: #064e3b; border-color: #059669; color: #d1fae5; }
    .act-btn.green span.icon { background: #032b21; color: #6ee7b7; }
    .act-btn.blue { background: #1e3a8a; border-color: #3b82f6; color: #dbeafe; }
    .act-btn.blue span.icon { background: #14275c; color: #93c5fd; }
    .sub-dialog {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(12,10,9,0.94);
      backdrop-filter: blur(4px);
      z-index: 50;
      flex-direction: column;
      padding: 16px;
    }
    .sub-dialog.active { display: flex; }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #44403c;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .dialog-title { font-size: 15px; font-weight: bold; color: #fef3c7; }
    .close-btn {
      background: #44403c;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .dialog-body { flex: 1; overflow-y: auto; }
    .item-card {
      background: #292524;
      border: 1px solid #57534e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .item-info h4 { font-size: 13px; color: #f5f5f4; margin-bottom: 3px; }
    .item-info p { font-size: 11px; color: #a8a29e; }
    .item-act-btn {
      background: #d97706;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .item-act-btn:disabled { background: #57534e; color: #a8a29e; cursor: not-allowed; }
    .dialog-note {
      font-size: 11px;
      color: #a8a29e;
      line-height: 1.6;
      padding: 4px 2px 10px;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<div class="panel-container">
  <div class="top-bar">
    <div class="date-badge">
      <span class="seal">剧本</span>
      <span id="txt-date">1年 9月1日 · 傍晚</span>
    </div>
    <span class="clock-badge" id="txt-clock"></span>
    <div class="money-badge">
      <span>￥</span>
      <span id="txt-money">320</span>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="pet-screen">
    <!-- 背景图：由角色卡里的「面板补图」脚本换成仓库地址；也可在这里直接填一个网络地址 -->
    <img src="zhixia_rental_room.jpg" class="screen-bg" id="room-bg" alt="老屋">
    <div class="room-tint" id="room-tint"></div>

    <div class="bulb-fixture" onclick="toggleLight()" title="拉一下灯绳">
      <div class="bulb-cord"></div>
      <div class="bulb-glass" id="bulb-lamp"></div>
    </div>

    <div class="screen-corner" id="txt-scene">她在家等你</div>

    <div class="zhixia-char-wrap" id="char-wrap" onclick="petZhixia()" title="摸摸她的头">
      <div class="pet-heart" id="pet-heart">♥</div>
      <div class="speech-bubble" id="speech-bubble">“哥哥！你回来啦……”</div>
      <div class="char-sprite-box">
        <img src="zhixia_character_art.jpg" alt="知夏" id="char-art">
        <div class="no-art" id="no-art" style="display:none">立绘还没放进来。<br>把图放进仓库的这个目录即可。</div>
        <div class="sickness-tag" id="sickness-tag" style="display:none;">发烧中</div>
      </div>
    </div>
  </div>

  <div class="link-error" id="link-error"></div>

  <div class="vitals-bar">
    <div class="vital-item">
      <span class="vital-label">知夏饱食 <b id="val-hunger">70</b></span>
      <div class="progress-track"><div class="progress-fill fill-hunger" id="bar-hunger" style="width: 70%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">知夏心情 <b id="val-mood">60</b></span>
      <div class="progress-track"><div class="progress-fill fill-mood" id="bar-mood" style="width: 60%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">知夏健康 <b id="val-health">90</b></span>
      <div class="progress-track"><div class="progress-fill fill-health" id="bar-health" style="width: 90%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">哥哥体力 <b id="val-energy">80</b></span>
      <div class="progress-track"><div class="progress-fill fill-energy" id="bar-energy" style="width: 80%;"></div></div>
    </div>
  </div>

  <div class="action-grid">
    <button class="act-btn primary" onclick="openDialog('feed')">
      <span class="icon">碗</span>
      <span>喂食</span>
    </button>
    <button class="act-btn primary" onclick="openDialog('care')">
      <span class="icon">药</span>
      <span>照料</span>
    </button>
    <button class="act-btn" onclick="openDialog('work')">
      <span class="icon">工</span>
      <span>出工</span>
    </button>
    <button class="act-btn" onclick="openDialog('shop')">
      <span class="icon">市</span>
      <span>买点东西</span>
    </button>
    <button class="act-btn green" onclick="歇一会儿()">
      <span class="icon">歇</span>
      <span>歇口气</span>
    </button>
  </div>

  <!-- 喂食弹窗 -->
  <div class="sub-dialog" id="dlg-feed">
    <div class="dialog-header">
      <span class="dialog-title">老屋开饭 · 喂食知夏</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="feed-list"></div>
  </div>

  <!-- 照料弹窗 -->
  <div class="sub-dialog" id="dlg-care">
    <div class="dialog-header">
      <span class="dialog-title">照料医治 · 温水与药</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="care-list"></div>
  </div>

  <!-- 出工弹窗 -->
  <div class="sub-dialog" id="dlg-work">
    <div class="dialog-header">
      <span class="dialog-title">外出打工 · 今日的活</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="work-list"></div>
  </div>

  <!-- 买东西弹窗 -->
  <div class="sub-dialog" id="dlg-shop">
    <div class="dialog-header">
      <span class="dialog-title">王婶小卖部与菜市</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="shop-list"></div>
  </div>

  <!-- 一天的活干完了，坐下来歇口气。回一点体力，半小时一次，不能一直歇。 -->
</div>

<script>
  /* ── 数据层：全部读写角色卡的变量 ─────────────────────────
   *
   * 面板在酒馆的楼层 iframe 里跑，可以直接调酒馆助手的变量接口。
   * 变量住在楼层变量的 stat_data 里（MVU 的用法），和挂机结算脚本、正文的更新规则共用同一份。
   *
   * 读：getVariables({type:'message', message_id: getCurrentMessageId()})
   * 写：updateVariablesWith(表 => { 表.stat_data = 数据; return 表 }, 同一选项)
   */

  const 变量选项 = { type: 'message', message_id: (typeof getCurrentMessageId === 'function' ? getCurrentMessageId() : -1) };

  /** 和脚本、Schema 保持一致的常量。改这里就要改 schema.ts。 */
  const 起始年龄 = 8;
  const 一年天数 = 365;
  const 时段表 = ['清晨', '上午', '下午', '傍晚', '夜里', '深夜'];

  /**
   * 一天的互动总量。像桌面养成那样：次数很少，用完就得等真实时间过去。
   * 这些数就是「限制状态栏的游玩」的地方，比发不发消息有用。
   */
  const 上限 = {
    喂: 4,      // 一天里能喂几回
    药: 3,      // 一天里能用几回药与照顾
    买: 3,      // 一天里能去小卖部几趟
  };

  /** 摸头没有冷却。限制加在心情上，见下面的 摸头日上限。 */

  /** 商品表。和 面板数据.ts 里的那几张表是同一批货，价钱与效果照抄。 */
  const 食物 = [
    { 名: '热汤挂面', 价: 3, 饥饿: 25, 心情: 6 },
    { 名: '剩菜热饭', 价: 0, 饥饿: 20, 心情: 4 },
    { 名: '大白兔奶糖', 价: 1, 饥饿: 5, 心情: 12 },
  ];
  const 药品 = [
    { 名: '温开水', 价: 0, 健康: 5, 心情: 3 },
    { 名: '湿毛巾', 价: 0, 健康: 8, 治: '发烧' },
    { 名: '退烧片', 价: 4, 健康: 30, 治: '发烧' },
  ];
  const 市集 = [
    { 名: '热汤挂面', 价: 3 },
    { 名: '大白兔奶糖', 价: 1 },
    { 名: '退烧片', 价: 4 },
  ];

  /** 家里有的、这两张表里也认得的货。 */
  function 家里的(表) {
    const 数据 = 存档();
    return 表.filter(货 => Number(数据.物品?.[货.名]?.数量 ?? 0) > 0);
  }

  let 面板数据 = null;

  function 存档() {
    return 面板数据 ?? { 时间: {}, 钱: 0, 哥哥: {}, 妹妹: {}, 今日: {}, 物品: {}, 衣柜: {} };
  }

  function 读变量() {
    try {
      const 表 = getVariables(变量选项);
      const 数据 = 表?.stat_data;
      if (数据 && typeof 数据 === 'object') {
        面板数据 = 数据;
        藏起报错();
        return 数据;
      }
      显示报错('读到的变量是空的。这个面板要放在角色卡的楼层里，由酒馆提供变量接口才能用。');
    } catch (错误) {
      显示报错('读不到酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
    return 存档();
  }

  function 写变量() {
    if (!面板数据) return;
    try {
      updateVariablesWith(表 => {
        表.stat_data = 面板数据;
        return 表;
      }, 变量选项);
    } catch (错误) {
      显示报错('写不回酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
  }

  function 显示报错(话) {
    const 框 = document.getElementById('link-error');
    框.textContent = 话;
    框.classList.add('show');
  }

  function 藏起报错() {
    document.getElementById('link-error').classList.remove('show');
  }

  function 提示(话, 毫秒) {
    const 框 = document.getElementById('notice');
    框.textContent = 话;
    框.classList.add('show');
    window.clearTimeout(提示.计时);
    提示.计时 = window.setTimeout(() => 框.classList.remove('show'), 毫秒 || 4200);
  }

  /* ── 面板上的动作 ─────────────────────────
   *
   * 桌面养成游戏的做法：点一下，她当场有反应，事情就算做完了。
   * 这里不往聊天里写消息，也不触发生成。正文仍旧由玩家自己说话推进。
   *
   * 限制靠三样，不靠「发不发消息」：
   * 1. 东西：喂她要有饭，用药要有药，买要花钱。柜子空了就得先出工。
   * 2. 次数：一天能喂几回、能用几回药、能去几趟小卖部，用完就得等真实时间过一天。
   * 3. 冷却：摸头两分钟一次。
   */

  /* ── 工具 ───────────────────────────────── */

  function 钳(值) {
    return Math.max(0, Math.min(100, Math.round(Number(值) || 0)));
  }

  function 今天记号() {
    const 时 = 存档().时间 ?? {};
    return (时.年 ?? 1) + '-' + (时.月 ?? 3) + '-' + (时.日 ?? 1);
  }

  /** 今天各自的余量。额度只在真实时间跨过一天之后回满。 */
  function 今日额度() {
    const 今 = 存档().今日 ?? {};
    const 换天 = String(今.日期 ?? '') !== 今天记号();
    const 用过 = 项 => (换天 ? 0 : Number(今[项] ?? 0));
    return {
      喂: Math.max(0, 上限.喂 - 用过('喂过')),
      药: Math.max(0, 上限.药 - 用过('药过')),
      买: Math.max(0, 上限.买 - 用过('买过')),
      出工: Math.max(0, 1 - 用过('出过工')),
    };
  }

  function 记今天的账(项) {
    const 数据 = 存档();
    if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
    if (String(数据.今日.日期 ?? '') !== 今天记号()) {
      数据.今日.日期 = 今天记号();
      数据.今日.喂过 = 0;
      数据.今日.药过 = 0;
      数据.今日.买过 = 0;
      数据.今日.出过工 = 0;
    }
    数据.今日[项] = Number(数据.今日[项] ?? 0) + 1;
  }

  function 扣一个(名) {
    const 数据 = 存档();
    const 条 = 数据.物品?.[名];
    if (!条) return;
    条.数量 = Number(条.数量) - 1;
    if (条.数量 <= 0) delete 数据.物品[名];
  }

  /* 面板不碰日历。年、月、日、季节、总天数、她的年龄都只由脚本按真实时间推。 */

  /* ── 渲染 ───────────────────────────────── */

  let 灯亮着 = true;

  function updateUI() {
    const 数据 = 读变量();
    const 时 = 数据.时间 ?? {};
    const 妹 = 数据.妹妹 ?? {};
    const 哥 = 数据.哥哥 ?? {};

    document.getElementById('txt-date').innerText =
      (时.年 ?? 1) + '年 ' + (时.月 ?? 3) + '月' + (时.日 ?? 1) + '日 · ' + (时.时段 ?? '傍晚') + ' · ' + (时.季节 ?? '春');
    document.getElementById('txt-money').innerText = 数据.钱 ?? 0;
    document.getElementById('val-hunger').innerText = 妹.饥饿 ?? 0;
    document.getElementById('bar-hunger').style.width = (妹.饥饿 ?? 0) + '%';
    document.getElementById('val-mood').innerText = 妹.心情 ?? 0;
    document.getElementById('bar-mood').style.width = (妹.心情 ?? 0) + '%';
    document.getElementById('val-health').innerText = 妹.健康 ?? 0;
    document.getElementById('bar-health').style.width = (妹.健康 ?? 0) + '%';
    document.getElementById('val-energy').innerText = 哥.体力 ?? 0;
    document.getElementById('bar-energy').style.width = (哥.体力 ?? 0) + '%';

    const 病 = String(妹.病症 ?? '无');
    const 标签 = document.getElementById('sickness-tag');
    标签.style.display = 病 !== '无' ? 'block' : 'none';
    标签.innerText = 病 + '中';

    // 她站的位置与灯下的脸色随心情变。这是「活着」的那点意思。
    const 心情 = Number(妹.心情 ?? 60);
    const 身 = document.getElementById('char-wrap');
    if (身) {
      身.classList.toggle('低落', 心情 < 35 || 病 !== '无');
      身.classList.toggle('高兴', 心情 >= 75 && 病 === '无');
    }

    // 角落那行字报的是今天还剩多少次，玩家扫一眼就知道还能做什么。
    const 额度 = 今日额度();
    document.getElementById('txt-scene').innerText =
      '今天还剩：喂 ' + 额度.喂 + ' · 照顾 ' + 额度.药 + ' · 出门 ' + 额度.买 +
      (额度.出工 > 0 ? ' · 出工 ' + 额度.出工 : ' · 今天已出工');

    const 面 = document.getElementById('char-art');
    if (面 && 面.complete && 面.naturalWidth === 0) {
      document.getElementById('no-art').style.display = 'flex';
    }
  }

  function 现实时钟() {
    const 现在 = new Date();
    const 时 = String(现在.getHours()).padStart(2, '0');
    const 分 = String(现在.getMinutes()).padStart(2, '0');
    document.getElementById('txt-clock').innerText = 时 + ':' + 分;

  /** 摸她的时候她说的话。都是八岁这一年的口气：有话直说，会问哥哥吃没吃、冷不冷。 */

    ],

  function 抽(表) {
    return 表[Math.floor(Math.random() * 表.length)];
  }

  /** 她攒下的话。挑走一句就删掉，所以她攒过的话一辈子只说一次。 */
  function 挑一句待说话() {
    const 数据 = 读变量();
    const 存着 = 数据.妹妹?.待说话;
    if (!存着 || typeof 存着 !== 'object') return null;
    const 键们 = Object.keys(存着).filter(键 => String(存着[键] ?? '').trim());
    if (!键们.length) return null;

    const 键 = 抽(键们);
    const 话 = String(存着[键]).trim();
    delete 存着[键];
    写变量();
    return 话;
  }

  /** 把攒着的话说出来。她讲完就把这一句从变量里删掉。 */
  function 讲攒下的话() {
    const 话 = 挑一句待说话();
    if (!话) return false;
    document.getElementById('speech-bubble').innerText = 话;
    return true;
  }

  /** 按她的状态挑一句。病着她会瞒，饿着她会让你先吃，这是这个人的做法。 */
  function 此刻的话() {
    const 妹 = 存档().妹妹 ?? {};
    const 饿 = Number(妹.饥饿 ?? 70);
    const 心情 = Number(妹.心情 ?? 60);
    const 病 = String(妹.病症 ?? '无');
    if (病 !== '无') return 抽(状态的话.病);
    if (饿 < 25) return 抽(状态的话.饿);
    if (心情 < 35) return 抽(状态的话.低落);
    if (心情 >= 75) return 抽(状态的话.高兴);
    return 抽(状态的话.平常);
  }

  /** 摸头没有冷却，随便摸。
   *  限制加在「心情」上：摸她一天最多把心情顶上去 12 点，摸够了照样有反应，只是不再涨。 */
  const 摸头日上限 = 12;
  const 摸头每次 = 2;

  function 今天摸头加了() {
    const 今 = 存档().今日 ?? {};
    if (String(今.日期 ?? '') !== 今天记号()) return 0;
    return Number(今.摸头加过 ?? 0);
  }

  function petZhixia() {
    const 数据 = 读变量();
    const 剩下 = Math.max(0, 摸头日上限 - 今天摸头加了());
    const 加 = Math.min(摸头每次, 剩下);

    if (加 > 0) {
      数据.妹妹.心情 = 钳((数据.妹妹.心情 ?? 60) + 加);
      if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
      if (String(数据.今日.日期 ?? '') !== 今天记号()) 数据.今日.日期 = 今天记号();
      数据.今日.摸头加过 = 今天摸头加了() + 加;
      写变量();
    }

    const 心 = document.getElementById('pet-heart');
    心.classList.remove('跳');
    void 心.offsetWidth;
    心.classList.add('跳');

    // 摸够了也照样有反应，只是话不一样。
    // 气泡里只放她的话，前面不写旁白（例如「她有点不好意思了：」这种一律不加）。
    document.getElementById('speech-bubble').innerText = 加 > 0 ? 抽(摸头的话) : 抽(摸够了的话);
    updateUI();
  }

  /** 歇口气：回一点体力。半小时一次，不能一直歇。 */
  let 上次歇 = 0;
  function 歇一会儿() {
    const 现在 = Date.now();
    const 间隔 = 30 * 60 * 1000;
    if (现在 - 上次歇 < 间隔) {
      const 余 = Math.ceil((间隔 - (现在 - 上次歇)) / 60000);
      提示('刚歇过。' + 余 + ' 分钟后再歇。', 3000);
      return;
    }
    上次歇 = 现在;
    const 数据 = 读变量();
    const 前 = Number(数据.哥哥.体力 ?? 0);
    数据.哥哥.体力 = 钳(前 + 12);
    写变量();
    document.getElementById('speech-bubble').innerText = 此刻的话();
    提示('歇了一会儿，体力 +' + (数据.哥哥.体力 - 前) + '。');
    updateUI();
  }

  function openDialog(type) {
    closeDialog();
    const 框 = document.getElementById('dlg-' + type);
    if (!框) return;
    if (type === 'feed') renderFeed();
    if (type === 'care') renderCare();
    if (type === 'work') renderWork();
    if (type === 'shop') renderShop();
    框.classList.add('active');
  }

  function closeDialog() {
    document.querySelectorAll('.sub-dialog').forEach(框 => 框.classList.remove('active'));

  function 空列表(容器, 话) {
    容器.innerHTML = '<p class="dialog-note">' + 话 + '</p>';
  }

  function renderFeed() {
    const 容器 = document.getElementById('feed-list');
    const 有 = 家里的(食物);
    if (!有.length) {
      空列表(容器, '家里没有现成能吃的东西。去「买点东西」买一份，或者自己下厨做一顿。');
      return;
    }
    容器.innerHTML = '';
    有.forEach(货 => {
      const 数 = Number(存档().物品[货.名].数量);

      行.className = 'item-card';
      行.innerHTML =
        '<div class="item-info"><h4>' + 货.名 + '（剩 ' + 数 + ' 份）</h4>' +
        '<p>饱食 +' + 货.饥饿 + '，心情 +' + 货.心情 + '</p></div>' +

      容器.appendChild(行);
    });

  function feed(名) {
    const 数据 = 读变量();
    if (Number(数据.物品?.[名]?.数量 ?? 0) <= 0) return;
    const 货 = 食物.find(x => x.名 === 名);
    if (!货) return;
    if (今日额度().喂 <= 0) {
      提示('今天已经喂过 ' + 上限.喂 + ' 回了。她肚子饱着，等明天再说。', 3600);
      return;
    }
    扣一个(名);
    数据.妹妹.饥饿 = 钳((数据.妹妹.饥饿 ?? 70) + 货.饥饿);
    数据.妹妹.心情 = 钳((数据.妹妹.心情 ?? 60) + 货.心情);
    记今天的账('喂过');
    写变量();
    document.getElementById('speech-bubble').innerText = '“哥哥，真好吃，你也吃一点！”';
    提示('喂了她' + 名 + '，饱食 +' + 货.饥饿 + '。今天还能喂 ' + 今日额度().喂 + ' 回。');
    updateUI();
    renderFeed();
  }

  function renderCare() {
    const 容器 = document.getElementById('care-list');

  function care(名) {

    数据.妹妹.健康 = 钳((数据.妹妹.健康 ?? 90) + 货.健康);

    写变量();
    document.getElementById('speech-bubble').innerText =

      行.innerHTML =
        '<div class="item-info"><h4>' + w.名 + '</h4><p>单价 ￥' + w.价 + '</p></div>' +
        '<button class="item-act-btn" ' + (够 ? '' : 'disabled') + ' onclick="buy(\'' + w.名 + '\', ' + w.价 + ')">买一份</button>';
      容器.appendChild(行);
    });
  }

  function buy(名, 价) {
    const 数据 = 读变量();
    if (Number(数据.钱 ?? 0) < 价) return;
    if (今日额度().买 <= 0) {
      提示('今天已经去过 ' + 上限.买 + ' 趟小卖部了。王婶也该关门了。', 3600);
      return;
    }
    数据.钱 = Number(数据.钱) - 价;
    if (!数据.物品[名]) 数据.物品[名] = { 数量: 0, 类别: '食物' };
    数据.物品[名].数量 = Number(数据.物品[名].数量) + 1;
    记今天的账('买过');
    写变量();
    提示('买了' + 名 + '，花了 ' + 价 + ' 元。今天还能去 ' + 今日额度().买 + ' 趟。');
    updateUI();
    renderShop();
  }

  /* 陪她这件事没有按钮。想陪她就自己在正文里说话、做事。
     面板只做喂她、给她用药、买东西、出工这几件「动手」的事。 */

  /* ── 起手 ───────────────────────────────── */

  function 起手() {
    updateUI();
    现实时钟();
    window.setInterval(现实时钟, 20000);
    // 变量可能被正文那头的 AI 改，也可能被挂机脚本改，所以定期重读一次
    window.setInterval(updateUI, 3000);
    const 面 = document.getElementById('char-art');
    if (面) 面.addEventListener('error', () => {
      document.getElementById('no-art').style.display = 'flex';
    });

    // 一打开就先让她把攒着的话讲出来。这句是正文那头 AI 在她独处时记下的，
    // 挑走一句就删掉，所以攒过的话只会说一次。
    let 正在讲攒的话 = 讲攒下的话();

    // 她隔一会儿自己说一句，按当前状态挑。桌面养成里那种「她在过日子」的感觉靠这个。
    let 上次说话 = Date.now();
    window.setInterval(() => {
      if (Date.now() - 上次说话 < 25000) return;
      上次说话 = Date.now();
      // 攒着的话刚讲完那一会儿不顶掉它，让它多留一轮
      if (正在讲攒的话) {
        正在讲攒的话 = false;
        return;
      }
      document.getElementById('speech-bubble').innerText = 此刻的话();
    }, 25000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', 起手);
  else 起手();
</script>
</body>
</html>
