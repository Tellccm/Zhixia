<!DOCTYPE html>
<!--
  知夏 · 电子宠物面板（作者版 · 已接酒馆变量）
  放进公开仓库由 jsDelivr 提供，角色卡的正则把 [养成面板] 换成加载这个页面的语句。

  数据来源：本面板不再自己存档。所有数字都读写角色卡的变量（MVU 的 stat_data），
  和挂机结算脚本、正文里的变量更新规则共用同一份。所以在这个面板上喂她一口饭，
  正文下一轮就会知道；正文说她饿了，这个面板也会跟着变。

  改动记录（相对作者初版）：
  - 去掉 localStorage 存档，改成读写 stat_data
  - 六个 emoji 图标换成汉字，四列布局补成七格
  - 状态条沿用原配色，数值取自变量
  - 出工不再自己发钱：玩小游戏在另一块面板的「挣」页，这里是今日出工状态
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>知夏 · 电子宠物养成面板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    /* html 给高度，body 的百分比才有着落；但面板本身是固定尺寸，不跟着视口长。 */
    html {
      height: 100%;
    }
    body {
      background: #1c1917;
      color: #f5f5f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100%;
      padding: 10px;
    }
    .panel-container {
      width: 100%;
      max-width: 480px;
      background: #292524;
      border: 3px solid #78350f;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(180,83,9,0.2);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .top-bar {
      background: linear-gradient(180deg, #1c1917 0%, #292524 100%);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #44403c;
      gap: 8px;
    }
    .date-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1c1917;
      border: 1px solid #78350f;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #fef3c7;
      white-space: nowrap;
    }
    .date-badge .seal {
      font-size: 10px;
      color: #b45309;
      letter-spacing: 0.1em;
    }
    .clock-badge {
      font-size: 11px;
      color: #a8a29e;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .money-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #451a03;
      border: 1px solid #b45309;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #fde68a;
      font-family: monospace;
    }
    .notice {
      display: none;
      padding: 7px 14px;
      background: #0c0a09;
      border-bottom: 1px solid #44403c;
      font-size: 11.5px;
      line-height: 1.5;
      color: #fcd34d;
    }
    .notice.show { display: block; }
    /* 宠物屏是一块固定尺寸的屏幕，不是能无限拉长的容器。
       之前试过按视口算高度（calc(100vh - 250px)），在长窗口里被拉得极长，所以退回固定值。
       屏幕 400 ＋ 顶栏与状态条 90 ＋ 按钮区 140，整体约 640，正好放进楼层。 */
    .pet-screen {
      position: relative;
      height: 400px;
      flex: 0 0 auto;
      background: #0c0a09;
      overflow: hidden;
      cursor: pointer;
    }
    /* 她站的位置随心情挪：心情好往前站，不好就往墙边缩。位置规则也写在下面的 .zhixia-char-wrap 里。 */
    .pet-heart {
      position: absolute;
      top: -18px;
      left: 50%;
      font-size: 16px;
      color: #f472b6;
      opacity: 0;
      pointer-events: none;
    }
    .pet-heart.跳 { animation: 浮起 1.1s ease-out; }
    @keyframes 浮起 {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.7); }
      30% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -26px) scale(0.9); }
    }
    .screen-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.95;
      transition: filter 0.5s;
    }
    .room-tint {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 20%, rgba(251,191,36,0.18) 0%, rgba(12,10,9,0.6) 80%);
      pointer-events: none;
    }
    .bulb-fixture {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 3;
    }
    .bulb-cord { width: 2px; height: 30px; background: #57534e; }
    .bulb-glass {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fef08a;
      box-shadow: 0 0 25px 12px rgba(253, 224, 71, 0.6);
      transition: all 0.3s;
    }
    .bulb-glass.off { background: #78716c; box-shadow: none; }
    .screen-corner {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 11px;
      color: #d6d3d1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      z-index: 3;
    }
    .zhixia-char-wrap {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      z-index: 2;
      transition: bottom 0.6s ease;
    }
    .zhixia-char-wrap.低落 { bottom: 30px; }
    .zhixia-char-wrap.低落 .char-sprite-box { filter: brightness(0.78) saturate(0.8); }
    .zhixia-char-wrap.高兴 { bottom: 6px; }
    .speech-bubble {
      background: rgba(255, 251, 235, 0.95);
      color: #292524;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.4;
      max-width: 260px;
      margin-bottom: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      position: relative;
      border: 1.5px solid #b45309;
    }
    .speech-bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 10px;
      height: 10px;
      background: #fffbeb;
      border-right: 1.5px solid #b45309;
      border-bottom: 1.5px solid #b45309;
    }
    /* 立绘框只负责占位与点击，不出画框：图是透明背景的立绘，直接贴在屋子的背景上。
       不再有边框、圆角、底色和投影，否则会像贴了一张相片。 */
    .char-sprite-box {
      width: 210px;
      height: 300px;
      position: relative;
      background: none;
      border: none;
      transition: transform 0.2s;
    }
    .char-sprite-box:active { transform: scale(0.97); }
    .char-sprite-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
    }
    /* 立绘还没放进来时给一块淡虚线的位置提示，图一到位就没了。 */
    .char-sprite-box .no-art {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #57534e;
      text-align: center;
      line-height: 1.6;
      padding: 10px;
      border: 1px dashed #44403c;
      border-radius: 10px;
    }
    .sickness-tag {
      position: absolute;
      top: 34px;
      right: 10px;
      background: #dc2626;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 10px;
      animation: pulse 1.5s infinite;
      z-index: 4;
    }
    .link-error {
      display: none;
      margin: 10px 14px 0;
      padding: 9px 11px;
      border-left: 3px solid #dc2626;
      background: #1c1917;
      font-size: 11.5px;
      line-height: 1.6;
      color: #fca5a5;
    }
    .link-error.show { display: block; }
    .vitals-bar {
      display: flex;
      justify-content: space-around;
      background: #1c1917;
      padding: 8px 10px;
      border-top: 1px solid #44403c;
      border-bottom: 1px solid #44403c;
    }
    .vital-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .vital-label { font-size: 11px; color: #a8a29e; }
    .vital-label b { color: #f5f5f4; font-variant-numeric: tabular-nums; }
    .progress-track {
      width: 65px;
      height: 8px;
      background: #292524;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #57534e;
    }
    .progress-fill { height: 100%; transition: width 0.4s ease; }
    .fill-hunger { background: #f59e0b; }
    .fill-mood { background: #eab308; }
    .fill-health { background: #10b981; }
    .fill-energy { background: #3b82f6; }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px;
      background: #1c1917;
      /* 五个按钮摆在四列里，第二行只剩一格时让它自己不撑宽 */
      align-content: start;
    }
    .act-btn {
      background: #292524;
      border: 1.5px solid #57534e;
      color: #e7e5e4;
      padding: 8px 4px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .act-btn:active { transform: translateY(2px); background: #44403c; }
    .act-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .act-btn span.icon {
      width: 26px;
      height: 26px;
      line-height: 26px;
      text-align: center;
      border-radius: 8px;
      background: #1c1917;
      font-size: 13px;
      color: #fbbf24;
    }
    .act-btn.primary { background: #78350f; border-color: #d97706; color: #fef3c7; }
    .act-btn.primary span.icon { background: #4a1d06; color: #fde68a; }
    .act-btn.green { background: #064e3b; border-color: #059669; color: #d1fae5; }
    .act-btn.green span.icon { background: #032b21; color: #6ee7b7; }
    .act-btn.blue { background: #1e3a8a; border-color: #3b82f6; color: #dbeafe; }
    .act-btn.blue span.icon { background: #14275c; color: #93c5fd; }
    .sub-dialog {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(12,10,9,0.94);
      backdrop-filter: blur(4px);
      z-index: 50;
      flex-direction: column;
      padding: 16px;
    }
    .sub-dialog.active { display: flex; }
    .dialog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #44403c;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .dialog-title { font-size: 15px; font-weight: bold; color: #fef3c7; }
    .close-btn {
      background: #44403c;
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }
    .dialog-body { flex: 1; overflow-y: auto; }
    .item-card {
      background: #292524;
      border: 1px solid #57534e;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .item-info h4 { font-size: 13px; color: #f5f5f4; margin-bottom: 3px; }
    .item-info p { font-size: 11px; color: #a8a29e; }
    .item-act-btn {
      background: #d97706;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .item-act-btn:disabled { background: #57534e; color: #a8a29e; cursor: not-allowed; }
    .dialog-note {
      font-size: 11px;
      color: #a8a29e;
      line-height: 1.6;
      padding: 4px 2px 10px;
    }
    /* ── 反馈层 ───────────────────────────────
       提示条按类型变色，数值改动在状态条旁边飘一下，条本身亮一下。
       点一下做完一件事，玩家要能立刻看出「哪儿变了、变了多少」。 */
    .notice.好 { color: #6ee7b7; border-bottom-color: #065f46; background: #052e21; }
    .notice.差 { color: #fca5a5; border-bottom-color: #7f1d1d; background: #2a0f0f; }
    .vitals-bar { position: relative; }
    .floater {
      position: absolute;
      font-size: 12px;
      font-weight: bold;
      pointer-events: none;
      white-space: nowrap;
      animation: 飘字 1.2s ease-out forwards;
    }
    .floater.加 { color: #6ee7b7; }
    .floater.减 { color: #fca5a5; }
    @keyframes 飘字 {
      0% { opacity: 0; transform: translateY(5px); }
      20% { opacity: 1; transform: translateY(-2px); }
      100% { opacity: 0; transform: translateY(-24px); }
    }
    .progress-fill.变 { animation: 亮一下 0.75s ease-out; }
    @keyframes 亮一下 { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
    .rest-hint { font-size: 11px; color: #a8a29e; text-align: right; padding: 3px 2px 0; min-height: 15px; }
    /* 购物车：贴在买东西弹窗底部，一直看得见。 */
    .cart-strip {
      flex: 0 0 auto;
      border-top: 1.5px solid #44403c;
      margin-top: 10px;
      padding-top: 10px;
    }
    .cart-line { font-size: 11.5px; color: #e7e5e4; line-height: 1.75; min-height: 20px; }
    .cart-line .空 { color: #78716c; }
    .cart-total { font-size: 12.5px; color: #fcd34d; font-weight: bold; margin: 5px 0 8px; }
    .cart-total .差 { color: #fca5a5; font-weight: normal; }
    .cart-btns { display: flex; gap: 8px; }
    .cart-btns button { flex: 1; }
    .cart-btn {
      background: #d97706;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      font-family: inherit;
    }
    .cart-btn.plain { background: #44403c; color: #e7e5e4; font-weight: normal; }
    .cart-btn:disabled { background: #57534e; color: #a8a29e; cursor: not-allowed; }
    .item-card.在车里 { border-color: #d97706; background: #332a1f; }
    .item-card.缺货 { opacity: 0.72; border-color: #57534e; background: #231f1e; }
    .缺 { color: #fca5a5; }
    .qty { display: flex; align-items: center; gap: 5px; }
    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      border: 1px solid #57534e;
      background: #292524;
      color: #f5f5f4;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
    }
    .qty-num { min-width: 20px; text-align: center; font-size: 13px; color: #fcd34d; font-weight: bold; }
    .小计 { font-size: 11px; color: #fcd34d; }
    .receipt { font-size: 11px; color: #a8a29e; line-height: 1.7; padding: 6px 2px 0; border-top: 1px dashed #44403c; margin-top: 8px; }
    .receipt b { color: #fcd34d; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>

<div class="panel-container">
  <div class="top-bar">
    <div class="date-badge">
      <span class="seal">剧本</span>
      <span id="txt-date">1年 9月1日 · 傍晚</span>
    </div>
    <span class="clock-badge" id="txt-clock"></span>
    <div class="money-badge">
      <span>￥</span>
      <span id="txt-money">320</span>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <div class="pet-screen">
    <!-- 背景图：由角色卡里的「面板补图」脚本换成仓库地址；也可在这里直接填一个网络地址 -->
    <img src="zhixia_rental_room.jpg" class="screen-bg" id="room-bg" alt="老屋">
    <div class="room-tint" id="room-tint"></div>

    <div class="bulb-fixture" onclick="toggleLight()" title="拉一下灯绳">
      <div class="bulb-cord"></div>
      <div class="bulb-glass" id="bulb-lamp"></div>
    </div>

    <div class="screen-corner" id="txt-scene">她在家等你</div>

    <div class="zhixia-char-wrap" id="char-wrap" onclick="petZhixia()" title="摸摸她的头">
      <div class="pet-heart" id="pet-heart">♥</div>
      <div class="speech-bubble" id="speech-bubble">“哥哥！你回来啦……”</div>
      <div class="char-sprite-box">
        <img src="zhixia_character_art.png" alt="" id="char-art">
        <div class="no-art" id="no-art" style="display:none">立绘还没放进来。<br>把图放进仓库的这个目录即可。</div>
        <div class="sickness-tag" id="sickness-tag" style="display:none;">发烧中</div>
      </div>
    </div>
  </div>

  <div class="link-error" id="link-error"></div>

  <div class="vitals-bar">
    <div class="vital-item">
      <span class="vital-label">知夏饱食 <b id="val-hunger">70</b></span>
      <div class="progress-track"><div class="progress-fill fill-hunger" id="bar-hunger" style="width: 70%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">知夏心情 <b id="val-mood">60</b></span>
      <div class="progress-track"><div class="progress-fill fill-mood" id="bar-mood" style="width: 60%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">知夏健康 <b id="val-health">90</b></span>
      <div class="progress-track"><div class="progress-fill fill-health" id="bar-health" style="width: 90%;"></div></div>
    </div>
    <div class="vital-item">
      <span class="vital-label">哥哥体力 <b id="val-energy">80</b></span>
      <div class="progress-track"><div class="progress-fill fill-energy" id="bar-energy" style="width: 80%;"></div></div>
    </div>
  </div>

  <div class="action-grid">
    <button class="act-btn primary" onclick="openDialog('feed')">
      <span class="icon">碗</span>
      <span>喂食</span>
    </button>
    <button class="act-btn primary" onclick="openDialog('care')">
      <span class="icon">药</span>
      <span>照料</span>
    </button>
    <button class="act-btn" onclick="openDialog('work')">
      <span class="icon">工</span>
      <span>出工</span>
    </button>
    <button class="act-btn" onclick="openDialog('shop')">
      <span class="icon">市</span>
      <span>买点东西</span>
    </button>
    <button class="act-btn green" onclick="歇一会儿()">
      <span class="icon">歇</span>
      <span>歇口气</span>
    </button>
  </div>
  <div class="rest-hint" id="rest-hint"></div>

  <!-- 喂食弹窗 -->
  <div class="sub-dialog" id="dlg-feed">
    <div class="dialog-header">
      <span class="dialog-title">老屋开饭 · 喂食知夏</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="feed-list"></div>
  </div>

  <!-- 照料弹窗 -->
  <div class="sub-dialog" id="dlg-care">
    <div class="dialog-header">
      <span class="dialog-title">照料医治 · 温水与药</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="care-list"></div>
  </div>

  <!-- 出工弹窗 -->
  <div class="sub-dialog" id="dlg-work">
    <div class="dialog-header">
      <span class="dialog-title">外出打工 · 今日的活</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="work-list"></div>
  </div>

  <!-- 买东西弹窗：先加进车，看着合计，再一起结账。 -->
  <div class="sub-dialog" id="dlg-shop">
    <div class="dialog-header">
      <span class="dialog-title">王婶小卖部与菜市</span>
      <button class="close-btn" onclick="closeDialog()">✕</button>
    </div>
    <div class="dialog-body" id="shop-list"></div>
    <div class="cart-strip">
      <div class="cart-line" id="cart-line"></div>
      <div class="cart-total" id="cart-total"></div>
      <div class="cart-btns">
        <button class="cart-btn" id="cart-pay" onclick="结算()">结账</button>
        <button class="cart-btn plain" onclick="清空车()">清空</button>
      </div>
    </div>
  </div>

  <!-- 一天的活干完了，坐下来歇口气。回一点体力，半小时一次，不能一直歇。 -->
</div>

<script>
  /* ── 数据层：全部读写角色卡的变量 ─────────────────────────
   *
   * 面板在酒馆的楼层 iframe 里跑，可以直接调酒馆助手的变量接口。
   * 变量住在楼层变量的 stat_data 里（MVU 的用法），和挂机结算脚本、正文的更新规则共用同一份。
   *
   * 读：getVariables({type:'message', message_id: getCurrentMessageId()})
   * 写：updateVariablesWith(表 => { 表.stat_data = 数据; return 表 }, 同一选项)
   */

  const 变量选项 = { type: 'message', message_id: (typeof getCurrentMessageId === 'function' ? getCurrentMessageId() : -1) };

  /** 和脚本、Schema 保持一致的常量。改这里就要改 schema.ts。 */
  const 起始年龄 = 9;
  const 一年天数 = 360;
  const 时段表 = ['清晨', '上午', '下午', '傍晚', '夜里', '深夜'];

  /**
   * 一天的互动总量。像桌面养成那样：次数很少，用完就得等真实时间过去。
   * 这些数就是「限制状态栏的游玩」的地方，比发不发消息有用。
   */
  const 上限 = {
    喂: 4,      // 一天里能喂几回
    药: 3,      // 一天里能用几回药与照顾
    买: 3,      // 一天里能去小卖部几趟
  };

  /** 摸头没有冷却。限制加在心情上，见下面的 摸头日上限。 */

  /** 货架。和 面板数据.ts 是同一批货，价钱与效果照抄。
   *  一类货只在这里定义一次：喂食、照料、买东西三个弹窗都从这张表取，改价只改这里。
   *
   *  `存` 是王婶一轮进的量。货架上的东西都有数，卖完就得等她再上货；
   *  价钱为 0 的那几样是家里现成的（热饭、热水、毛巾），不进货也不限购。
   */
  const 货架 = [
    { 名: '热汤挂面', 价: 3, 类: '食物', 存: 4, 饥饿: 25, 心情: 6, 说明: '锅里现下的，热乎' },
    { 名: '家常热饭', 价: 0, 类: '食物', 饥饿: 20, 心情: 4, 说明: '家里的饭，留着给她' },
    { 名: '大白兔奶糖', 价: 1, 类: '食物', 存: 6, 饥饿: 5, 心情: 12, 说明: '一颗能甜半天' },
    { 名: '温开水', 价: 0, 类: '药品', 健康: 5, 心情: 3, 说明: '不花钱，她总说多喝热水就好' },
    { 名: '湿毛巾', 价: 0, 类: '药品', 健康: 8, 治: '发烧', 说明: '敷额头，家里现成的' },
    { 名: '退烧片', 价: 4, 类: '药品', 存: 2, 健康: 30, 治: '发烧', 说明: '烧到三十八度以上才吃' },
    { 名: '灯泡', 价: 10, 类: '杂项', 存: 2, 说明: '客厅那盏闪了半个月' },
    { 名: '洗衣粉', 价: 14, 类: '杂项', 存: 2, 说明: '一大袋，能用很久' },
    { 名: '橡皮筋', 价: 3, 类: '杂项', 存: 3, 说明: '柜门松了，勒一根就好' },
  ];
  const 食物 = 货架.filter(货 => 货.类 === '食物');
  const 药品 = 货架.filter(货 => 货.类 === '药品');
  const 类别顺序 = ['食物', '药品', '杂项'];
  /** 要花钱的才上货架；价钱为 0 的是家里现成的，去喂食与照料里用。 */
  const 上架的 = 货架.filter(货 => 货.价 > 0);

  /** 家里有的、这两张表里也认得的货。 */
  function 家里的(表) {
    const 数据 = 存档();
    return 表.filter(货 => Number(数据.物品?.[货.名]?.数量 ?? 0) > 0);
  }

  let 面板数据 = null;

  function 存档() {
    return 面板数据 ?? { 时间: {}, 钱: 0, 哥哥: {}, 妹妹: {}, 今日: {}, 物品: {}, 衣柜: {} };
  }

  function 读变量() {
    try {
      const 表 = getVariables(变量选项);
      const 数据 = 表?.stat_data;
      if (数据 && typeof 数据 === 'object') {
        面板数据 = 数据;
        藏起报错();
        return 数据;
      }
      显示报错('读到的变量是空的。这个面板要放在角色卡的楼层里，由酒馆提供变量接口才能用。');
    } catch (错误) {
      显示报错('读不到酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
    return 存档();
  }

  function 写变量() {
    if (!面板数据) return;
    try {
      updateVariablesWith(表 => {
        表.stat_data = 面板数据;
        return 表;
      }, 变量选项);
    } catch (错误) {
      显示报错('写不回酒馆变量：' + (错误 && 错误.message ? 错误.message : 错误));
    }
  }

  function 显示报错(话) {
    const 框 = document.getElementById('link-error');
    框.textContent = 话;
    框.classList.add('show');
  }

  function 藏起报错() {
    document.getElementById('link-error').classList.remove('show');
  }

  /* 提示分三种调子：好（做成了）、差（做不成，附原因）、常（中性回执）。 */
  function 提示(话, 毫秒, 调) {
    const 框 = document.getElementById('notice');
    框.className = 'notice' + (调 === '好' ? ' 好' : 调 === '差' ? ' 差' : '');
    框.textContent = 话;
    void 框.offsetWidth;
    框.classList.add('show');
    window.clearTimeout(提示.计时);
    提示.计时 = window.setTimeout(() => 框.classList.remove('show'), 毫秒 || 4200);
  }

  /* ── 反馈的小零件 ─────────────────────────
   *
   * 每次改动都要落成看得见的东西：数字飘一下、条亮一下、提示条报出「从多少到多少」。
   * 面板上的动作不发消息，玩家就靠这些判断自己刚才做了什么。
   */

  /** 在某个数字旁边飘一个 +N / -N。 */
  function 飘字(锚点id, 文本, 正负) {
    const 锚 = document.getElementById(锚点id);
    if (!锚 || !锚.parentElement) return;
    const 层 = 锚.parentElement;
    if (window.getComputedStyle(层).position === 'static') 层.style.position = 'relative';
    const 泡 = document.createElement('span');
    泡.className = 'floater ' + (正负 === '减' ? '减' : '加');
    泡.textContent = 文本;
    泡.style.left = 锚.offsetLeft + 锚.offsetWidth + 4 + 'px';
    泡.style.top = 锚.offsetTop - 2 + 'px';
    层.appendChild(泡);
    window.setTimeout(() => 泡.remove(), 1300);
  }

  /** 状态条亮一下，让眼睛知道是这一条动了。 */
  function 亮条(id) {
    const 条 = document.getElementById(id);
    if (!条) return;
    条.classList.remove('变');
    void 条.offsetWidth;
    条.classList.add('变');
    window.setTimeout(() => 条.classList.remove('变'), 800);
  }

  /** 把一次改动说成人话：饱食 +18（70→88）。没变就只报当前值。 */
  function 变化段(标签, 前, 后) {
    const 差 = Math.round(Number(后) - Number(前));
    if (!差) return 标签 + ' ' + 后 + '（没变）';
    return 标签 + ' ' + (差 > 0 ? '+' : '') + 差 + '（' + 前 + '→' + 后 + '）';
  }

  /** 一次动作的完整回执：改了哪几项、还剩什么额度。 */
  function 回执(段们, 尾巴) {
    const 有值的 = 段们.filter(Boolean);
    return 有值的.join('，') + (尾巴 ? '。' + 尾巴 : '');
  }

  /* ── 面板上的动作 ─────────────────────────
   *
   * 桌面养成游戏的做法：点一下，她当场有反应，事情就算做完了。
   * 这里不往聊天里写消息，也不触发生成。正文仍旧由玩家自己说话推进。
   *
   * 限制靠三样，不靠「发不发消息」：
   * 1. 东西：喂她要有饭，用药要有药，买要花钱。柜子空了就得先出工。
   * 2. 次数：一天能喂几回、能用几回药、能去几趟小卖部，用完就得等真实时间过一天。
   * 3. 冷却：摸头两分钟一次。
   */

  /* ── 工具 ───────────────────────────────── */

  function 钳(值) {
    return Math.max(0, Math.min(100, Math.round(Number(值) || 0)));
  }

  function 今天记号() {
    const 时 = 存档().时间 ?? {};
    return (时.年 ?? 1) + '-' + (时.月 ?? 3) + '-' + (时.日 ?? 1);
  }

  /** 今天各自的余量。额度只在真实时间跨过一天之后回满。 */
  function 今日额度() {
    const 今 = 存档().今日 ?? {};
    const 换天 = String(今.日期 ?? '') !== 今天记号();
    const 用过 = 项 => (换天 ? 0 : Number(今[项] ?? 0));
    return {
      喂: Math.max(0, 上限.喂 - 用过('喂过')),
      药: Math.max(0, 上限.药 - 用过('药过')),
      买: Math.max(0, 上限.买 - 用过('买过')),
      出工: Math.max(0, 1 - 用过('出过工')),
    };
  }

  function 记今天的账(项) {
    const 数据 = 存档();
    if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
    if (String(数据.今日.日期 ?? '') !== 今天记号()) {
      数据.今日.日期 = 今天记号();
      数据.今日.喂过 = 0;
      数据.今日.药过 = 0;
      数据.今日.买过 = 0;
      数据.今日.出过工 = 0;
    }
    数据.今日[项] = Number(数据.今日[项] ?? 0) + 1;
  }

  function 扣一个(名) {
    const 数据 = 存档();
    const 条 = 数据.物品?.[名];
    if (!条) return;
    条.数量 = Number(条.数量) - 1;
    if (条.数量 <= 0) delete 数据.物品[名];
  }

  /* ── 购物车 ───────────────────────────────
   *
   * 买东西不再是一键立刻成交：先加进车，看着合计与还差多少，再一起结账。
   * 车放在 localStorage 里。面板挂在楼层 iframe 上，每层楼重开一次，
   * 车里还没结的货不能因为翻页就丢。
   */

  const 车键 = 'zhixia:购物车';

  /** 纯算账：不碰界面，也不碰存档。验收脚本单独跑这个函数核数。 */
  function 算购物车(车, 钱) {
    const 列 = Array.isArray(车) ? 车 : [];
    const 合计 = 列.reduce((和, 项) => 和 + Number(项.价) * Number(项.数), 0);
    const 件数 = 列.reduce((和, 项) => 和 + Number(项.数), 0);
    const 资金 = Number(钱) || 0;
    return {
      合计: 合计,
      件数: 件数,
      付得起: 资金 >= 合计,
      还差: Math.max(0, 合计 - 资金),
      结余: 资金 - 合计,
    };
  }

  function 读车() {
    try {
      const 存 = JSON.parse(localStorage.getItem(车键) || '[]');
      return Array.isArray(存) ? 存.filter(项 => 项 && 项.名) : [];
    } catch {
      return [];
    }
  }

  function 存车(车) {
    购物车 = Array.isArray(车) ? 车 : [];
    try {
      localStorage.setItem(车键, JSON.stringify(购物车));
    } catch {
      /* 存不进去也不影响这一次结账 */
    }
  }

  let 购物车 = 读车();
  let 最近一次结账 = '';

  /* ── 存货与进货 ───────────────────────────
   *
   * 王婶的店不是无底洞：每样货一轮只进那么多，卖完就挂「卖完了」。
   * 存货存在角色卡的变量里（`_进货`），跟钱、物品一起走存档：
   * 换设备、清浏览器缓存都不会让货架凭空回满。
   *
   * 进货按真实时钟算，不看面板开没开着：
   * 每天 0 点起数，每六小时一段（0/6/12/18 点）。时段一变，货架补满。
   * 所以这里存的是「第几个时段」，不是时间戳，也就不会因为忘开面板而错位。
   */

  const 进货间隔 = 6 * 60 * 60 * 1000;

  /** 今天 0 点的毫秒数。进货时段从这一天算起。 */
  function 今天零点(现在) {
    const 日 = new Date(Number(现在) || Date.now());
    日.setHours(0, 0, 0, 0);
    return 日.getTime();
  }

  /** 纯算数：现在是第几个进货时段、下一次进货在什么时候。 */
  function 算进货时段(现在, 零点, 间隔) {
    const 时 = Number(现在) || 0;
    const 起 = Number(零点) || 0;
    const 隔 = Number(间隔) || 1;
    const 槽 = Math.max(0, Math.floor((时 - 起) / 隔));
    const 下次 = 起 + (槽 + 1) * 隔;
    return { 槽: 槽, 下次: 下次, 还有: Math.max(0, 下次 - 时) };
  }

  /** 纯算数：这一轮最多还能往车里放几件。不碰界面也不碰存档。 */
  function 算限购(上限, 库存剩, 车里已有) {
    const 顶 = Math.max(0, Math.round(Number(上限) || 0));
    const 剩 = Math.max(0, Math.min(顶, Math.round(Number(库存剩) || 0)));
    const 车 = Math.max(0, Math.round(Number(车里已有) || 0));
    return { 上限: 顶, 剩: 剩, 车里: 车, 可加: Math.max(0, 剩 - 车), 卖完: 剩 <= 0 };
  }

  /** 这一轮该有的满架。价钱为 0 的家常东西不进这个表，它们不限购。 */
  function 满架() {
    const 表 = {};
    上架的.forEach(货 => {
      表[货.名] = Number(货.存 ?? 0);
    });
    return 表;
  }

  /** 读变量里的货架。变量还没读到就先按满架算，等读到了会自己校正。 */
  function 读库存() {
    const 数据 = 读变量();
    const 存 = 数据?._进货;
    const 现在 = Date.now();
    const 此刻 = 算进货时段(现在, 今天零点(现在), 进货间隔);
    if (!存 || typeof 存 !== 'object' || !存.数 || typeof 存.数 !== 'object') {
      return { 槽: 此刻.槽, 数: 满架(), 空: true };
    }
    return { 槽: Number(存.槽 ?? -1), 数: 存.数, 空: false };
  }

  function 写库存(表) {
    const 数据 = 读变量();
    if (!数据) return;
    数据._进货 = { 槽: Number(表.槽) || 0, 数: 表.数 && typeof 表.数 === 'object' ? 表.数 : {} };
    写变量();
  }

  /** 到点了就补货。返回补过的货名清单，好让面板报一句「王婶上货了」。 */
  function 进货检查() {
    const 数据 = 读变量();
    if (!数据) return [];
    const 现在 = Date.now();
    const 此刻 = 算进货时段(现在, 今天零点(现在), 进货间隔);
    const 存 = 读库存();

    // 第一次用（或者存档里还没这个字段）：给一满架，记下是哪个时段。
    if (存.空) {
      写库存({ 槽: 此刻.槽, 数: 满架() });
      return [];
    }
    // 已经跨到下一个时段了：补满。补几样就报几样。
    if (存.槽 === 此刻.槽) return [];

    const 满 = 满架();
    const 补过 = [];
    上架的.forEach(货 => {
      if (Number(存.数[货.名] ?? 0) < Number(货.存 ?? 0)) 补过.push(货.名 + ' ' + Number(货.存 ?? 0));
    });
    写库存({ 槽: 此刻.槽, 数: 满 });
    return 补过;
  }

  /** 这样货这一轮还剩几件。不限购的给 Infinity。 */
  function 剩几件(名) {
    const 货 = 货架.find(x => x.名 === 名);
    if (!货 || Number(货.价) <= 0) return Infinity;
    const 存 = 读库存();
    return Number(存.数[名] ?? 0);
  }

  function 扣库存(名, 数) {
    const 货 = 货架.find(x => x.名 === 名);
    if (!货 || Number(货.价) <= 0) return;
    const 存 = 读库存();
    存.数[名] = Math.max(0, Number(存.数[名] ?? 0) - Number(数 || 1));
    写库存({ 槽: 存.槽, 数: 存.数 });
  }

  /** 距离下一次进货还有多久，以及那是几点。 */
  function 距离进货(现在) {
    const 时 = Number(现在) || Date.now();
    return 算进货时段(时, 今天零点(时), 进货间隔);
  }

  /** 把「下次进货」说清楚：18:00（还有 2 小时 8 分钟）。 */
  function 下次进货话(现在) {
    const 算 = 距离进货(现在);
    const 点 = new Date(算.下次);
    const 时 = String(点.getHours()).padStart(2, '0');
    const 分 = String(点.getMinutes()).padStart(2, '0');
    return 时 + ':' + 分 + '（还有 ' + 说多久(算.还有) + '）';
  }

  /** 把毫秒说成人话：5 小时 12 分钟。 */
  function 说多久(毫秒) {
    const 分 = Math.ceil(Math.max(0, 毫秒) / 60000);
    if (分 <= 0) return '不到 1 分钟';
    const 时 = Math.floor(分 / 60);
    const 余 = 分 % 60;
    return 时 ? 时 + ' 小时' + (余 ? ' ' + 余 + ' 分钟' : '') : 余 + ' 分钟';
  }

  /** 车里这个货有几件。 */
  function 车里几件(名) {
    const 有 = 读车().find(项 => 项.名 === 名);
    return 有 ? Number(有.数) : 0;
  }

  function 加车(名) {
    const 货 = 货架.find(x => x.名 === 名);
    if (!货) return;
    const 件 = 算限购(货.存 ?? 0, 剩几件(名), 车里几件(名));
    if (件.可加 <= 0) {
      if (件.卖完) {
        提示(
          '这一轮的' + 名 + '卖完了。下次进货 ' + 下次进货话() + '，先买别的。',
          5000,
          '差',
        );
      } else {
        提示('这一轮进的' + 名 + '一共就 ' + 件.上限 + ' 件，车里已经占满，先结账再来。', 4600, '差');
      }
      return;
    }

    const 车 = 读车();
    const 有 = 车.find(x => x.名 === 名);
    if (有) 有.数 = Number(有.数) + 1;
    else 车.push({ 名: 货.名, 价: 货.价, 数: 1 });
    存车(车);

    const 账 = 算购物车(车, 读变量().钱);
    const 剩 = 件.剩 - (车里几件(名));
    if (!账.付得起) {
      提示('加进车里：' + 名 + '。合计 ￥' + 账.合计 + '，手上的钱还差 ￥' + 账.还差 + '，去掉几件再结账。', 4600, '差');
    } else {
      提示(
        '加进车里：' + 名 + '。车里 ' + 账.件数 + ' 件，合计 ￥' + 账.合计 + '。' +
          '这一轮还剩 ' + Math.max(0, 剩) + ' 件。',
        3600,
        '好',
      );
    }
    renderShop();

  function 减车(名) {
    const 车 = 读车();
    const 有 = 车.find(项 => 项.名 === 名);
    if (!有) return;
    if (Number(有.数) <= 1) 车.splice(车.indexOf(有), 1);
    else 有.数 = Number(有.数) - 1;
    存车(车);
    const 账 = 算购物车(车, 存档().钱);
    提示(
      账.件数 ? '从车里拿出：' + 名 + '。还剩 ' + 账.件数 + ' 件，合计 ￥' + 账.合计 + '。' : '车空了。',

  /** 结账：一次扣钱、一次入库、记一趟出门。 */
  function 结算() {
    const 车 = 读车();
    if (!车.length) {
      提示('车里还是空的。先挑几件放进来。', 2800, '差');
      return;
    }
    if (今日额度().买 <= 0) {
      提示('今天已经去过 ' + 上限.买 + ' 趟小卖部了，王婶也要关门。明天再说。', 4200, '差');
      return;
    }
    const 数据 = 读变量();
    const 账 = 算购物车(车, 数据.钱);
    if (!账.付得起) {
      提示('钱不够：合计 ￥' + 账.合计 + '，还差 ￥' + 账.还差 + '。去掉几件，或者先去出工。', 4600, '差');
      return;
    }

    const 前钱 = Number(数据.钱 ?? 0);
    数据.钱 = 前钱 - 账.合计;
    if (!数据.物品 || typeof 数据.物品 !== 'object') 数据.物品 = {};
    const 单子 = [];
    const 剩余 = [];
    车.forEach(项 => {
      const 货 = 货架.find(x => x.名 === 项.名);
      const 数 = Number(项.数);
      if (!数据.物品[项.名]) 数据.物品[项.名] = { 数量: 0, 类别: (货 && 货.类) || '食物' };
      数据.物品[项.名].数量 = Number(数据.物品[项.名].数量) + 数;
      扣库存(项.名, 数);
      单子.push(项.名 + '×' + 数);
      if (货) 剩余.push(货.名 + ' 剩 ' + 剩几件(货.名) + '/' + (货.存 ?? 0));
    });
    记今天的账('买过');
    写变量();

    最近一次结账 = 单子.join('、') + '，一共 ￥' + 账.合计;
    存车([]);
    提示(
      '结账：' + 单子.join('、') + '。' +
        变化段('钱', 前钱, 数据.钱) +
        '。货架上现在：' + 剩余.join('　') +
        '。下次进货 ' + 下次进货话() + '。',
      7200,
      '好',
    );
    飘字('txt-money', '−￥' + 账.合计, '减');
    updateUI();
    renderShop();
  }

  function 抽(表) {
    return 表[Math.floor(Math.random() * 表.length)];
  }

  /** 她攒下的话。挑走一句就删掉，所以她攒过的话一辈子只说一次。 */
  function 挑一句待说话() {
    const 数据 = 读变量();
    const 存着 = 数据.妹妹?.待说话;
    if (!存着 || typeof 存着 !== 'object') return null;
    const 键们 = Object.keys(存着).filter(键 => String(存着[键] ?? '').trim());
    if (!键们.length) return null;

    const 键 = 抽(键们);
    const 话 = String(存着[键]).trim();
    delete 存着[键];
    写变量();
    return 话;
  }

  /** 把攒着的话说出来。她讲完就把这一句从变量里删掉。 */
  function 讲攒下的话() {
    const 话 = 挑一句待说话();
    if (!话) return false;
    document.getElementById('speech-bubble').innerText = 话;
    return true;
  }

  /** 按她的状态挑一句。病着她会瞒，饿着她会让你先吃，这是这个人的做法。 */
  function 此刻的话() {
    const 妹 = 存档().妹妹 ?? {};
    const 饿 = Number(妹.饥饿 ?? 70);
    const 心情 = Number(妹.心情 ?? 60);
    const 病 = String(妹.病症 ?? '无');
    if (病 !== '无') return 抽(状态的话.病);
    if (饿 < 25) return 抽(状态的话.饿);
    if (心情 < 35) return 抽(状态的话.低落);
    if (心情 >= 75) return 抽(状态的话.高兴);
    return 抽(状态的话.平常);
  }

  /** 摸头没有冷却，随便摸。
   *  限制加在「心情」上：摸她一天最多把心情顶上去 12 点，摸够了照样有反应，只是不再涨。 */
  const 摸头日上限 = 12;
  const 摸头每次 = 2;

  function 今天摸头加了() {
    const 今 = 存档().今日 ?? {};
    if (String(今.日期 ?? '') !== 今天记号()) return 0;
    return Number(今.摸头加过 ?? 0);
  }

  function petZhixia() {
    const 数据 = 读变量();
    const 剩下 = Math.max(0, 摸头日上限 - 今天摸头加了());
    const 加 = Math.min(摸头每次, 剩下);
    const 前心 = Number(数据.妹妹.心情 ?? 60);

    if (加 > 0) {
      数据.妹妹.心情 = 钳(前心 + 加);
      if (!数据.今日 || typeof 数据.今日 !== 'object') 数据.今日 = {};
      if (String(数据.今日.日期 ?? '') !== 今天记号()) 数据.今日.日期 = 今天记号();
      数据.今日.摸头加过 = 今天摸头加了() + 加;
      写变量();
    }

    const 心 = document.getElementById('pet-heart');
    心.classList.remove('跳');
    void 心.offsetWidth;
    心.classList.add('跳');

    // 摸够了也照样有反应，只是话不一样。
    // 气泡里只放她的话，前面不写旁白（例如「她有点不好意思了：」这种一律不加）。
    document.getElementById('speech-bubble').innerText = 加 > 0 ? 抽(摸头的话) : 抽(摸够了的话);

    if (加 > 0) {
      const 之后 = Math.max(0, 摸头日上限 - 今天摸头加了());
      提示(
        回执([变化段('心情', 前心, 数据.妹妹.心情)], '今天摸头还能加 ' + 之后 + ' 点心情'),
        4200,
        '好',
      );
      飘字('val-mood', '+' + 加, '加');
      亮条('bar-mood');
    } else {
      提示('今天摸够了（已经加了 ' + 摸头日上限 + ' 点心情），她还在陪你说话，但心情不再涨。明天再来。', 4600, '差');
    }
    updateUI();
  }

  /** 歇口气：回一点体力。半小时一次，不能一直歇。 */
  const 歇的间隔 = 30 * 60 * 1000;
  let 上次歇 = 0;

  /** 冷却还剩多少毫秒。面板重开也要接着算，所以上次歇的时刻存在 localStorage 里。 */
  function 距离能歇() {
    let 记着 = 0;
    try {
      const 存 = Number(localStorage.getItem('zhixia:上次歇') || 0);
      记着 = Number.isFinite(存) ? 存 : 0;
    } catch {
      记着 = 0;
    }
    const 上次 = Math.max(上次歇, 记着);
    return Math.max(0, 歇的间隔 - (Date.now() - 上次));
  }

  function 画歇的提示() {
    const 位 = document.getElementById('rest-hint');
    if (!位) return;
    const 余 = 距离能歇();
    if (余 <= 0) {
      位.innerHTML = '可以歇口气了（体力 +12）';
      return;
    }
    const 分 = Math.ceil(余 / 60000);
    位.innerHTML = '刚歇过，' + 分 + ' 分钟后能再歇';
  }

  function 歇一会儿() {
    const 余 = 距离能歇();
    if (余 > 0) {
      提示('刚歇过。' + Math.ceil(余 / 60000) + ' 分钟后能再歇。', 3200, '差');
      画歇的提示();
      return;
    }
    上次歇 = Date.now();
    try {
      localStorage.setItem('zhixia:上次歇', String(上次歇));
    } catch {
      /* 存不进去只影响跨楼层续算 */
    }
    const 数据 = 读变量();
    const 前 = Number(数据.哥哥.体力 ?? 0);
    数据.哥哥.体力 = 钳(前 + 12);
    写变量();
    document.getElementById('speech-bubble').innerText = 此刻的话();
    提示(
      回执([变化段('体力', 前, 数据.哥哥.体力)], '下次能歇：' + Math.round(歇的间隔 / 60000) + ' 分钟后'),
      4600,
      '好',
    );
    飘字('val-energy', 有号(数据.哥哥.体力 - 前), '加');
    亮条('bar-energy');
    updateUI();
    画歇的提示();
  }

  function feed(名) {
    const 数据 = 读变量();
    if (Number(数据.物品?.[名]?.数量 ?? 0) <= 0) return;
    const 货 = 食物.find(x => x.名 === 名);
    if (!货) return;
    if (今日额度().喂 <= 0) {
      提示('今天已经喂过 ' + 上限.喂 + ' 回了。她肚子饱着，明天再说。', 3800, '差');
      return;
    }
    const 前饥 = Number(数据.妹妹.饥饿 ?? 70);
    const 前心 = Number(数据.妹妹.心情 ?? 60);
    扣一个(名);
    数据.妹妹.饥饿 = 钳(前饥 + 货.饥饿);
    数据.妹妹.心情 = 钳(前心 + 货.心情);
    记今天的账('喂过');
    写变量();

    const 剩 = Number(数据.物品?.[名]?.数量 ?? 0);
    document.getElementById('speech-bubble').innerText = 抽(吃了的话(货));
    提示(
      回执([变化段('饱食', 前饥, 数据.妹妹.饥饿), 变化段('心情', 前心, 数据.妹妹.心情)], '柜子里还剩 ' + 名 + ' ' + 剩 + ' 份，今天还能喂 ' + 今日额度().喂 + ' 回'),

      '好',

    if (数据.妹妹.心情 !== 前心) 飘字('val-mood', 有号(数据.妹妹.心情 - 前心), 数据.妹妹.心情 >= 前心 ? '加' : '减');
    亮条('bar-hunger');
    亮条('bar-mood');
    updateUI();
    renderFeed();
  }

  /** 正数带加号，负数自带负号。 */
  function 有号(差) {
    const 数 = Math.round(Number(差) || 0);
    return 数 > 0 ? '+' + 数 : String(数);
  }

  /** 吃不同的东西，她说的话不一样。糖和饭不是一回事。 */
  function 吃了的话(货) {
    if (货.名 === '大白兔奶糖') {
      return 抽(['“哥哥也吃一颗。我留了糖纸，夹在报纸里。”', '“甜的。我含一会儿再咽。”', '“哥哥一颗，我一颗，这样就正好。”']);
    }
    if (货.名 === '热汤挂面') return 抽(['“汤是热的，哥哥也喝一口。”', '“我吹过了，不烫嘴。”', '“哥哥，真好吃，你也吃一点！”']);
    return 抽(['“哥哥，真好吃，你也吃一点！”', '“锅里还有，我盛得下。”', '“我先吃一半，剩一半给你。”']);
  }

  function renderCare() {
    const 容器 = document.getElementById('care-list');
    const 有 = 家里的(药品);
    const 额度 = 今日额度().药;
    if (!有.length) {
      空列表(容器, '家里没有能用的药。她要是病了，去「买点东西」里看看。');
      return;
    }
    const 妹 = 存档().妹妹 ?? {};
    const 病 = String(妹.病症 ?? '无');
    const 前康 = Number(妹.健康 ?? 90);
    容器.innerHTML = '';

    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    说明.innerHTML =
      '健康 <b>' + 前康 + '</b>，现在' + (病 === '无' ? '没病' : '<b>' + 病 + '</b>') +
      '。今天还能照顾 <b>' + 额度 + '</b> 回。';
    容器.appendChild(说明);

    有.forEach(货 => {
      const 数 = Number(存档().物品[货.名].数量);
      const 对症 = !货.治 || 货.治 === 病;
      const 行 = document.createElement('div');
      行.className = 'item-card';
      行.innerHTML =
        '<div class="item-info"><h4>' + 货.名 + '（剩 ' + 数 + ' 份）</h4>' +
        '<p>' + 货.说明 + '</p>' +
        '<p>健康 ' + 前康 + ' → <span class="小计">' + 钳(前康 + 货.健康) + '</span>' +
        (货.治 ? '　' + (对症 ? '对她现在的' + 病 + '管用' : '不对症，现在是' + (病 === '无' ? '没病' : 病)) : '') + '</p></div>' +
        '<button class="item-act-btn" ' + (额度 > 0 ? '' : 'disabled') + ' onclick="care(\'' + 货.名 + '\')">' +
        (额度 > 0 ? '用上' : '今天用过了') + '</button>';
      容器.appendChild(行);
    });
  }

  function care(名) {
    const 数据 = 读变量();
    if (Number(数据.物品?.[名]?.数量 ?? 0) <= 0) return;
    const 货 = 药品.find(x => x.名 === 名);
    if (!货) return;
    const 前康 = Number(数据.妹妹.健康 ?? 90);
    const 前心 = Number(数据.妹妹.心情 ?? 60);
    const 前病 = String(数据.妹妹.病症 ?? '无');
    扣一个(名);
    数据.妹妹.健康 = 钳(前康 + 货.健康);
    if (货.心情) 数据.妹妹.心情 = 钳(前心 + 货.心情);
    let 治好了 = false;
    if (货.治 && 前病 === 货.治 && 数据.妹妹.健康 >= 85) {
      数据.妹妹.病症 = '无';
      治好了 = true;
    }
    记今天的账('药过');
    写变量();

    const 剩 = Number(数据.物品?.[名]?.数量 ?? 0);
    const 现在病 = String(数据.妹妹.病症 ?? '无');
    const 不对症 = 货.治 && 前病 !== 货.治;
    document.getElementById('speech-bubble').innerText = 治好了
      ? '“好像不烫了……哥哥你摸摸看。”'
      : 不对症
        ? '“这个不用吃的吧。我留着，等真用得上再说。”'
        : '“哥哥不用替我花钱买药，知夏已经好受很多啦。”';
    提示(
      回执(
        [变化段('健康', 前康, 数据.妹妹.健康), 货.心情 ? 变化段('心情', 前心, 数据.妹妹.心情) : ''],
        (治好了 ? '她的' + 货.治 + '退了，现在没病。' : 不对症 ? '这个不对症，' + 前病 + '没动。' : '现在还是' + 现在病 + '。') +
          '还剩 ' + 名 + ' ' + 剩 + ' 份，今天还能照顾 ' + 今日额度().药 + ' 回',
      ),
      6000,
      治好了 ? '好' : 不对症 ? '差' : '常',
    );
    飘字('val-health', 有号(数据.妹妹.健康 - 前康), 数据.妹妹.健康 >= 前康 ? '加' : '减');
    亮条('bar-health');
    if (货.心情 && 数据.妹妹.心情 !== 前心) {
      飘字('val-mood', 有号(数据.妹妹.心情 - 前心), 数据.妹妹.心情 >= 前心 ? '加' : '减');
      亮条('bar-mood');
    }
    updateUI();
    renderCare();
  }

  function renderWork() {
    const 容器 = document.getElementById('work-list');
    const 数据 = 存档();
    const 额度 = 今日额度();
    const 体力 = Number(数据.哥哥?.体力 ?? 0);
    const 熟练 = 数据.进度?.熟练 ?? {};
    const 次数 = 数据.进度?.次数 ?? {};
    const 活 = [
      { 名: '城东工地 · 搬料配重', 地: '工地', 体内: 22, 薪: 90 },
      { 名: '巷口饭店 · 后厨备菜', 地: '后厨', 体内: 15, 薪: 110 },
      { 名: '南门仓库 · 分拣', 地: '仓库', 体内: 18, 薪: 100 },
      { 名: '夜市窄巷 · 送货', 地: '夜市', 体内: 25, 薪: 140 },
    ];
    容器.innerHTML = '';
    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    说明.innerHTML =
      '今天还能出工：<b>' + 额度.出工 + '</b> 次　现在体力 <b>' + 体力 + '</b><br>' +
      '出工要玩一局手上的活，那一局在另一块面板的「挣」页里。这里只报今天的状态，不重复发钱。';
    容器.appendChild(说明);

    if (额度.出工 <= 0) {
      const 完 = document.createElement('p');
      完.className = 'dialog-note';
      完.innerHTML = '今天的活已经干完了。她在家等着，去正文里陪她说两句话。';
      容器.appendChild(完);
    }

    活.forEach(j => {
      const 行 = document.createElement('div');
      行.className = 'item-card';
      const 够 = 体力 >= j.体内;
      const 做过 = Number(次数[j.地] ?? 0);
      const 熟 = Number(熟练[j.地] ?? 0);
      const 受阻 = 额度.出工 <= 0 ? '今天已经出过了' : 够 ? '' : '体力不够';
      行.innerHTML =
        '<div class="item-info"><h4>' + j.名 + '</h4>' +
        '<p>时薪 ￥' + j.薪 + '　体力 ' + 体力 + ' → <span class="小计">' + 钳(体力 - j.体内) + '</span>（-' + j.体内 + '）</p>' +
        '<p>熟练 ' + 熟 + '　做过 ' + 做过 + ' 次' + (受阻 ? '　<span class="小计">' + 受阻 + '</span>' : '') + '</p></div>' +
        '<button class="item-act-btn" disabled>' + (额度.出工 <= 0 ? '今天做过了' : 够 ? '在「挣」页开工' : '体力不够') + '</button>';
      容器.appendChild(行);
    });
  }

  function renderShop() {
    const 容器 = document.getElementById('shop-list');
    const 钱 = Number(存档().钱 ?? 0);
    const 车 = 读车();
    const 账 = 算购物车(车, 钱);
    容器.innerHTML = '';

    const 说明 = document.createElement('p');
    说明.className = 'dialog-note';
    说明.innerHTML =
      '手上的钱 <b>￥' + 钱 + '</b>。挑好的先放车里，看着合计再一起结账。' +
      '今天还能出门 <b>' + 今日额度().买 + '</b> 趟。<br>' +
      '货架上的东西都有数，卖完就得等王婶上货，下次进货：<b>' + 下次进货话() + '</b>。<br>' +
      '家里的热饭、热水、毛巾不用买，直接去「喂食」「照料」里用。';
    容器.appendChild(说明);

    类别顺序.forEach(类 => {
      const 这类的货 = 上架的.filter(货 => 货.类 === 类);
      if (!这类的货.length) return;
      const 头 = document.createElement('p');
      头.className = 'dialog-note';
      头.innerHTML = '—— ' + 类 + ' ——';
      容器.appendChild(头);

      这类的货.forEach(货 => {
        const 车里 = 车里几件(货.名);
        const 件 = 算限购(货.存 ?? 0, 剩几件(货.名), 车里);
        const 行 = document.createElement('div');
        行.className = 'item-card' + (车里 ? ' 在车里' : '') + (件.卖完 ? ' 缺货' : '');
        const 库存话 = 件.卖完
          ? '<span class="缺">卖完了，' + 下次进货话() + ' 上货</span>'
          : '这一轮剩 <span class="小计">' + 件.剩 + '/' + 件.上限 + '</span>' +
            (车里 ? '，车里 ' + 车里 + ' 件' : '') +
            (件.可加 <= 0 ? '　<span class="缺">车里已占满</span>' : '');
        行.innerHTML =
          '<div class="item-info"><h4>' + 货.名 + '　<span class="小计">￥' + 货.价 + '</span></h4>' +
          '<p>' + 效果话(货) + '</p><p>' + 库存话 + '</p></div>' +
          (件.卖完
            ? '<button class="item-act-btn" disabled>卖完了</button>'
            : 车里
              ? '<div class="qty">' +
                '<button class="qty-btn" onclick="减车(\'' + 货.名 + '\')" title="从车里拿掉一件">−</button>' +
                '<span class="qty-num">' + 车里 + '</span>' +
                '<button class="qty-btn" ' + (件.可加 > 0 ? '' : 'disabled') + ' onclick="加车(\'' + 货.名 + '\')" title="' +
                (件.可加 > 0 ? '再加一件' : '这一轮就这么多了') + '">+</button>' +
                '</div>'
              : '<button class="item-act-btn" onclick="加车(\'' + 货.名 + '\')">放进车里</button>');
        容器.appendChild(行);
      });
    });

    if (最近一次结账) {
      const 单 = document.createElement('p');
      单.className = 'receipt';
      单.innerHTML = '最近一次结账：<b>' + 最近一次结账 + '</b>';
      容器.appendChild(单);
    }

    刷新车条(账, 车);
  }

  /** 一行说清这件货是干什么用的。 */
  function 效果话(货) {
    const 段 = [];
    if (货.饥饿) 段.push('饱食 +' + 货.饥饿);
    if (货.健康) 段.push('健康 +' + 货.健康);
    if (货.心情) 段.push('心情 +' + 货.心情);
    if (货.治) 段.push('治' + 货.治);
    if (!段.length) 段.push('家里缺的小东西');
    return 段.join('，') + '。' + (货.说明 || '');
  }

  /** 底部那条购物车：清单、合计、还差多少、能不能结账。 */
  function 刷新车条(账, 车) {
    const 行 = document.getElementById('cart-line');
    const 总 = document.getElementById('cart-total');
    const 键 = document.getElementById('cart-pay');
    if (!行 || !总 || !键) return;

    if (!车.length) {
      行.innerHTML = '<span class="空">车里还是空的。挑一件放进来。</span>';
      总.innerHTML = '合计 <b>￥0</b>';
      键.disabled = true;
      键.textContent = '结账';
      return;
    }

    行.innerHTML = 车.map(项 => 项.名 + '×' + 项.数 + ' <span class="空">￥' + Number(项.价) * Number(项.数) + '</span>').join('　');
    总.innerHTML =
      '合计 <b>￥' + 账.合计 + '</b>（' + 账.件数 + ' 件）' +
      (账.付得起 ? '　结完还剩 ￥' + 账.结余 : '　<span class="差">还差 ￥' + 账.还差 + '</span>');

    const 没额度 = 今日额度().买 <= 0;
    键.disabled = !账.付得起 || 没额度;
    键.textContent = 没额度 ? '今天去过了' : 账.付得起 ? '结账 ￥' + 账.合计 : '钱还差 ￥' + 账.还差;
  }

  /* 陪她这件事没有按钮。想陪她就自己在正文里说话、做事。
     面板只做喂她、给她用药、买东西、出工这几件「动手」的事。 */

  /* ── 起手 ───────────────────────────────── */

  function 起手() {
    // 到点了先把货补齐，再画界面，免得先画出上一轮的旧存货。
    看进货(true);
    updateUI();
    现实时钟();
    画歇的提示();
    window.setInterval(() => {
      现实时钟();
      画歇的提示();
      看进货(true);
    }, 20000);
    // 变量可能被正文那头的 AI 改，也可能被挂机脚本改，所以定期重读一次
    window.setInterval(updateUI, 3000);
    const 面 = document.getElementById('char-art');
    if (面) 面.addEventListener('error', () => {
      document.getElementById('no-art').style.display = 'flex';
    });

    // 挂机结算的回执。她一个人过了多久、掉了什么，脚本已经写在 $记账.上次结算 里，
    // 面板负责把它端到眼前，并且同一条只报一次。
    const 回执话 = String(存档().$记账?.上次结算 ?? '');
    if (回执话) {
      try {
        const 上次报过 = localStorage.getItem('zhixia:上次回执') || '';
        if (上次报过 !== 回执话) {
          提示('你不在的这段时间：' + 回执话, 7000, '常');
          localStorage.setItem('zhixia:上次回执', 回执话);
        }
      } catch {
        /* 存不进去就每次都报一遍，不影响功能 */
      }
    }

    // 一打开就先让她把攒着的话讲出来。这句是正文那头 AI 在她独处时记下的，
    // 挑走一句就删掉，所以攒过的话只会说一次。
    let 正在讲攒的话 = 讲攒下的话();

    // 她隔一会儿自己说一句，按当前状态挑。桌面养成里那种「她在过日子」的感觉靠这个。
    let 上次说话 = Date.now();
    window.setInterval(() => {
      if (Date.now() - 上次说话 < 25000) return;
      上次说话 = Date.now();
      // 攒着的话刚讲完那一会儿不顶掉它，让它多留一轮
      if (正在讲攒的话) {
        正在讲攒的话 = false;
        return;
      }
      document.getElementById('speech-bubble').innerText = 此刻的话();
    }, 25000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', 起手);
  else 起手();
</script>
