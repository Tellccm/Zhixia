<div id="预览报错" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;padding:10px 12px;background:#3a2b2b;color:#ffd9d9;font:12px/1.5 monospace;white-space:pre-wrap;z-index:9999;pointer-events:none"></div>
<script>
  // 页面空着就说明入口没跑完，把抓到的报错摊开，别让人对着白屏猜。
  window.setTimeout(() => {
    const 挂上没 = document.querySelector('#app')?.children.length > 0;
    const 内容 = document.querySelector('#app')?.innerHTML.length ?? 0;
    __记报错('两秒半后检查：#app 子节点 ' + (挂上没 ? '有' : '无') + '，字节 ' + 内容);
  }, 2500);
</script>
<script>
  // 产物是一支 ES module。等它在 DOM 里出现之后，把它改成不执行的类型按住，
  // 等上面的依赖脚本把 window.z 挂好，再做成 blob 按 module 重新加载。
  // 外链依赖全是绝对 CDN 地址，不受 blob 的基地址影响。
  //
  // 认脚本不能靠里面的标识符：生产构建会把标识符压短，找关键字一定失手。
  // 认「页面里第一支 type=module 的脚本」是稳的，它就是产物入口。
  (function () {
    var 已放行 = false;
    function 试(第几次) {
      if (已放行) return;
      var 主 = document.querySelector('script[type="module"]');
      var 就绪 = typeof window.z === 'object' && window.z && typeof window.z.object === 'function';
      if (!主 || !就绪) {
        if (第几次 >= 200) {
          __记报错('放行失败：' + (主 ? 'z 一直没就绪' : '找不到产物脚本'));
          return;
        }
        window.setTimeout(function () { 试(第几次 + 1); }, 50);
        return;
      }
      已放行 = true;
      var 源 = 主.textContent;
      主.parentNode.removeChild(主);
      var 址 = URL.createObjectURL(new Blob([源], { type: 'text/javascript' }));
      var 新 = document.createElement('script');
      新.type = 'module';
      新.src = 址;
      新.onerror = function () { __记报错('产物脚本加载失败。'); };
      document.body.appendChild(新);
    }
    试(0);
  })();
</script><div id="自测结果" style="display:none"></div></body>
